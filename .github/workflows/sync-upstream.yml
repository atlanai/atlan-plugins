name: Sync upstream recipes

# Moves the pins in upstream.json to the owning repositories' main and opens a pull request.
# Needs the organization's contents-read GitHub App (CARGO_READER_APP_ID and
# CARGO_READER_APP_PRIVATE_KEY) installed on agent-gateway, app-skill, app-agent, app-knowledge and app-repo; skipped
# without it. A pull request opened with GITHUB_TOKEN does not start CI, so this job runs
# `make check` itself; re-run CI from the Actions tab (workflow_dispatch) before merging.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CARGO_READER_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.CARGO_READER_APP_ID }}
          private-key: ${{ secrets.CARGO_READER_APP_PRIVATE_KEY }}
          owner: atlanai
          repositories: agent-gateway,app-skill,app-agent,app-knowledge,app-repo
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanai/agent-gateway
          ref: main
          path: upstream/agent-gateway
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          sparse-checkout: core/registry-files/defaults
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanai/app-skill
          ref: main
          path: upstream/app-skill
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          sparse-checkout: skill/defaults
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanai/app-agent
          ref: main
          path: upstream/app-agent
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          sparse-checkout: agent/defaults
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanai/app-knowledge
          ref: main
          path: upstream/app-knowledge
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          sparse-checkout: knowledge/defaults
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanai/app-repo
          ref: main
          path: upstream/app-repo
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          sparse-checkout: repo/defaults
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Move the pins and copy
        run: |
          set -euo pipefail
          make sync-adopt AGENT_GATEWAY=upstream/agent-gateway APP_SKILL=upstream/app-skill APP_AGENT=upstream/app-agent \
            APP_KNOWLEDGE=upstream/app-knowledge APP_REPO=upstream/app-repo
          make check
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: bot/sync-upstream
          delete-branch: true
          title: 'chore(upstream): adopt the registry apps'' latest recipes'
          commit-message: 'chore(upstream): adopt the registry apps'' latest recipes'
          add-paths: |
            upstream.json
            plugins/atlanai
          body: |
            Moves the pins in `upstream.json` to `main` of agent-gateway, app-skill, app-agent, app-knowledge
            and app-repo and
            re-copies the recipes they contribute. `make check` passed in the workflow.

            Review the recipe diffs, bump `[plugin] version` in `plugin.toml` if this ships to users, then
            re-run CI from the Actions tab before merging.
