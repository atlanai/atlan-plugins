name: Bug report
description: A plugin, skill or command did not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Leave out tokens, private session ids and any customer data.
        Security problems go to https://atlan.com/responsible-disclosure-program/ instead.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - atlan
        - atlan-analytics
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Claude chat or Cowork
        - OpenAI Codex
        - Cursor
        - VS Code with GitHub Copilot
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: In Claude Code, `/plugin` shows it. Otherwise, the version in the plugin's manifest.
      placeholder: 0.2.1
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
      description: The prompt or command you gave, and the skill you expected it to use.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What the agent did, and any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
