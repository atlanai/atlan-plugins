schema_version: "1.1"
name: troubleshoot-unavailable
tags: [troubleshoot]
execution:
  prompt: |
    My Atlan call keeps failing with 'tool is unavailable; refresh tools/list' when I call registry__get_artifact directly. why?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-troubleshoot
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-troubleshoot"'
  - name: explains-search-mode
    type: llm
    criteria: |
      PASS if the reply explains the connection is in search mode, so registry tools are not listed directly and must be run through mcp__call_tool (with name, arguments, session_id and rationale), or the URL switched to ?tools=full.
      FAIL otherwise.
