schema_version: "1.1"
name: publish-quick-path
tags: [write,skill,create]
execution:
  prompt: |
    Make a skill that tells one short, work-safe joke about startup life when someone asks for a startup joke,
    and publish it to my own Atlan workspace. I approve publishing it without another check.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-author-skills
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-author-skills"'
  - name: no-skill-creator-for-one-file
    type: tool_used
    tool: Skill
    input_match: 'skill-creator'
    min: 0
    max: 0
  - name: reads-no-references
    type: tool_used
    tool: Read
    input_match: 'atlan-author-skills/references/'
    min: 0
    max: 0
  - name: no-tool-discovery
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__describe_tools
    min: 0
    max: 0
  - name: searches-skills-first
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__search_artifacts"[\s\S]*"skill"'
    min: 1
  - name: creates-once-in-personal-workspace-and-waits
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"extension__skill__create"(?=[\s\S]*"workspace_01evaldana")(?=[\s\S]*"wait_for_release"\s*:\s*true)'
    min: 1
    max: 1
  - name: at-most-four-atlan-calls
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"'
    min: 1
    max: 4
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: reports-the-release
    type: llm
    criteria: |
      PASS if the reply says the new skill was published to the user's own workspace (Dana's Workspace) and is active or released, and names its version or release (for example 0.1.0 on latest).
      FAIL if it says nothing was published, asks the user to approve again, or names another workspace.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
