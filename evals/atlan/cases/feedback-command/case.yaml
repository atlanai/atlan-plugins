schema_version: "1.1"
name: feedback-command
tags: [troubleshoot,feedback]
# reply-graders: plain-reply one-next-step, the reply is a feedback draft, and its subject is a call that failed
execution:
  prompt: |
    /atlanai:feedback publishing my skill "quarterly-revenue-sql" to the Finance team workspace failed twice with invalid_arguments saying skills[0].files is required, even though I passed files_from. The skill docs told me files_from works.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-troubleshoot
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-troubleshoot"'
  - name: sends-nothing
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: drafts-and-waits
    type: llm
    criteria: |
      PASS if the reply shows a feedback draft with the user's goal, the steps, what was expected and what was observed (the invalid_arguments error), and then asks the user to edit it or approve it before anything is sent, offering a mailto link or the address ask@atlan.com only as the way the user sends it.
      FAIL if it says the feedback was sent, or gives no draft.
  - name: leaves-out-names
    type: llm
    criteria: |
      PASS if the draft does not contain the skill name "quarterly-revenue-sql" or the workspace name "Finance", describing them generically instead.
      FAIL if either name appears in the draft.
  - name: plain-reply
    type: regex
    target: last_message
    # Voice rules 1, 3, 4 and 5: no em dash, no exclamation, no pleasantry, apology or closing offer.
    pattern: '^(?![\s\S]*(?:—|!(?:\s|$)|\b(?:[Gg]reat question|[Hh]appy to|[Cc]ertainly|[Ss]orry|[Aa]pologi[sz]e|[Uu]nfortunately|[Ll]et me know if|[Ff]eel free to|[Hh]ope this helps)\b))[\s\S]'
  - name: one-next-step
    type: llm
    focus: last_message
    criteria: |
      Judge only how the reply ends, not whether its content is right.
      PASS if it ends with no offer, with one concrete next step, or with one question the user must answer. A question that offers two choices ("retry the split, or revise the report?") is one question, and so is one offer followed by where else to look.
      FAIL only if it ends by offering three or more different things the assistant could do next for the user to pick from ("Want me to A, B or C?", "I can also …").
