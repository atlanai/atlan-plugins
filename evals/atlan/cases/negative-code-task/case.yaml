schema_version: "1.1"
name: negative-code-task
tags: [negative,routing]
execution:
  prompt: |
    Write a Python function that reverses a string, with one example call.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-no-atlan-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-[\w-]+"'
    min: 0
    max: 0
  - name: no-call-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    min: 0
    max: 0
  - name: no-call-read-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-call-write-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-search-tools
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__search_tools
    min: 0
    max: 0
  - name: answers-without-atlan
    type: llm
    criteria: |
      PASS if the reply gives a working Python function and an example call, with no mention of Atlan, skills or a registry. FAIL if it searches or offers to search Atlan first.
