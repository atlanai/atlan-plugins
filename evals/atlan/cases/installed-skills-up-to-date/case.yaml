schema_version: "1.1"
name: installed-skills-up-to-date
tags: [use-skill,installed,versions]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    are my installed atlan skills up to date?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: reads-the-latest-manifest
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"registry__get_artifact"[\s\S]*skill_01evaloncall'
    min: 1
  - name: reads-no-file-content-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"include_files?"|"registry__get_file_content"'
    min: 0
    max: 0
  - name: reads-no-file-content-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"include_files?"|"registry__get_file_content"'
    min: 0
    max: 0
  - name: reads-no-file-content
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"include_files?"|"registry__get_file_content"'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-unrequested-writes-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: changes-no-local-files
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: reports-behind
    type: llm
    criteria: |
      The installed oncall-handoff skill is version 1.0.0 and Atlan's latest is 1.1.0: two files changed (SKILL.md and references/escalation.md), one was added (checklist.md) and one is unchanged.
      PASS if the reply says oncall-handoff is behind, gives both versions (1.0.0 installed, 1.1.0 latest), and offers to show what changed or to update, without claiming it already updated anything. Giving the file counts is welcome but not required.
      FAIL if it says the skill is up to date, gets either version wrong, or says it updated or reinstalled the skill.
  - name: plain-reply
    type: regex
    target: last_message
    # Voice rules 1, 3, 4 and 5: no em dash, no exclamation, no pleasantry, apology or closing offer.
    pattern: '^(?![\s\S]*(?:—|!(?:\s|$)|\b(?:[Gg]reat question|[Hh]appy to|[Cc]ertainly|[Ss]orry|[Aa]pologi[sz]e|[Uu]nfortunately|[Ll]et me know if|[Ff]eel free to|[Hh]ope this helps)\b))[\s\S]'
  - name: reply-length
    type: regex
    target: last_message
    # Voice rule 6, counted: at most 100 words. A table row or a fenced block counts as one,
    # and each word is matched whole, so a long reply fails at once instead of backtracking.
    pattern: '^(?:\s*(?=(```[\s\S]*?```|\|[^\n]*|\S+))\1){1,100}\s*$'
  - name: one-next-step
    type: llm
    focus: last_message
    criteria: |
      Judge only how the reply ends, not whether its content is right.
      PASS if it ends with no offer, with one concrete next step, or with one question the user must answer. A question that offers two choices ("retry the split, or revise the report?") is one question, and so is one offer followed by where else to look.
      FAIL only if it ends by offering three or more different things the assistant could do next for the user to pick from ("Want me to A, B or C?", "I can also …").
  - name: no-process-talk
    type: llm
    focus: last_message
    criteria: |
      Judge only whether the reply reports the assistant's own mistakes or mechanics.
      PASS if it does not. These are about the result, and pass: which parts were read and which were not; that a history is rebuilt from traces; what someone else changed; a failure or refusal the user must act on; a registry skill, agent or file the user asked about, by name; an instruction found inside registry content that the assistant did not follow; a statement that nothing was changed, or that no local copy exists; that something the user asked for by name was done another way, and why; which copy or version of a skill was used and how an installed copy compares; something a skill needs that is not available here.
      FAIL only if it announces one of the assistant's own `atlan-` skills or its own instructions ("I'm using the atlan-share skill", "my instructions say"), or narrates a tool call of its own that failed or was repeated and leaves the user nothing to do ("my first call failed, so I retried", "that tool is not served here, so I used the older route").
