schema_version: "1.1"
name: use-skill-installed-by-name
tags: [use-skill,installed]
execution:
  prompt: |
    use our security-review skill on the change I'm about to show you
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-registry-search
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__search_artifacts"'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: follows-the-installed-skill
    type: llm
    criteria: |
      A skill named security-review is already installed in this session from the plugin folder (atlanai:security-review, Acme's pre-merge review). Claude Code may also list its own generic security-review skill.
      PASS if the reply uses or proposes the installed Acme security-review skill and asks for the change to review (the diff, a file or a PR number), without searching Atlan or offering registry results. Naming both installed skills and saying which one it will use is fine.
      FAIL if it lists Atlan search results, asks which of several registry skills to use, or starts reviewing something it invented.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
