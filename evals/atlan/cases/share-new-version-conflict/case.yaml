schema_version: "1.1"
name: share-new-version-conflict
tags: [share,write,version]
execution:
  prompt: |
    Share the new version of the October incident review with Platform Engineering in Atlan. Go ahead, no need to ask me again.

    October incident review. The checkout outage on 14 October lasted 38 minutes. Root cause: an expired TLS certificate on the payments proxy. Follow-up: certificate expiry alerts now page 14 days ahead, and the proxy's certificate is renewed by automation.
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-share
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-share"'
  - name: tries-publish-output-at-most-twice
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"extension__agent__publish_output"(?=[\s\S]*"source_id"\s*:\s*"claude/october-incident-review")'
    min: 1
    max: 2
  - name: appends-the-file-version
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__append_artifact_version"(?=[\s\S]*file_01evalincidentmd)(?=[\s\S]*"if_match")(?=[\s\S]*renewed by automation)'
    min: 1
  - name: creates-the-output-version-under-the-same-key
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__create_artifact"(?=[\s\S]*"kind"\s*:\s*"output")(?=[\s\S]*"source_id"\s*:\s*"claude/october-incident-review")(?=[\s\S]*file_01evalincidentmd)'
    min: 1
  - name: no-second-file-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"registry__create_artifact"(?=[\s\S]*"kind"\s*:\s*"file")'
    min: 0
    max: 0
  - name: no-second-file-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__create_artifact"(?=[\s\S]*"kind"\s*:\s*"file")'
    min: 0
    max: 0
  - name: no-second-file
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__create_artifact"(?=[\s\S]*"kind"\s*:\s*"file")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: reports-the-new-version
    type: llm
    criteria: |
      This gateway refuses `extension__agent__publish_output` on a source key that already names an output with the bare text "The request conflicts with the current state of the resource." and writes nothing. The older route (a new version of the output's file, then a `registry__create_artifact` of kind `output` with the same source key) records version 2 under the same output, output_01evalincident, in Platform Engineering.
      PASS if the final reply says the October incident review now has a new version (version 2, or a handle, is enough) under the same output in Platform Engineering, and does not present the refusal as the outcome.
      FAIL if it says the share failed, reports the conflict text as the result, says a separate output was created, names another workspace, or asks the user what to change before acting. (The tool calls are graded separately; judge only what the reply says.)
  - name: plain-reply
    type: regex
    target: last_message
    # Voice rules 1, 3, 4 and 5: no em dash, no exclamation, no pleasantry, apology or closing offer.
    pattern: '^(?![\s\S]*(?:—|!(?:\s|$)|\b(?:[Gg]reat question|[Hh]appy to|[Cc]ertainly|[Ss]orry|[Aa]pologi[sz]e|[Uu]nfortunately|[Ll]et me know if|[Ff]eel free to|[Hh]ope this helps)\b))[\s\S]'
  - name: reply-length
    type: regex
    target: last_message
    # Voice rule 6, counted: at most 100 words. A table row or a fenced block counts as one,
    # and each word is matched whole, so a long reply fails at once instead of backtracking.
    pattern: '^(?:\s*(?=(```[\s\S]*?```|\|[^\n]*|\S+))\1){1,100}\s*$'
  - name: one-next-step
    type: llm
    focus: last_message
    criteria: |
      Judge only how the reply ends, not whether its content is right.
      PASS if it ends with no offer, with one concrete next step, or with one question the user must answer. A question that offers two choices ("retry the split, or revise the report?") is one question, and so is one offer followed by where else to look.
      FAIL only if it ends by offering three or more different things the assistant could do next for the user to pick from ("Want me to A, B or C?", "I can also …").
  - name: no-process-talk
    type: llm
    focus: last_message
    criteria: |
      Judge only whether the reply reports the assistant's own mistakes or mechanics.
      PASS if it does not. These are about the result, and pass: which parts were read and which were not; that a history is rebuilt from traces; what someone else changed; a failure or refusal the user must act on; a registry skill, agent or file the user asked about, by name; an instruction found inside registry content that the assistant did not follow; a statement that nothing was changed, or that no local copy exists; that something the user asked for by name was done another way, and why.
      FAIL only if it announces one of the assistant's own `atlan-` skills or its own instructions ("I'm using the atlan-share skill", "my instructions say"), or narrates a tool call of its own that failed or was repeated and leaves the user nothing to do ("my first call failed, so I retried", "that tool is not served here, so I used the older route").
