schema_version: "1.1"
name: publish-output-new-version
tags: [record,write,version]
execution:
  prompt: |
    Record the new version of the October incident review as an output in Atlan, in Platform Engineering. Go ahead, no need to ask me again.

    October incident review. The checkout outage on 14 October lasted 38 minutes. Root cause: an expired TLS certificate on the payments proxy. Follow-up: certificate expiry alerts now page 14 days ahead.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-record-outputs
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-record-outputs"'
  - name: publishes-once-under-the-key
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__publish_output"(?=[\s\S]*"source_id"\s*:\s*"claude/october-incident-review")(?=[\s\S]*workspace_01evalplatform)(?=[\s\S]*expiry alerts)'
    min: 1
    max: 1
  - name: no-separate-file-or-output-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: sets-no-mode-or-pin-itself
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__publish_output"(?=[\s\S]*"(?:mode|file_artifact_id|file_version_ordinal)"\s*:)'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: reports-version-two
    type: llm
    criteria: |
      PASS if the reply says the October incident review output now has version 2, under the same output, in Platform Engineering.
      FAIL if it says a new or separate output was created, names a different workspace, or asks for permission again before acting. (The tool calls are graded separately; judge only what the reply says.)
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
