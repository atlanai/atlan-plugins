schema_version: "1.1"
name: linear-not-connected
tags: [mcp-servers]
execution:
  prompt: |
    file a linear ticket for the failing invoice pipeline, via atlan
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-use-mcp-servers
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-use-mcp-servers"'
  - name: no-lookalike-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"extension__eval__create_issue"'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: asks-to-connect
    type: llm
    criteria: |
      PASS if the reply says Linear is registered in Atlan but the user has not connected their Linear account, and asks to connect it (or shows a sign-in link from mcp__connect_server), without filing anything elsewhere.
      FAIL if it files an issue with a different tool (such as an eval "create_issue"), claims the ticket was filed, or asks for a Linear API key.
