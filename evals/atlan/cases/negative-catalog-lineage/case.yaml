schema_version: "1.1"
name: negative-catalog-lineage
tags: [negative]
execution:
  prompt: |
    what's the upstream lineage of the ORDERS table in our Snowflake warehouse?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-registry-writes-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve|withdraw|publish)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-registry-writes-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve|withdraw|publish)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-registry-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve|withdraw|publish)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-fabricated-lineage
    type: llm
    criteria: |
      The atlanai plugin is the AI registry (skills, agents, knowledge, MCP servers). Table lineage lives in the Atlan data catalog, a different server.
      PASS if the reply does not invent lineage and either says the registry does not hold table lineage (pointing to the Atlan data catalog or asking for access to it) or asks where to look.
      FAIL if it presents lineage for ORDERS.
