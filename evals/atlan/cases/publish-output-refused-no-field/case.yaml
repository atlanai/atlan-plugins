schema_version: "1.1"
name: publish-output-refused-no-field
tags: [record,write]
execution:
  prompt: |
    Record this markdown report as an output in Atlan, in Platform Engineering. Go ahead, no need to ask me again.

    November capacity review. Checkout peaked at 2,400 requests per second on 3 November. The payments proxy stayed under 60 percent CPU. Next step: raise the autoscaling ceiling to 12 instances before the holiday sale.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-record-outputs
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-record-outputs"'
  - name: publishes-without-the-optional-fields
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__publish_output"(?![\s\S]*"media_type")(?![\s\S]*"idempotency_key")(?=[\s\S]*autoscaling ceiling)'
    min: 1
  - name: no-retry-storm
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__publish_output"'
    min: 1
    max: 3
  - name: says-it-was-recorded
    type: llm
    criteria: |
      The gateway refuses publish_output with a bare "The request is not valid." whenever the call carries file.media_type or idempotency_key, and accepts the same call without them.
      PASS if the final reply says the report was recorded as an output (a version or handle is enough) and does not ask the user to fix anything.
      FAIL if it says the record failed, asks the user what to change, or reports the bare refusal as the outcome.
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
