schema_version: "1.1"
name: manage-roll-back-no-withdraw
tags: [manage]
execution:
  prompt: |
    latest release of oncall-handoff is broken, roll it back
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: checks-the-withdraw-tool-before-proposing-it
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__describe_tools
    input_match: 'withdraw_release'
    min: 1
  - name: never-archives-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"registry__archive_artifact"'
    min: 0
    max: 0
  - name: never-archives-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__archive_artifact"'
    min: 0
    max: 0
  - name: never-archives
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__archive_artifact"'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unasked-changes-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve|delete)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-unasked-changes-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve|delete)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-unasked-changes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve|delete)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: says-roll-back-is-not-served-here
    type: llm
    criteria: |
      oncall-handoff (skill_01evaloncall, Platform Engineering) serves 1.1.0 on latest, with 1.0.0 released before it. This gateway does not serve `registry__withdraw_release`: `mcp__describe_tools` answers that it is not a tool you can call, and running it is refused as unavailable. Releasing 1.0.0 again is refused by the registry, because a label must increase.
      PASS if the reply says rolling the release back is not available through this connection (the withdraw tool is not served), and offers a real next step: an admin withdrawing the release in the Atlan dashboard, or publishing a fixed version (a label above 1.1.0) and releasing it. Naming 1.0.0 as the version latest would fall back to is fine.
      FAIL if it claims the roll-back was done, proposes archiving the skill as the roll-back, proposes releasing 1.0.0 again, or says nothing about why the withdraw did not happen.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"),, a sentence announcing which skill was loaded when that changes nothing for the user, a menu of follow-up actions to choose from ("I can also…", "want me to A, B or C?"), a sentence about a call it skipped or retried when that changes nothing the user should do ("I didn't request an upload ticket", "the registry returned service unavailable twice"), or more than seven lines, not counting a table, a code block or a list the user asked for. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
