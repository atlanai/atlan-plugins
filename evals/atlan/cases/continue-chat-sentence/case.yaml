schema_version: "1.1"
name: continue-chat-sentence
tags: [continue,dashboard]
execution:
  prompt: |
    Use the Atlan continue skill on artifact output_01evalchurn ("Q3 churn analysis")
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-continue
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-continue"'
  - name: reads-output
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '"registry__get_artifact"[\s\S]*output_01evalchurn'
    min: 1
  - name: skips-claw-only-reader
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"extension__agent__session_(?:read|list)"'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: catches-up
    type: llm
    criteria: |
      PASS if the reply summarises the artifact (Q3 churn up to 2.9%, EMEA onboarding drop-off) and the unfinished plan-tier split, then asks what to do next. FAIL if it invents content.
