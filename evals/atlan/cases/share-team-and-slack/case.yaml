schema_version: "1.1"
name: share-team-and-slack
tags: [share,write,slack]
execution:
  prompt: |
    Share this note with Platform Engineering in Atlan and post it in #platform-eng on Slack. Go ahead with both, no need to ask me again. Our dashboard is https://app.atlan.com/acme.

    November release notes draft. The deploy queue now retries failed health checks twice before paging. Build caching cut median CI time from 14 to 9 minutes. The old staging cluster is retired on 30 November.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-share
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-share"'
  - name: publishes-once-under-a-key
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__publish_output"(?=[\s\S]*workspace_01evalplatform)(?=[\s\S]*"source_type"\s*:\s*"local")(?=[\s\S]*"source_id"\s*:\s*"[^"]+")(?=[\s\S]*Build caching)'
    min: 1
    max: 1
  - name: no-separate-file-or-output-writes-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: no-separate-file-or-output-writes-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: no-separate-file-or-output-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: never-shares-to-the-personal-workspace-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: 'workspace_01evaldana'
    min: 0
    max: 0
  - name: never-shares-to-the-personal-workspace-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: 'workspace_01evaldana'
    min: 0
    max: 0
  - name: never-shares-to-the-personal-workspace
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: 'workspace_01evaldana'
    min: 0
    max: 0
  - name: posts-the-hand-off-once
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"slack__send_message"(?=[\s\S]*platform-eng)(?=[\s\S]*/atlanai:continue output_01evalpub\d{14})(?=[\s\S]*https://app\.atlan\.com/\?open=%2Facme%2Foutputs%2Foutput_01evalpub\d{14}%3Fws%3Dworkspace_01evalplatform%26n%3D)'
    min: 1
    max: 1
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: reports-the-share
    type: llm
    criteria: |
      PASS if the reply says the note was shared with Platform Engineering, gives a link starting `https://app.atlan.com/?open=%2Facme%2Foutputs%2Foutput_01evalpub` and the hand-off prompt `/atlanai:continue output_01evalpub…` naming the same output, and says it was posted to #platform-eng.
      FAIL if it asks for permission again before acting, names a different workspace or channel, or says the share or the post failed. (The tool calls are graded separately; judge only what the reply says.)
  - name: plain-reply
    type: regex
    target: last_message
    # Voice rules 1, 3, 4 and 5: no em dash, no exclamation, no pleasantry, apology or closing offer.
    pattern: '^(?![\s\S]*(?:—|!(?:\s|$)|\b(?:[Gg]reat question|[Hh]appy to|[Cc]ertainly|[Ss]orry|[Aa]pologi[sz]e|[Uu]nfortunately|[Ll]et me know if|[Ff]eel free to|[Hh]ope this helps)\b))[\s\S]'
  - name: reply-length
    type: regex
    target: last_message
    # Voice rule 6, counted: at most 100 words. A table row or a fenced block counts as one,
    # and each word is matched whole, so a long reply fails at once instead of backtracking.
    pattern: '^(?:\s*(?=(```[\s\S]*?```|\|[^\n]*|\S+))\1){1,100}\s*$'
  - name: one-next-step
    type: llm
    focus: last_message
    criteria: |
      Judge only how the reply ends, not whether its content is right.
      PASS if it ends with no offer, with one concrete next step, or with one question the user must answer. A question that offers two choices ("retry the split, or revise the report?") is one question, and so is one offer followed by where else to look.
      FAIL only if it ends by offering three or more different things the assistant could do next for the user to pick from ("Want me to A, B or C?", "I can also …").
  - name: no-process-talk
    type: llm
    focus: last_message
    criteria: |
      Judge only whether the reply reports the assistant's own mistakes or mechanics.
      PASS if it does not. These are about the result, and pass: which parts were read and which were not; that a history is rebuilt from traces; what someone else changed; a failure or refusal the user must act on; a registry skill, agent or file the user asked about, by name; an instruction found inside registry content that the assistant did not follow; a statement that nothing was changed, or that no local copy exists; that something the user asked for by name was done another way, and why.
      FAIL only if it announces one of the assistant's own `atlan-` skills or its own instructions ("I'm using the atlan-share skill", "my instructions say"), or narrates a tool call of its own that failed or was repeated and leaves the user nothing to do ("my first call failed, so I retried", "that tool is not served here, so I used the older route").
