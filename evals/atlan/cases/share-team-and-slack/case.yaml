schema_version: "1.1"
name: share-team-and-slack
tags: [share,write,slack]
execution:
  prompt: |
    Share this note with Platform Engineering in Atlan and post it in #platform-eng on Slack. Go ahead with both, no need to ask me again. Our dashboard is https://app.atlan.com/acme.

    November release notes draft. The deploy queue now retries failed health checks twice before paging. Build caching cut median CI time from 14 to 9 minutes. The old staging cluster is retired on 30 November.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-share
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-share"'
  - name: publishes-once-under-a-key
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__publish_output"(?=[\s\S]*workspace_01evalplatform)(?=[\s\S]*"source_type"\s*:\s*"local")(?=[\s\S]*"source_id"\s*:\s*"[^"]+")(?=[\s\S]*Build caching)'
    min: 1
    max: 1
  - name: no-separate-file-or-output-writes-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: no-separate-file-or-output-writes-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: no-separate-file-or-output-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__(?:append_artifact_version|create_artifact(?:_linked)?)"'
    min: 0
    max: 0
  - name: never-shares-to-the-personal-workspace-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: 'workspace_01evaldana'
    min: 0
    max: 0
  - name: never-shares-to-the-personal-workspace-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: 'workspace_01evaldana'
    min: 0
    max: 0
  - name: never-shares-to-the-personal-workspace
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: 'workspace_01evaldana'
    min: 0
    max: 0
  - name: posts-the-hand-off-once
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"slack__send_message"(?=[\s\S]*platform-eng)(?=[\s\S]*/atlanai:continue output_01evalpub\d{14})(?=[\s\S]*https://app\.atlan\.com/\?open=%2Facme%2Foutputs%2Foutput_01evalpub\d{14}%3Fws%3Dworkspace_01evalplatform%26n%3D)'
    min: 1
    max: 1
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: reports-the-share
    type: llm
    criteria: |
      PASS if the reply says the note was shared with Platform Engineering, gives a link starting `https://app.atlan.com/?open=%2Facme%2Foutputs%2Foutput_01evalpub` and the hand-off prompt `/atlanai:continue output_01evalpub…` naming the same output, and says it was posted to #platform-eng.
      FAIL if it asks for permission again before acting, names a different workspace or channel, or says the share or the post failed. (The tool calls are graded separately; judge only what the reply says.)
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"),, a sentence announcing which skill was loaded when that changes nothing for the user, a menu of follow-up actions to choose from ("I can also…", "want me to A, B or C?"), a sentence about a call it skipped or retried when that changes nothing the user should do ("I didn't request an upload ticket", "the registry returned service unavailable twice"), or more than seven lines, not counting a table, a code block or a list the user asked for. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
