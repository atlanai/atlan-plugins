schema_version: "1.1"
name: gateway-unavailable
tags: [use-skill,troubleshoot,retry]
execution:
  prompt: |
    What does the Atlan skill skill_01evalsecrev01 do?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: retries-the-failed-read
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__get_artifact"[\s\S]*skill_01evalsecrev01'
    min: 3
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: answers-after-the-outage
    type: llm
    criteria: |
      PASS if the reply says what the security-review skill does, read after the gateway's temporary failures. Mentioning that Atlan was briefly unavailable is fine.
      FAIL if it tells the user Atlan or the plugin is broken, asks the user to try again later instead of having retried the read itself, or describes the skill without having read it.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
