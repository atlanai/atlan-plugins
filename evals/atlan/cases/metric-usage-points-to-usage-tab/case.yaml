schema_version: "1.1"
name: metric-usage-points-to-usage-tab
tags: [find, adoption, analytics]
execution:
  prompt: |
    Who uses our load_factor metric, at which version, and how often is it read?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: distinguishes-metric-usage-from-skill-loads
    type: llm
    focus: last_message
    criteria: |
      Metric and saved-query reads and reported run use are recorded by Atlan. This connection has no usage statistics tool. The artifact's Usage tab is the supported place to see reads, users and runs. Dependency edges do not establish read counts, and there is no supplied numeric usage evidence.
      PASS if the answer points to the metric's Usage tab and distinguishes unavailable MCP counts from unrecorded data. It must not invent counts or versions, or infer read volume from dependency edges or trace spans.
      FAIL if it says Atlan does not record or count metric reads, merely offers dependency links without the Usage tab, or invents usage evidence.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
