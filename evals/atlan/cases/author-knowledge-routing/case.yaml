schema_version: "1.1"
name: author-knowledge-routing
tags: [routing,write]
execution:
  prompt: |
    I have a folder of Markdown glossary notes about our billing terms. How do I turn them into a knowledge bundle in Atlan?
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-atlan-author-knowledge
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-author-knowledge"'
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlan_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: routes-to-knowledge
    type: llm
    criteria: |
      PASS if the reply explains how to publish the notes as an Atlan knowledge bundle (a `knowledge` artifact) and asks for the folder or the workspace before writing anything. FAIL if it writes something without asking, or says Atlan has no way to do this.
