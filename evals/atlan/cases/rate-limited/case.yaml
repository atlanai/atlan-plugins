schema_version: "1.1"
name: rate-limited
tags: [find,troubleshoot,retry]
execution:
  prompt: |
    Which of our agents in Atlan use the platform team's security-review skill, skill_01evalsecrev01?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: retries-the-refused-read
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"registry__get_related_artifacts"'
    min: 2
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: answers-from-the-retry
    type: llm
    criteria: |
      PASS if the reply names Review bot (agent_01evalreviewbot, in the platform workspace) as the one agent that uses the skill. Mentioning that one read was rate-limited and retried is fine.
      FAIL if it says it could not read the relationships, blames the user, asks the user to retry later instead of having retried a read itself, or names an agent other than Review bot.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
