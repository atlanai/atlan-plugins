schema_version: "1.1"
name: who-uses-skill
tags: [find]
execution:
  prompt: |
    which of our agents use the platform team's security-review skill in atlan?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-edges
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"registry__get_related_artifacts"[\s\S]*skill_01evalsecrev01'
    min: 1
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: names-agent
    type: llm
    criteria: |
      PASS if the reply names the Review bot agent (agent_01evalreviewbot) as using the skill. FAIL otherwise.
