schema_version: "1.1"
name: negative-rewrite-tone
tags: [negative,routing]
execution:
  prompt: |
    Rewrite this sentence so it sounds warmer: "Your request has been received and will be processed."
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-no-atlan-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-[\w-]+"'
    min: 0
    max: 0
  - name: no-call-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    min: 0
    max: 0
  - name: no-call-read-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-call-write-tool
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-search-tools
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__search_tools
    min: 0
    max: 0
  - name: answers-without-atlan
    type: llm
    criteria: |
      PASS if the reply gives a warmer rewrite of the sentence and nothing about Atlan, skills or registries. FAIL if it mentions Atlan, offers to search a registry, or asks to sign in.
  - name: plain-reply
    type: regex
    target: last_message
    # Voice rules 1, 3, 4 and 5: no em dash, no exclamation, no pleasantry, apology or closing offer.
    pattern: '^(?![\s\S]*(?:—|!(?:\s|$)|\b(?:[Gg]reat question|[Hh]appy to|[Cc]ertainly|[Ss]orry|[Aa]pologi[sz]e|[Uu]nfortunately|[Ll]et me know if|[Ff]eel free to|[Hh]ope this helps)\b))[\s\S]'
