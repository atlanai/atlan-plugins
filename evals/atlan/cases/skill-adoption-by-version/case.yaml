schema_version: "1.1"
name: skill-adoption-by-version
tags: [find,adoption]
execution:
  prompt: |
    which versions of the oncall-handoff skill are our agents on? is anyone still on 1.0.0?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-edges
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"registry__get_related_artifacts"[\s\S]*skill_01evaloncall'
    min: 1
  - name: reads-an-agent-manifest
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"registry__get_artifact"[\s\S]*agent_01eval(?:handoffbot|pagersum)'
    min: 1
  - name: counts-no-traces-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"(?:registry|extension__agent)__(?:list_traces|get_trace|get_trace_spans|list_session_traces)"'
    min: 0
    max: 0
  - name: counts-no-traces-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"(?:registry|extension__agent)__(?:list_traces|get_trace|get_trace_spans|list_session_traces)"'
    min: 0
    max: 0
  - name: counts-no-traces
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry|extension__agent)__(?:list_traces|get_trace|get_trace_spans|list_session_traces)"'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: rails-beside-arguments
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"arguments"\s*:\s*\{[^{}]*(?:"session_id"\s*:\s*"mcp_session|"rationale"|"objective")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: every-call-has-rationale
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '^(?![\s\S]*"rationale")'
    min: 0
    max: 0
  - name: no-unrequested-writes-on-read-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_read_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-unrequested-writes-on-write-runner
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_write_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: no-unrequested-writes
    type: tool_used
    tool: mcp__plugin_atlanai_atlan__mcp__call_tool
    input_match: '"name"\s*:\s*"(?:registry__(?:create|patch|archive|move|append|relate|release|approve)\w*|extension__\w+__create\w*)"'
    min: 0
    max: 0
  - name: versions-per-agent
    type: llm
    criteria: |
      oncall-handoff's latest is 1.1.0. The agent handoff-bot pins 1.0.0 and pager-summary pins 1.1.0, both through their manifests. A third agent depends on it from a workspace the user cannot read. Two recorded outputs drew on the skill.
      PASS if the reply says handoff-bot is still on 1.0.0 and pager-summary is on 1.1.0 (the latest), and mentions the agent the user cannot see. Mentioning the outputs is welcome but not required.
      FAIL if it gets either agent's version wrong, says nobody is on 1.0.0, or invents agents.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
