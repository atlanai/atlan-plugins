schema_version: "1.1"
name: routing-connect-natural
tags: [analytics, routing]
execution:
  prompt: |
    Connect my Snowflake warehouse for Atlan analytics
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-skill
    type: tool_used
    tool: Skill
    input_match: 'atlan-(analytics|ontology)'
  - name: reads-expected
    type: tool_used
    tool: Read
    input_match: 'references/connect\.md'
    min: 1
  - name: avoids-wrong-branch
    type: tool_used
    tool: Read
    input_match: 'references/full-agent\.md'
    min: 0
    max: 0
