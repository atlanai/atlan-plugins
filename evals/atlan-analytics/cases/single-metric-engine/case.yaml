schema_version: "1.1"
name: single-metric-engine
tags: [analytics, setup, metrics, regression]
execution:
  prompt: |
    We are at the Build checkpoint of the Fixit demo. The user chose Dashboard only,
    and the demo data is loaded. Explain which generation path you will use for the metrics
    and what the person sees before the cards are built. This is a workflow checkpoint:
    read the installed instructions, but do not run commands, inspect source files,
    author metrics or call Registry tools in this turn. No metrics have been checked yet.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: one-engine-for-preview-and-completion
    type: llm
    focus: last_message
    criteria: |
      PASS if every dashboard metric uses the main metrics engine in one saved run, the demo
      lists the merged metric names at the card gate before any card is written, and the run
      then authors every card and completes full validation before export. The demo runs no
      first-metric preview and asks no "build the rest" question.
      FAIL if the demo/local-file path bypasses the engine, uses a separate shape miner,
      manual Registry-body authoring or standalone dashboard translator, runs a separate
      first-metric preview, or claims unchecked metrics are publishable or checked.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
