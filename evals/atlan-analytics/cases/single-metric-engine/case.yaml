schema_version: "1.1"
name: single-metric-engine
tags: [analytics, setup, metrics, regression]
execution:
  prompt: |
    We are at the Build checkpoint of the Fixit demo. The user chose Dashboard only,
    and the local source survey is complete. Explain which generation path you will use
    for the full selected collection and when the next customer choice happens. This is a workflow checkpoint:
    read the installed instructions, but do not run commands, inspect source files,
    author metrics or call Registry tools in this turn. No metrics have been checked yet.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: one-engine-without-mid-build-choice
    type: llm
    focus: last_message
    criteria: |
      PASS if the complete selected dashboard collection uses the main metrics engine in
      one saved run, with all card, consistency and relationship gates completed before
      export. Keep progress visible, then review the collection and actual check results
      before the save choice. FAIL if it pauses for one metric, asks Build the rest, requires
      an early worked example, bypasses the engine for local files, hand-authors Registry
      bodies, or claims checks that did not run.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
