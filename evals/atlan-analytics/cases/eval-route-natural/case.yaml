schema_version: "1.1"
name: eval-route-natural
tags: [analytics, evals, routing]
execution:
  prompt: |
    We set up Atlan Analytics in this project last week. Build a set of test questions from the
    queries our analysts already run, so we can check the agent with them later.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Since nothing can run here, say in one short reply what you will do and what I will get back.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-eval-generation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eval-generation"'
    min: 1
  - name: no-metrics-engine
    type: tool_used
    tool: Read
    input_match: 'references/metrics-engine\.md'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: eval-plan
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says it will pick questions from the past queries, pair each with the SQL
      whose result is the right answer, write them as a set in this project, and ask whether to keep
      it on this machine or save it to Atlan Trident.
      FAIL if it asks the person to write the questions or the SQL by hand, promises to build or
      change metrics, runs or scores the questions itself, proposes a train, validation and holdout
      split, or registers a new agent.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
