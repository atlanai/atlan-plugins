schema_version: "1.1"
name: investigate-unexplained-remainder
tags: [analytics, reliability, investigate]
execution:
  prompt: |
    Use Atlan Analytics Investigate to finish this finding from the fresh read-only results
    already obtained in this turn. This is a finding-writing checkpoint, not a request to rerun
    tools. The released Net Revenue metric is the sum of invoice amounts, credit notes
    excluded. Source receipt: metric_example, release_example, latest; no release between the
    two months. Both months are complete, and the eight months before September ranged from
    980,000 to 1,020,000. All figures are GBP.
    Fresh totals: September 1,000,000; October 880,000.
    Fresh results by region, September then October: North 400,000 and 330,000; South 350,000
    and 340,000; West 200,000 and 190,000. The region query returned only these three rows.
    Explain the fall in October.
    Do not execute new queries, alter definitions or publish anything.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-investigate
    type: tool_used
    tool: Skill
    input_match: 'atlan-analytics-investigate'
  - name: reports-the-remainder
    type: llm
    focus: last_message
    criteria: |
      PASS only if the answer states the total fell 120,000, attributes 70,000 to North, 10,000 to South and 10,000 to West (90,000 in all), and reports the remaining 30,000 as unexplained or not covered by the region rows (for example revenue with no region, 50,000 in September against 20,000 in October).
      FAIL if the contributions are presented as adding up to the whole fall, the 30,000 is spread across regions or omitted, shares are computed so that they sum to 100% without the remainder, or it claims new execution.
  - name: no-new-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
