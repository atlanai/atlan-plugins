schema_version: "1.1"
name: eval-improve-diagnoses
tags: [analytics, evals, improve, diagnose]
execution:
  prompt: |
    Continue my accuracy check on the Indigo workspace's context with Atlan Analytics.
    The check scored 4 of 5. The miss: "What was the average turnaround at DEL in October?"
    tests the turnaround_time metric. The trusted query leaves out cancelled legs; the agent
    used turnaround_time, whose rule keeps them, and answered 47.9 minutes where 41.2 was expected.
    I pick Improve it.
    The host exposes no native question tool in this test, so use ordinary chat. Don't mention this test's limits in your reply.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: never-edits-the-metric
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__(?:patch_artifact|append_artifact_version|release_artifact)"|improvements/metric/'
    min: 0
    max: 0
  - name: diagnoses-without-applying
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply names why the turnaround question failed (turnaround_time keeps cancelled
      legs where the trusted query leaves them out) and recommends changing that metric's rule to
      leave cancelled legs out, without saying any metric was changed or any proposal was filed.
      FAIL if it says the metric was changed, files or offers to file a proposal in Metric Studio,
      or asks whether to apply the fix.
