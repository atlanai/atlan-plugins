schema_version: "1.1"
name: routing-build-natural
tags: [analytics, routing]
execution:
  prompt: |
    Build a talk-to-data agent for our revenue questions
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-skill
    type: tool_used
    tool: Skill
    input_match: 'atlan-(analytics|ontology)'
  - name: reads-shared-setup-route
    type: tool_used
    tool: Read
    input_match: 'references/setup\.md'
    min: 1
  - name: avoids-agent-preflight
    type: tool_used
    tool: Read
    input_match: 'references/full-agent\.md'
    min: 0
    max: 0
  - name: avoids-wrong-branch
    type: tool_used
    tool: Read
    input_match: 'references/metrics\.md'
    min: 0
    max: 0
  - name: offers-the-deployed-agent-once
    type: llm
    criteria: |
      PASS if the reply starts the setup route (asks for or surveys a source of revenue context, or explains that this chat answers from published metrics once they exist) and offers a separately deployed agent with an eval set in at most one or two sentences, switching only if the person asks.
      FAIL if it starts the full-agent build preflight (purpose questions, eval set, registration) unasked, or gives no hint that a deployed agent is available.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
