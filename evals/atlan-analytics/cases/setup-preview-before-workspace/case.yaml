schema_version: "1.1"
name: setup-preview-before-workspace
tags: [analytics, setup, preview]
context:
  scaffold_script: scaffold.sh
execution:
  # The run in this folder built 3 metrics and 1 query, schema checked with SQL untested, chose
  # no destination, and its last session only linked preview.html (fixtures/shipping_run.py,
  # preview). A resume shows one real sample before any destination question.
  prompt: |
    Let's carry on with the shipping metrics setup from where we left off.
    The host exposes no native question tool in this test, so use ordinary chat.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: visible-before-destination
    type: llm
    focus: last_message
    criteria: |
      The saved run has 3 metric candidates (Shipped units, Shipping cost, Shipped weight) and
      1 saved query, all schema checked with SQL untested, and no destination chosen.
      Shipped units is total units on shipped orders, SUM(s.units), filter s.status = 'shipped',
      from the shipments dbt model and query history.
      PASS only if the reply shows at least one actual saved metric with its meaning,
      calculation, population, source and untested check status before any destination or
      save question, and offers the rest or more detail without dumping everything.
      A link to preview.html or a helper's output alone fails, as do invented results, values
      or publication, or a workspace question before the sample.
  - name: no-extra-approval-to-preview
    type: llm
    focus: last_message
    criteria: |
      PASS if it shows a saved candidate directly, without first asking whether to show them
      or for approval to run a read-only preview. A destination or continuation choice after
      the sample is fine. FAIL if it claims anything was saved to Atlan.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply leads with the preview or the current stage, uses plain language and
      has no greeting, apology or generic closing offer. The collection review has no word
      limit. A concrete next choice after the visible sample is appropriate. FAIL on narration
      of the helper commands run.
  # Nothing is saved before the person picks a destination.
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
