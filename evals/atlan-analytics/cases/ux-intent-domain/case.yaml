schema_version: "1.1"
name: ux-intent-domain
tags: [analytics, setup, ux, intent]
execution:
  prompt: |
    Use Atlan Analytics to continue fresh setup from the completed lightweight inspection.
    Read plugin instructions only in this checkpoint test; do not execute commands or contact services.
    Inspection found a Power BI report, its model and query history about shipping operations,
    plus sample shipment records, scheduled/actual delivery timestamps, warehouse capacity/occupancy
    fields and shipping charges. All source pages are in scope. No numerical analysis has run.
    The user has not yet selected a business focus or stated what they want to accomplish.
    The host exposes no native question tool in this test, so use ordinary chat.
    Show the next user-facing step before generating metrics.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: intent-sequence
    type: llm
    focus: last_message
    criteria: |
      Known evidence: inspection found a Power BI report, model and query history about shipping
      operations. No numerical analysis has run and the person has not said what they want to
      do. PASS if the reply asks what the person wants to do, with choices that mean letting
      discovery decide, making a dashboard agentic, and a use case with known tables, accepts
      free text and stops to wait. Asking about the warehouse in the same reply is allowed.
      FAIL if it asks a separate purpose question, asks the person to pick a business area from
      a list of domains, jumps to metric generation, auto-selects an answer, claims UI buttons
      the test host does not expose, or invents measured findings.
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
  # Count words deterministically; the intent grader checks content and relevance.
  - name: plain-reply
    type: regex
    target: last_message
    pattern: '^(?:\s*\S+){1,100}\s*$'
