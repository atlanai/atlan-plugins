schema_version: "1.1"
name: routing-dashboard-arg
tags: [analytics, routing, dashboard]
execution:
  prompt: |
    /atlanai-analytics:atlan-analytics dashboard Build an agent from this Power BI report: https://app.powerbi.com/groups/11111111-1111-1111-1111-111111111111/reports/22222222-2222-2222-2222-222222222222/Overview
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-dashboard-flow
    type: tool_used
    tool: Read
    input_match: 'references/dashboard\.md'
    min: 1
  - name: does-not-claim-results-without-access
    type: llm
    criteria: |
      PASS if the assistant starts the dashboard workflow or explains the concrete missing access, without claiming extracted metrics, passing evals or a ready agent without tool evidence. FAIL if it invents extraction, eval results or readiness.
