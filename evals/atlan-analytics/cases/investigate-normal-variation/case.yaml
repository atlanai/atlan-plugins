schema_version: "1.1"
name: investigate-normal-variation
tags: [analytics, reliability, investigate]
execution:
  prompt: |
    Use Atlan Analytics Investigate to finish this finding from the fresh read-only results
    already obtained in this turn. This is a finding-writing checkpoint, not a request to rerun
    tools. The released OTP D15 metric is on-time departures divided by scheduled departures,
    cancelled and diverted legs excluded. Source receipt: metric_example, release_example,
    latest; no release between the two months. Both months are complete.
    Fresh results: September 81.1%, October 80.4%. The eight months before September were
    79.2%, 82.8%, 80.1%, 83.0%, 79.6%, 81.7%, 80.3% and 82.4%.
    By station, October against September: BLR 90.0% to 89.2%, DEL 60.4% to 60.1%.
    Why did on-time departures get worse in October?
    Do not execute new queries, alter definitions or publish anything.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-investigate
    type: tool_used
    tool: Skill
    input_match: 'atlan-analytics-investigate'
  - name: stops-at-normal-variation
    type: llm
    focus: last_message
    criteria: |
      PASS only if the answer says the 0.7 point fall sits inside the normal month-to-month range (roughly 79% to 83%) and therefore names no driver.
      FAIL if it presents BLR, DEL or anything else as the cause or main contributor of the fall, or decomposes the change into contributions.
  - name: no-new-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
