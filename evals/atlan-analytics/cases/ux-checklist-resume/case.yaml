schema_version: "1.1"
name: ux-checklist-resume
tags: [analytics, setup, ux, checklist, resume]
execution:
  prompt: |
    Use Atlan Analytics to resume my saved setup. This is a resume checkpoint: read plugin
    instructions only; do not execute commands or contact services in this test. The saved
    run's `project.py checklist` output is:
    {"flow": "build", "steps": [
     {"id": "intent", "content": "Choose what your agent answers: Shipping cost", "active": "Waiting for your choice", "needs_you": false, "status": "completed"},
     {"id": "sources", "content": "Find your sources: 4 found", "active": "Looking at your warehouse", "needs_you": false, "status": "completed"},
     {"id": "scope", "content": "Pick tables and dashboards", "active": "Waiting for your pick", "needs_you": false, "status": "completed"},
     {"id": "draft", "content": "Build your context: 24 metrics and saved queries", "active": "Finding metrics and saved queries", "needs_you": false, "status": "completed"},
     {"id": "merge", "content": "Merge duplicate metrics: 11 metrics", "active": "Merging duplicate metrics", "needs_you": false, "status": "completed"},
     {"id": "write", "content": "Add detailed information to 11 metrics and 4 saved queries", "active": "Writing what each one counts, leaves out and is based on", "needs_you": false, "status": "completed"},
     {"id": "test", "content": "Validate the context on your data (about 9 min)", "active": "Validating 6 of 15", "needs_you": false, "status": "in_progress"},
     {"id": "save", "content": "Choose where to store your context", "active": "Waiting for your choice", "needs_you": true, "status": "pending"},
     {"id": "ask", "content": "Ask your agent a question", "active": "Waiting for your question", "needs_you": true, "status": "pending"},
     {"id": "dashboard", "content": "Build a dashboard from its answers (optional)", "active": "Waiting for your choice", "needs_you": true, "status": "pending"}],
     "state": "running", "step": 7, "of": 10, "remote_writes": false}
    Rebuild the progress display from it and tell me where the run stands. Don't mention this
    test's limits in your reply.
  max_turns: 24
  allowed_tools: [Read, Glob, Grep, Skill, TaskCreate, TaskUpdate]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: rebuilds-nine-steps
    type: tool_used
    tool: TaskCreate
    min: 9
    max: 9
  - name: keeps-sharpened-names
    type: tool_used
    tool: TaskCreate
    input_match: '(24 metrics and saved queries|Merge duplicate metrics: 11 metrics|Validating 6 of 15)'
  - name: ticks-only-finished-steps
    type: tool_used
    tool: TaskUpdate
    input_match: 'completed'
    min: 5
    max: 5
  - name: one-step-in-progress
    type: tool_used
    tool: TaskUpdate
    input_match: 'in_progress'
    min: 1
    max: 1
  - name: says-where-the-run-stands
    type: llm
    focus: last_message
    criteria: |
      A saved setup run is resumed. Its helper reported ten steps: six completed (Shipping cost
      chosen, 4 sources found, tables and dashboards picked, 24 metrics and saved queries built,
      merged into 11 metrics, detailed information added to 11 metrics and 4 saved queries), validating the
      context in progress at 6 of 15, and storing, asking and the dashboard still pending. PASS
      if the reply shows all ten steps in chat with their saved status and counts, in addition
      to the task list, and identifies validating as the current step. No word limit applies to
      this display. The step names and statuses are the helper's own, and a time estimate it
      gave may be repeated. FAIL if it omits the chat tracker, claims validation finished or
      anything was saved to Atlan, repeats the fresh-setup introduction, re-asks what the agent
      answers, mentions a panel, pane or browser view, says the host's task list was not
      updated, or uses an em dash.
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
