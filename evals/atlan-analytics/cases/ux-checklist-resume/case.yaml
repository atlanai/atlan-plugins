schema_version: "1.1"
name: ux-checklist-resume
tags: [analytics, setup, ux, checklist, resume]
execution:
  prompt: |
    Use Atlan Analytics to resume my saved setup. This is a resume checkpoint: read plugin
    instructions only; do not execute commands or contact services in this test. The saved
    run's `project.py checklist` output is:
    {"flow": "build", "steps": [
     {"id": "intent", "content": "Use case: Shipping cost", "active": "Waiting for your use case", "needs_you": false, "status": "completed"},
     {"id": "sources", "content": "Survey 4 sources", "active": "Surveying your sources", "needs_you": false, "status": "completed"},
     {"id": "scope", "content": "Select tables and dashboards", "active": "Waiting for your selection", "needs_you": false, "status": "completed"},
     {"id": "draft", "content": "Find metrics: 24 possible metrics", "active": "Finding metrics: each query in plain words, then the numbers it works out", "needs_you": false, "status": "completed"},
     {"id": "merge", "content": "Combine duplicates: 11 metrics", "active": "Combining duplicates, one metric per number", "needs_you": false, "status": "completed"},
     {"id": "write", "content": "Define and test each metric (about 9 min)", "active": "Checking 6 of 15", "needs_you": false, "status": "in_progress"},
     {"id": "save", "content": "Keep local or save to Atlan Trident", "active": "Waiting for where to save", "needs_you": true, "status": "pending"},
     {"id": "ask", "content": "Ask a question", "active": "Waiting for your question", "needs_you": true, "status": "pending"},
     {"id": "dashboard", "content": "Build a dashboard", "active": "Waiting for your dashboard choice", "needs_you": true, "status": "pending"}],
     "state": "running", "step": 6, "of": 9, "remote_writes": false}
    Rebuild the progress display from it and tell me where the run stands. Don't mention this
    test's limits in your reply.
  max_turns: 24
  allowed_tools: [Read, Glob, Grep, Skill, TaskCreate, TaskUpdate]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: rebuilds-nine-steps
    type: tool_used
    tool: TaskCreate
    min: 9
    max: 9
  - name: keeps-sharpened-names
    type: tool_used
    tool: TaskCreate
    input_match: '(24 possible metrics|Combine duplicates: 11 metrics|Checking 6 of 15)'
  - name: ticks-only-finished-steps
    type: tool_used
    tool: TaskUpdate
    input_match: 'completed'
    min: 5
    max: 5
  - name: one-step-in-progress
    type: tool_used
    tool: TaskUpdate
    input_match: 'in_progress'
    min: 1
    max: 1
  - name: says-where-the-run-stands
    type: llm
    focus: last_message
    criteria: |
      A saved setup run is resumed. Its helper reported nine steps: five completed (use case
      Shipping cost, 4 sources surveyed, tables and dashboards selected, 24 possible metrics
      found, combined into 11 metrics), defining and testing each metric in progress and
      checking 6 of 15, and saving, asking and the dashboard still pending. PASS if the reply
      shows all nine steps in chat with their saved status and counts, in addition to the task
      list, and identifies checking as the current step. No word limit applies to this display.
      The step names and statuses are the helper's own, so "Keep local or save to Atlan
      Trident" is the saving step, and a time estimate it gave may be repeated. FAIL if it
      omits the chat tracker, claims checks finished or anything was saved to Atlan, repeats
      the fresh-setup introduction, re-asks for the use case, mentions a panel, pane or
      browser view, says the host's task list was not updated, or uses an em dash.
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
