schema_version: "1.1"
name: ux-checklist-resume
tags: [analytics, setup, ux, checklist, resume]
execution:
  prompt: |
    Use Atlan Analytics to resume my saved setup. This is a resume checkpoint: read plugin
    instructions only; do not execute commands or contact services in this test. The saved
    run's `project.py checklist` output is:
    {"steps": [
     {"id": "sources", "content": "Read 4 sources", "active": "Reading your sources", "needs_you": false, "status": "completed"},
     {"id": "intent", "content": "Focus: Shipping cost", "active": "Waiting for your focus and goal", "needs_you": false, "status": "completed"},
     {"id": "build", "content": "Write 3 metrics and 12 queries", "active": "Writing metrics and queries", "needs_you": false, "status": "completed"},
     {"id": "check", "content": "Check 15 metrics and queries", "active": "Checking 6 of 15", "needs_you": false, "status": "in_progress"},
     {"id": "review", "content": "Review and choose where to save", "active": "Waiting for your review", "needs_you": true, "status": "pending"},
     {"id": "ready", "content": "Ready for questions", "active": "Preparing questions", "needs_you": false, "status": "pending"}],
     "state": "running", "step": 4, "of": 6, "remote_writes": false}
    Rebuild the progress display from it and tell me where the run stands.
  max_turns: 24
  allowed_tools: [Read, Glob, Grep, Skill, TaskCreate, TaskUpdate]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: rebuilds-six-steps
    type: tool_used
    tool: TaskCreate
    min: 6
    max: 6
  - name: keeps-sharpened-names
    type: tool_used
    tool: TaskCreate
    input_match: 'Check 15 metrics and queries'
  - name: ticks-only-finished-steps
    type: tool_used
    tool: TaskUpdate
    input_match: 'completed'
    min: 3
    max: 3
  - name: one-step-in-progress
    type: tool_used
    tool: TaskUpdate
    input_match: 'in_progress'
    min: 1
    max: 1
  - name: says-where-the-run-stands
    type: llm
    focus: last_message
    criteria: |
      A saved setup run is resumed. Its helper reported six steps: three completed (4 sources
      read, focus Shipping cost, 3 metrics and 12 queries written), checking in progress at
      6 of 15, and review and ready-for-questions still pending. The steps are shown
      in the host's task list. PASS if the reply, in under 80 words, states the saved result and
      that checking the metrics and queries is the step under way or next. FAIL if it reprints the six
      steps as a list or table, claims the checks finished or anything was saved to Atlan,
      repeats the fresh-setup introduction, re-asks for focus or goal, mentions a panel, pane
      or browser view, or uses an em dash or a closing offer.
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
