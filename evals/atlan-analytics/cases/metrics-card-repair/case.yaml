schema_version: "1.1"
name: metrics-card-repair
tags: [analytics, metrics, quality]
execution:
  prompt: |
    /atlanai-analytics:analytics-build metrics
    A parse-only metric draft has formula COUNT(CASE WHEN COUNT(*) > 0 THEN 1 END).
    The source row expression was accidentally replaced by an outer aggregate with the same
    alias. The workspace is selected and saving is authorized. Explain the next step without
    executing the run or publishing.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: preserves-runtime-contract
    type: llm
    criteria: |
      PASS if it rejects invalid nested aggregation through the card gate, repairs from the
      actual row-level source projection or a separate query scope, and revalidates before
      export/publication. Parse-only mode and existing save authorization never waive the failure.
      It must not ask the customer to approve the invalid formula or claim warehouse verification.
  - name: plain-reply
    type: llm
    criteria: |
      Lead with the next step and use one concise paragraph.
