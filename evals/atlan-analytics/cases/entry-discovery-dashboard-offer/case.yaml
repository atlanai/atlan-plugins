schema_version: "1.1"
name: entry-discovery-dashboard-offer
tags: [analytics, build, entry, intent]
execution:
  prompt: |
    Use Atlan Analytics to continue setting up analytics on my own data.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    The person chose Snowflake, which is already connected, then "Let discovery decide", then the
    sales pipeline use case, and confirmed the build. Treat generation and its checks as just
    finished, with this result: 6 metrics and 9 queries, built from query history and table
    definitions on 3 tables, all 6 metrics ran on Snowflake. No dashboard was part of the build.
    Nothing has been saved and the save question has not been asked yet.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-intent
    type: tool_used
    tool: Read
    input_match: 'references/setup/intent\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: offers-a-dashboard
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says what was built (6 metrics and 9 queries from the warehouse), says
      the quality can improve by adding more sources such as a dashboard, asks whether the
      person would like to add a dashboard with choices that mean adding one or not now, and
      stops. FAIL if it says the metrics are wrong or incomplete, skips the offer and goes
      straight to the save question, asks for the dashboard link before the person said yes,
      asks more than this one question, or claims anything was saved.
