schema_version: "1.1"
name: build-accuracy-offer
tags: [analytics, build, evals, regression]
execution:
  prompt: |
    Use Atlan Analytics to continue my own-data setup from this saved checkpoint.
    I built a support resolution agent from our Snowflake support dashboard and 40 past
    queries: 8 metrics and 6 queries, all checked on our data. I chose "Keep it on this
    machine". No eval set exists yet, and I have not asked a question.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Don't mention this test's limits in your reply.
    What happens next?
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: offers-accuracy-in-the-ready-question
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply shows what was built and asks what to ask, with checking how accurate
      the agent is (on questions the dashboard or past queries already answer) as one of its
      choices beside a question to ask, and lets the person type their own question.
      FAIL if it asks a separate accuracy question before the ready block, leaves the check out,
      starts generating questions or testing before the person chooses, or answers a data
      question unasked.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply gives the concrete next step in plain language,
      without a greeting, apology, em dash, machine status footer or generic offer.
      The setup's native accuracy choice has no word limit.
