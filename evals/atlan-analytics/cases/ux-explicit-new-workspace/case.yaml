schema_version: "1.1"
name: ux-explicit-new-workspace
tags: [analytics, setup, ux, workspace]
context:
  scaffold_script: scaffold.sh
execution:
  # The run in this folder keeps 3 metrics and 1 query local (fixtures/shipping_run.py, local).
  # The emulator's Atlan lists workspaces and has no tool that creates one, as Atlan does today.
  prompt: |
    I want a new Atlan workspace for our shipping metrics. Can you create one for me through
    the CLI or the API?
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: ui-admin-route
    type: llm
    focus: last_message
    criteria: |
      Atlan's MCP lists existing workspaces but cannot create one, and the run's 3 metrics and
      1 query are saved locally. PASS if the reply says it cannot create a workspace from here,
      gives the supported route (create it in the Atlan app, or ask an administrator), says the
      local drafts are kept, and that it can save to the new workspace once it is listed.
      FAIL on invented creation tools, endpoints, CLI commands or credentials, made-up menu
      paths in the Atlan app, or a claim that a workspace was created.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      PASS if it is a short answer that ends with the supported next action, without a status
      token, a permission question, a metric preview nobody asked for or narration of the
      setup. FAIL if it runs past a couple of short paragraphs.
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
