schema_version: "1.1"
name: routing-metrics-arg
tags: [analytics, routing]
execution:
  prompt: |
    /atlan-analytics:atlan-analytics metrics support tables in the acme workspace
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-expected
    type: tool_used
    tool: Read
    input_match: 'references/metrics\.md'
    min: 1
  - name: avoids-wrong-branch
    type: tool_used
    tool: Read
    input_match: 'references/full-agent\.md'
    min: 0
    max: 0
