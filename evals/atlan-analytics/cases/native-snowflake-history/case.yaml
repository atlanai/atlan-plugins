schema_version: "1.1"
name: native-snowflake-history
tags: [analytics, metrics, snowflake]
execution:
  prompt: |
    /atlanai-analytics:atlan-analytics metrics
    Generate local draft metrics from Snowflake query history for DEMO.MAIN.ORDERS.
    Use January 2026. The packaged runtime with its Snowflake feature is ready and the
    approved connection is configured in the environment. My role can read Account Usage.
    I have no shape table. Explain the next step and the relevant configuration only;
    do not execute the extraction or call warehouse or Registry tools.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: native-history-route
    type: llm
    criteria: |
      PASS if it uses snowflake-direct native history (history_source: account_usage, no
      shape_table), carries the bounded ORDERS table and January window forward, and keeps
      drafts local with the original engine quality gates. The end of January is represented
      by exclusive 2026-02-01 when configuration dates are shown. FAIL if it says a prepared
      shape table is required, creates a view, requests credentials in chat, silently mines
      an unbounded account history, bypasses gates or claims the extraction already succeeded.
  - name: plain-reply
    type: llm
    criteria: |
      Lead with the requested next step, use plain language and keep the explanation concise.
