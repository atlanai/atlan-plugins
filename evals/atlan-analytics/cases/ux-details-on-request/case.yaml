schema_version: "1.1"
name: ux-details-on-request
tags: [analytics, setup, ux, preview, details]
context:
  scaffold_script: scaffold.sh
execution:
  # A real task: the run is saved in this folder (fixtures/shipping_run.py, local), and the
  # model finds it and reads it with the skill's helpers. Nothing in the prompt says what it holds.
  prompt: |
    Show me the details for the Shipped units metric from our shipping setup: what it counts,
    the SQL of the saved query behind it, where it came from and how it was checked.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: exact-sql-and-evidence
    type: llm
    focus: last_message
    criteria: |
      The saved run holds Shipped units: total units on shipped orders, formula SUM(s.units),
      mandatory filter s.status = 'shipped', region grain, from the shipments dbt model and one
      query-history pattern. Its saved query is
      SELECT region, SUM(units) AS shipped_units FROM shipping.shipments WHERE status = 'shipped' AND shipped_at >= $start_date GROUP BY region LIMIT 100
      with a date parameter start_date.
      PASS only if the reply shows that complete SQL in a code block and gives the meaning,
      the formula, the shipped-only filter, the region grain and the model plus query-history
      source. start_date must stay a parameter in the SQL; naming 2026-10-01 as the sample it
      was checked with is right, substituting it into the SQL is not. Whitespace-only
      formatting is allowed; tokens, literals, operators and filters must be unchanged.
      FAIL on an omitted filter, altered query or a card for an unrelated metric.
  - name: saved-sql-preserved
    type: regex
    target: last_message
    pattern: '```(?:sql)?\s*SELECT\s+region\s*,\s*SUM\s*\(\s*units\s*\)\s+AS\s+shipped_units\s+FROM\s+shipping\s*\.\s*shipments\s+WHERE\s+status\s*=\s*''shipped''\s+AND\s+shipped_at\s*>=\s*\$start_date\s+GROUP\s+BY\s+region\s+LIMIT\s+100\s*```'
  - name: honest-check-provenance
    type: llm
    focus: last_message
    criteria: |
      The saved checks: the metric's authored SQL example ran earlier, and the saved query ran
      earlier with start_date = 2026-10-01. Other parameter values and dashboard parity were
      never checked. The metric and query are local, with nothing saved in Atlan.
      PASS if the reply keeps these distinctions: reporting the earlier runs is correct.
      FAIL if it claims SQL ran or anything was saved to Atlan during this turn, or treats the
      one sample as proof for every date or of business correctness.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      The user asked for the details of one metric. PASS if the reply leads with Shipped units
      and presents its evidence readably. Headings, bullets, a SQL block and a note on what was
      and was not checked are appropriate, at whatever length that takes.
      FAIL on narration of the setup pipeline or of the helper commands run, extra questions or
      cards, a pitch to publish, or a machine status footer such as DONE or BLOCKED.
  # Details are read from the saved run: nothing is written to Atlan.
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
