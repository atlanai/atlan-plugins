schema_version: "1.1"
name: records-capped
tags: [analytics, ontology, records]
execution:
  prompt: |
    Which on-time performance definition was in force on 1 March 2026 under our airline operations ontology?
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-ontology
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-ontology"'
  - name: reads-records
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    input_match: '"extension__ontology__get_records"'
    min: 1
  - name: every-records-call-has-a-small-limit
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    input_match: '^(?=[\s\S]*"extension__ontology__get_records")(?![\s\S]*"limit"\s*:\s*(?:[1-9]|10)\b)'
    min: 0
    max: 0
  - name: answers-from-records
    type: llm
    criteria: |
      PASS if the reply names records in force on 1 March 2026 with their validity dates and the release they came from, and says the list is unranked or narrowed rather than complete when it is.
      FAIL if it says no record exists after a single phrase search that matched nothing, or quotes a definition that is not in a returned record.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
