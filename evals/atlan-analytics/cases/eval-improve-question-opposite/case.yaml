schema_version: "1.1"
name: eval-improve-question-opposite
tags: [analytics, evals, improve]
execution:
  prompt: |
    Continue my accuracy check on the Indigo workspace's context with Atlan Analytics.
    The check scored 4 of 5. The miss: "Which stations tend to run late?" tests the turnaround_time
    metric. The trusted query returns each station's on-time share (DEL 0.82, BOM 0.74); the agent
    returned each station's late share (DEL 0.18, BOM 0.26), the same ranking.
    I pick Improve it.
    The host exposes no native question tool in this test, so use ordinary chat. Don't mention this test's limits in your reply.
  max_turns: 24
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: no-metric-proposal
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: 'improvements/metric/'
    min: 0
    max: 0
  - name: never-edits-the-metric
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__(?:patch_artifact|append_artifact_version|release_artifact)"'
    min: 0
    max: 0
  - name: fixes-the-question
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says the answer is the trusted result's complement (late share for on-time
      share), so the question's wording, not the metric, is wrong, and recommends redrafting the question
      rather than changing turnaround_time, without changing the set itself.
      FAIL if it files or offers a metric change for this miss, or calls the agent's answer wrong
      without noting it is the complement.
