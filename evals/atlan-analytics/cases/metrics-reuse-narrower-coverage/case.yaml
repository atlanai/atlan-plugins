schema_version: "1.1"
name: metrics-reuse-narrower-coverage
tags: [analytics, reliability, metrics]
execution:
  prompt: |
    Use Atlan Analytics to review this setup reconciliation checkpoint. Do not call tools
    to write artifacts or run new queries; explain the decision and what must be retained.
    I want the total paid-order amount for team reuse. A candidate named order-total has
    SUM(o.amount), paid orders only, one row per order, with region and channel breakdowns.
    The complete existing released paid-order-total has the identical total formula and
    population, no parameters, but only region as a declared dimension. Its description
    and examples are already reviewed. A sample total is equal for both definitions.
    Should setup create another metric, replace this existing one, or reuse it? Does that
    cover everything the candidate proposed? The current checker requests a coverage review.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-analytics
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: preserves-existing-and-uncovered-work
    type: llm
    focus: last_message
    criteria: |
      PASS if it recommends reusing the full existing released definition for the requested
      total, explicitly says channel is not covered, preserves the original candidate and
      its checks/coverage decision locally, and does not propose an unnecessary create or
      automatic revision. It must not use equal sample totals as general equivalence proof.
      A future optional reviewed revision for channel is allowed. No additional approval
      is required just for read-only reuse. Hash-bound local review may be described briefly.
  - name: no-new-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
