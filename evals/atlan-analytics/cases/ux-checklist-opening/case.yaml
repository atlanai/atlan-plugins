schema_version: "1.1"
name: ux-checklist-opening
tags: [analytics, setup, ux, checklist]
execution:
  prompt: |
    Use Atlan Analytics to help me ask questions about the dashboards and query history
    in /workspace/analytics-input. This is a start-of-setup checkpoint: do what you would do
    before the survey starts, then stop. Do not inspect the folder, run commands, make
    Registry calls or claim you found its contents in this test. Use the plugin's workflow.
    Don't mention this test's limits in your reply.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, TaskCreate, TaskUpdate]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: creates-the-ten-steps
    type: tool_used
    tool: TaskCreate
    min: 10
    max: 10
  - name: survey-step-is-listed
    type: tool_used
    tool: TaskCreate
    input_match: 'Find your sources'
  - name: save-step-is-listed
    type: tool_used
    tool: TaskCreate
    input_match: 'Choose where to store your context'
  - name: plan-visible-in-chat-and-task-list
    type: llm
    focus: last_message
    criteria: |
      The user asked for Atlan Analytics to help ask questions about dashboards and query
      history in /workspace/analytics-input. Nothing has been inspected. The setup's ten
      steps (Choose what your agent answers, Find your sources, Pick tables and dashboards,
      Build your context, Merge duplicate metrics, Write detailed notes on each metric and
      saved query, Validate the context on your data, Choose where to store your context, Ask
      your agent a question, Build a dashboard from its answers) must appear in chat as well as
      the host's task list. PASS if the reply shows those steps with choosing what the agent
      answers current and the others pending or next, explains the outcome as metrics and
      questions in this chat, and asks the interview's first question (which warehouse, and
      what the person wants to do) before any survey. No word limit applies to this required
      display. FAIL if it omits the chat tracker, counts the steps wrongly ("seven steps" over
      a list of ten), describes a side panel, pane or browser view, or claims anything was
      found.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      This is only the opening before a source survey. The skill requires its opening lines
      ("Atlan Analytics turns your dashboards and the queries your team already runs into
      context ... First, let me understand your tools and your domain.") as the outcome
      statement, and the request asked it to stop there, so one closing line saying nothing
      was read yet is fine. PASS if it uses plain language and leads with the next action or
      the outcome of asking questions here. No greeting,
      generic closing offer, em dash or machine status token. The tracker's own labels
      ("now", "next", "your choice") are part of the required display, not status tokens. No metric has been extracted
      yet, so a sample is not required and a fabricated preview or completion claim fails.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
