schema_version: "1.1"
name: ux-checklist-opening
tags: [analytics, setup, ux, checklist]
execution:
  prompt: |
    Use Atlan Analytics to help me ask questions about the dashboards and query history
    in /workspace/analytics-input. This is a start-of-setup checkpoint: do what you would do
    before the survey starts, then stop. Do not inspect the folder, run commands, make
    Registry calls or claim you found its contents in this test. Use the plugin's workflow.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, TaskCreate, TaskUpdate]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: creates-the-seven-steps
    type: tool_used
    tool: TaskCreate
    min: 7
    max: 7
  - name: first-step-is-surveying-sources
    type: tool_used
    tool: TaskCreate
    input_match: 'Survey your sources'
  - name: save-step-is-listed
    type: tool_used
    tool: TaskCreate
    input_match: 'Keep local or save to Atlan Trident'
  - name: plan-visible-in-chat-and-task-list
    type: llm
    focus: last_message
    criteria: |
      The user asked for Atlan Analytics to help ask questions about dashboards and query
      history in /workspace/analytics-input. Nothing has been inspected. The seven setup steps
      must appear in chat as well as the host's task list. PASS if the reply shows all seven
      steps with source inspection current and the others pending, explains the outcome as
      metrics and questions in this chat, and names surveying the sources as the next action.
      No word limit applies to this required display. FAIL if it omits the chat tracker, describes a
      side panel, pane or browser view, asks for permission or "go" to start the already
      requested survey, or claims anything was found.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      This is only the opening before a source survey. PASS if it uses plain language and
      leads with the next action or the outcome of asking questions here. No greeting,
      generic closing offer, em dash or machine status token. No metric has been extracted
      yet, so a sample is not required and a fabricated preview or completion claim fails.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
