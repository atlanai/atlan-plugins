schema_version: "1.1"
name: ux-opening-orientation
tags: [analytics, setup, ux, orientation]
execution:
  prompt: |
    Use Atlan Analytics to help me ask questions about the dashboards and query history
    in /workspace/analytics-input. This is an opening-message checkpoint: write what you
    would say before the survey starts. Do not inspect the folder, make Registry calls,
    install packages or claim you found its contents in this test. Use the plugin's workflow.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: orientation-and-control
    type: llm
    focus: last_message
    criteria: |
      The user asked for Atlan Analytics to help ask questions about dashboards and query
      history in /workspace/analytics-input. This is the opening before any survey, with no
      discovered contents or verified panel capability. PASS if the opening is at most 60
      words, explains the outcome as metrics and questions in this chat, names surveying
      sources as the immediate next action, and makes scope, detail, Keep local and pause
      controls understandable. FAIL on asking for fresh permission or "go" to start the
      already requested survey, a full pipeline dump, claimed discovery or an advertised panel.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      This is only the opening before a source survey. PASS if it uses plain language and
      leads with that next action or the outcome of asking questions here. No greeting,
      generic closing offer, em dash or machine status token. No metric has been extracted
      yet, so a sample is not required and a fabricated preview or completion claim fails.
  # Checkpoint prompts authorize instruction reads, not new execution or Registry calls.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
