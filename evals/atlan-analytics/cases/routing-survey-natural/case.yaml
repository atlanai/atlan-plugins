schema_version: "1.1"
name: routing-survey-natural
tags: [analytics, routing]
execution:
  prompt: |
    What's in the dashboards and query history under /workspace/analytics-input? Just tell me
    what they cover, don't build anything. Read plugin instructions only; do not run commands
    or contact services in this test.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-survey-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-survey'
  - name: reads-inspect-scope
    type: tool_used
    tool: Read
    input_match: 'references/inspect-scope\.md'
    min: 1
  - name: does-not-generate
    type: tool_used
    tool: Read
    input_match: 'references/metrics-engine\.md'
    min: 0
    max: 0
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
