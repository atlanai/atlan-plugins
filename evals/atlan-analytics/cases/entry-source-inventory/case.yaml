schema_version: "1.1"
name: entry-source-inventory
tags: [analytics, build, entry, names]
execution:
  prompt: |
    Use Atlan Analytics to set up analytics from ./reports/field-coverage.pbix.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Treat reading the report as already done, with this result: 8 pages and 34 measures, all from
    5 Snowflake tables that a connected read-only query tool can reach. Pages and measure counts:
    Coverage 10 (account coverage tiers, stale accounts), Targets 5 (meetings against plan),
    Scorer and Score detail 12 (scored sales calls), four other pages 7 (activity against
    pipeline). The person has stated no focus and no purpose. Nothing is built.
    Show the next user-facing step, and do not start generation in this test.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-entry
    type: tool_used
    tool: Read
    input_match: 'references/setup/entry\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: inventory-by-page
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says what was read and that its tables can be reached, shows the pages
      with their metric counts and at least one question a page would answer, and says it is
      building the whole report (all pages, or all 34 metrics), with query history and table
      columns used to check the rules. FAIL if it asks which pages or metrics to build, asks
      "what do you care about most" or the purpose as an interview question, asks for a source,
      shows SQL, or claims a metric was already built or checked.
