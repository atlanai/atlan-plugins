schema_version: "1.1"
name: entry-domain-differences
tags: [analytics, build, entry, domain]
execution:
  prompt: |
    Use Atlan Analytics to set up analytics for sales pipeline. I have not named a source.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Treat the domain survey as already run, with this result. Atlan Trident holds 4 released
    metrics in a workspace named Example Ops: Pipeline ARR, Win rate, Average deal size, Stage
    conversion. A team rule in Atlan says quarters are fiscal. One certified query, "Win rate by
    segment", counts cancelled deals as lost and uses calendar quarters, while the released Win
    rate leaves cancelled deals out; on last quarter the two rules give 50% and 43%. Query
    history shows two things the released metrics do not cover: slipped deals (41 past queries)
    and days in stage (18 past queries). Nothing is built.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-entry
    type: tool_used
    tool: Read
    input_match: 'references/setup/entry\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: reuse-and-differences
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says what already exists (the 4 released metrics and the certified query),
      names the win-rate difference with both rules and the 50% versus 43% effect, and asks how to
      handle the differences with following the released Atlan rules as the recommended choice,
      then stops. Mentioning that slipped deals and days in stage would be new is allowed. FAIL
      if it proposes rebuilding or editing the released metrics or the certified query itself,
      asks the person for a source, hides the difference, shows SQL, or starts generation.
