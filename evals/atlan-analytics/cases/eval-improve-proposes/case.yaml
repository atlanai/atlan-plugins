schema_version: "1.1"
name: eval-improve-proposes
tags: [analytics, evals, improve, propose]
execution:
  prompt: |
    Continue my accuracy check on the Indigo workspace's context with Atlan Analytics.
    The check scored 4 of 5. The miss: "What was the average turnaround at DEL in October?"
    tests the turnaround_time metric. The trusted query leaves out cancelled legs; the agent
    used turnaround_time, whose rule keeps them, and answered 47.9 minutes where 41.2 was expected.
    I pick Improve it.
    The host exposes no native question tool in this test, so use ordinary chat. Don't mention this test's limits in your reply.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: reads-the-metric-head
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    input_match: '"registry__get_artifact"[\s\S]*metric_01evalm01|metric_01evalm01[\s\S]*"registry__get_artifact"'
    min: 1
  - name: files-one-proposal
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__create_artifact"[\s\S]*improvements/metric/'
    min: 1
    max: 1
  - name: never-edits-the-metric
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__(?:patch_artifact|append_artifact_version|release_artifact)"'
    min: 0
    max: 0
  - name: sends-to-studio
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says one proposal to change turnaround_time's rule (leaving out cancelled
      legs) was filed for the metric's owner, gives the Metric Studio link or id that opens it,
      and asks one question about whether it has been approved so the test can run again.
      FAIL if it says the metric itself was changed, asks again whether to file the proposal,
      or re-runs the test before approval.
