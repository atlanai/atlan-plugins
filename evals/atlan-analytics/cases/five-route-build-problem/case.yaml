schema_version: "1.1"
name: five-route-build-problem
tags: [analytics, five, routing, build]
execution:
  prompt: |
    I need to track customer churn by plan. My dashboards and SQL are in ./reports.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Show the first user-facing message of this work.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: not-demo
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-demo"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: problem-first-opening
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says it will inspect the sources in ./reports and prepare metrics for
      questions, treats customer churn by plan as the stated focus, and names controls such as
      narrowing scope, asking for details, keeping work local or pausing. FAIL if it offers a demo,
      asks the person to supply a source again, or asks a generic "what do you care about most"
      question as though no problem had been stated.
  - name: plain-reply
    type: llm
    criteria: |
      PASS if the final reply opens with its result or the next step and has none of: a greeting or pleasantry ("Great", "Happy to", "Certainly"), an apology, an em dash, a generic closing offer with no concrete step ("let me know if you need anything else", "feel free to ask"), or a sentence announcing which skill was loaded when that changes nothing for the user. Offering one concrete next step, or asking a question the user must answer, is fine.
      FAIL only if one of those appears.
