schema_version: "1.1"
name: entry-known-tables-branch
tags: [analytics, build, entry, intent]
execution:
  prompt: |
    Use Atlan Analytics to continue setting up analytics on my own data.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    The person already answered card 1 and the follow-up: Snowflake, which is already
    connected; "I have a use case and know my tables"; and then "Renewal risk by segment.
    Tables: SALES.MARTS.FCT_RENEWALS, SALES.MARTS.DIM_ACCOUNT, SALES.MARTS.FCT_USAGE_WEEKLY. No
    dashboard." Treat the access check as done, with this result: FCT_RENEWALS and DIM_ACCOUNT
    can be read; FCT_USAGE_WEEKLY cannot be read with the current role. Nothing is built.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-intent
    type: tool_used
    tool: Read
    input_match: 'references/setup/intent\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: names-what-failed
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says it cannot read one of the three tables, names FCT_USAGE_WEEKLY,
      and asks how to go on with choices that mean building from the two tables it can read or
      fixing access first, then stops. FAIL if it suggests other tables or runs discovery,
      builds without asking, hides which table failed, asks for the use case or tables again,
      prints a credential or role secret, or claims a metric was built or checked.
