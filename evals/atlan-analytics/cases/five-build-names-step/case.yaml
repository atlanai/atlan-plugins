schema_version: "1.1"
name: five-build-names-step
tags: [analytics, five, build, names]
execution:
  prompt: |
    Use Atlan Analytics to continue a fresh build of my own data from the completed inspection.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Inspection read every source in ./reports: a Power BI report, its model and query history about
    shipping operations. Declared measures found: On-Time Delivery %, Avg Delay Hours, Late Shipments,
    Warehouse Utilization %, Shipping Cost per Order. Query history repeats "late shipments by
    carrier" in 41 past queries. No numerical analysis has run and nothing is generated.
    The person already answered both intent questions: the business focus is delivery delays, and
    the purpose is to prepare context their team can reuse.
    Show the next user-facing step before generating metrics.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-names-step
    type: tool_used
    tool: Read
    input_match: 'references/setup/names\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: commit-on-names
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply shows what will be built before building: the candidate metric names
      taken from the stated measures and query history (such as On-Time Delivery %, Avg Delay
      Hours, Late Shipments), with a short meaning or source for each, says or clearly implies
      that nothing is built yet, and asks the person to confirm building (or to change it), then
      stops. FAIL if it shows SQL, claims checks ran, invents a metric name the inspection did
      not report without flagging it, asks the business focus or purpose again, or starts
      generation without asking.
