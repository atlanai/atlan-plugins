schema_version: "1.1"
name: routing-ontology-natural
tags: [analytics, routing]
execution:
  prompt: |
    How does Customer relate to Order in our business ontology, and which tables hold them?
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-skill
    type: tool_used
    tool: Skill
    input_match: 'atlan-(analytics|ontology)'
  - name: picks-the-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-ontology"'
    min: 1
  - name: avoids-wrong-branch
    type: tool_used
    tool: Read
    input_match: 'references/full-agent\.md'
    min: 0
    max: 0
