schema_version: "1.1"
name: ux-one-metric-final
tags: [analytics, setup, ux, preview]
context:
  scaffold_script: scaffold.sh
execution:
  # The run in this folder released 7 metrics and 4 saved queries to Atlan and holds an 8th
  # metric, On-time rate, whose denominator is undefined (fixtures/shipping_run.py, published).
  # The person asks for the hand-off; the model reads it from the run.
  prompt: |
    The shipping metrics setup should be finished. Give me the handoff: what's ready and what I
    can ask now.
    The host exposes no native question tool in this test, so use ordinary chat.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: one-durable-real-sample
    type: llm
    focus: last_message
    criteria: |
      The saved run: 7 metrics and 4 saved queries released in Atlan, and On-time rate held
      locally because its denominator is undefined. Shipped units is total units on shipped
      orders, SUM(s.units), mandatory filter s.status = 'shipped', from the shipments model and
      query history; its SQL example ran earlier, and dashboard parity was never measured.
      PASS only if the reply gives those counts (7 and 4 released, 1 held, in any wording), and
      shows one released metric's business definition: meaning, calculation, population or
      filter, source and honest check status. Shipped units is the natural sample; another
      released metric shown with the same fields from the run is acceptable.
      The helper's ready block says "7 metrics, 4 saved queries · Saved to Atlan" and "7
      metrics and 4 saved queries saved to Atlan, in Shipping; 1 metric stored on this
      machine": those are the same counts (8 built, 1 held), not a parity claim.
      FAIL on a link in place of the sample, invented definitions, a claim of verified
      dashboard parity, or calling the held metric ready.
  - name: supported-question-handoff
    type: llm
    focus: last_message
    criteria: |
      The released saved queries answer: "How many units shipped by region?" (since a start
      date), "What was the shipping cost by region?", "What weight did we ship?" and "How many
      units came back by region?". The released metrics are Shipped units, Shipping cost,
      Returned units, Return rate, Late shipments, Package count and Average package weight.
      PASS if the reply offers questions these support, to ask in this chat, without adding
      unsupported scope (another dimension, a period comparison) or separate-agent set-up.
      Saying that answers read the published definitions before running SQL is good. Two of
      these questions plus "Ask my own question" is enough. The ready block's lines describe
      saved state: "Saved to Atlan" and "In Shipping" (the context saved earlier, the
      product's own words) are not claims that anything ran or was published in this turn,
      nor that an agent was created.
      FAIL for claiming anything ran or was published in this turn, offering On-time rate as
      answerable, or creating an agent.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      A final hand-off. PASS if the reply shows what is ready with factual counts, the sample
      metric's rule, and ends with questions to ask or one material limitation (the held
      metric). No machine status footer such as DONE or BLOCKED. FAIL on narration of the
      helper commands run or of the setup pipeline.
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
