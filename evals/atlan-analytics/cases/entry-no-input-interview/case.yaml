schema_version: "1.1"
name: entry-no-input-interview
tags: [analytics, build, entry, intent]
execution:
  prompt: |
    Use Atlan Analytics to set up analytics on my own data. I have not named a warehouse, a
    subject or a source.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Treat the quick look at what is already connected as done, with this result: one working
    warehouse connection, Snowflake through its connector, and one BI file in the working
    folder named pipeline-review.pbix. No data has been read and nothing is built.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-intent
    type: tool_used
    tool: Read
    input_match: 'references/setup/intent\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: opening-interview
    type: llm
    focus: last_message
    criteria: |
      The host has no native question tool, so the interview's questions are asked in chat,
      either together or the first one alone. PASS if the reply asks which warehouse the person
      is on and offers the already connected Snowflake connection as a choice. If it asks more
      than that one question, it must ask what to build context for with "Let discovery decide"
      as the first option followed by a few domains, and whether there is a BI source to share
      (offering the pipeline-review file, another Power BI or Tableau file, a link, or none).
      FAIL if it claims to have read tables, schemas or report contents, lists table names,
      asks the person to pick a task such as answering a question or building a dashboard,
      asks for a source without asking about the warehouse, or starts any build.
