schema_version: "1.1"
name: entry-no-input-interview
tags: [analytics, build, entry, survey, intent]
execution:
  prompt: |
    Use Atlan Analytics to set up analytics on my own data. I have not named any source.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Nothing has been surveyed, read or asked yet, and no run exists.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-entry
    type: tool_used
    tool: Read
    input_match: 'references/setup/entry\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: asks-before-surveying
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply says in a sentence or two that Atlan Analytics turns dashboards and
      queries into context that can be asked questions, then asks one question about what the
      person is trying to do, with task-shaped options such as answering a question,
      understanding a number that changed, building a dashboard or report, or sharing metrics
      with the team, accepting free text, and stops. FAIL if it claims to have found, read or
      surveyed any source, tool or file, lists connectors or reports, asks the person to pick a
      business area or a purpose as separate questions, asks only for a source without asking
      what they are trying to do, or starts any build.
