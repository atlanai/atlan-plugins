schema_version: "1.1"
name: entry-no-input-interview
tags: [analytics, build, entry, intent]
execution:
  prompt: |
    Use Atlan Analytics to set up analytics on my own data. I have not named a warehouse, a
    subject or a source.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    Treat the quick look at what is already connected as done, with this result: one working
    warehouse connection, Snowflake through its connector. No data has been read and nothing
    is built.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-intent
    type: tool_used
    tool: Read
    input_match: 'references/setup/intent\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: card-one
    type: llm
    focus: last_message
    criteria: |
      The host has no native question tool, so card 1 is asked in chat, both questions together
      or the first alone. PASS if the reply asks which warehouse the person is connected to and
      offers Snowflake as a choice plainly marked as already connected. If it also asks the
      second question, that must be what the person wants to do, with three choices meaning: let
      discovery decide, make a dashboard agentic (share a dashboard), and a use case with known
      tables. FAIL if it narrates that it checked or looked for connections or files, explains
      how the options were chosen, claims to have read tables, schemas or report contents,
      lists table names, asks for a dashboard link, a file or a BI tool at this step, or starts
      any build.
