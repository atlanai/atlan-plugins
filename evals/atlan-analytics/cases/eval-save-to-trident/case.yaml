schema_version: "1.1"
name: eval-save-to-trident
tags: [analytics, evals, save]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The eval set you generated for the Indigo context is drafted in .atlan-evals/indigo.
    I pick Save to Atlan Trident, in the Indigo workspace.
    The host exposes no native question tool in this test, so use ordinary chat. Don't mention this test's limits in your reply.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: creates-the-scorer
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__create_artifact"[\s\S]*"scorer"'
    min: 1
  - name: creates-the-dataset
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__create_artifact"[\s\S]*"dataset"'
    min: 1
  - name: records-in-one-batch
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: '"registry__create_artifacts"[\s\S]*"dataset_record"'
    min: 1
    max: 1
  - name: sql-never-leaves
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    input_match: 'AVG\(turnaround_minutes\)|AVG\(block_variance\)'
    min: 0
    max: 0
  - name: reports-the-save
    type: llm
    focus: last_message
    criteria: |
      The emulator accepts each create but never lists what was created, so a read-back finds
      nothing; saying the save is not yet confirmed by a read-back is correct here.
      PASS if the reply says the 2 questions were sent to the Indigo workspace with a scorer and a
      dataset, and that the trusted SQL stayed on this machine (Trident holds a digest).
      FAIL if it claims SQL was uploaded, reports a different count, or claims a read-back
      confirmed items it did not find.
