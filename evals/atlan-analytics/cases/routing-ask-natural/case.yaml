schema_version: "1.1"
name: routing-ask-natural
tags: [analytics, routing]
execution:
  prompt: |
    What was revenue last quarter, by region, from our published metrics?
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires-skill
    type: tool_used
    tool: Skill
    input_match: 'atlan-(analytics|ontology)'
  - name: picks-the-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?atlan-analytics-ask"'
    min: 1
  - name: avoids-wrong-branch
    type: tool_used
    tool: Read
    input_match: 'references/full-agent\.md'
    min: 0
    max: 0
