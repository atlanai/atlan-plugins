schema_version: "1.1"
name: demo-dashboard-next-actions
tags: [analytics, setup, demo, regression]
execution:
  prompt: |
    Continue the Atlan Analytics Ticketfuddle demo from this completed checkpoint.
    The selected demo context was checked earlier and kept local. The requested
    dashboard has just been built at /tmp/synthetic-demo/ticketfuddle-dashboard.html.
    All numbers came from accepted demo metrics. No source reads or execution are
    needed in this turn. Show me the dashboard handoff and what I can do next.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: expected-handoff
    type: llm
    focus: last_message
    criteria: |
      PASS if the response gives the supplied dashboard location, then ends on the question
      "What would you like to do next?" with options that offer Ask more questions, Change a
      rule and see what happens, Continue building on real data and an exit choice, in any
      wording, as plain lines (this host has no question tool). Calling real-data setup
      separate from the demo is correct. FAIL if the reply offers to design a dashboard again,
      tells the person to open a new chat for real data, ends only with a restart command,
      automatically starts real-data setup, invents new results, or claims the local
      dashboard was published.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply gives the concrete result or next step in plain language,
      without a greeting, apology, em dash, machine status footer or generic offer.
      The dashboard location and the next-step question have no word limit.
      The closing "What would you like to do next?" question with its options is required by
      the skill; it is neither a generic offer nor a menu.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
