schema_version: "1.1"
name: ux-resume-held-auth
tags: [analytics, setup, ux, auth, resume]
execution:
  prompt: |
    Use Atlan Analytics to resume /workspace/.atlan-metrics/shipping-run from this supplied
    checkpoint. Do not run tools beyond reading the plugin instructions in this test. Inspect
    and scope are complete. The engine has one provisional Shipped units candidate: units
    on shipped orders, SUM(s.units), status = 'shipped', evidence from the shipments model.
    Its SQL is not executed. A second candidate, Return rate, is held for required_filter_missing.
    Both are local; nothing is published. Do not clear or rewrite the hold.

    The selected Codex Atlan connection is disabled. No OAuth task is running. The previous
    assistant already made three failed recovery attempts at this same disabled-connection
    step. The user closed the optional preview panel and wants to continue in chat.
    Give the next useful update without restarting or pretending to complete the run.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: resume-and-hold-integrity
    type: llm
    focus: last_message
    criteria: |
      Saved run /workspace/.atlan-metrics/shipping-run has completed inspect and scope.
      Provisional Shipped units is units on shipped orders, SUM(s.units), mandatory filter
      status = 'shipped', from the shipments model. Its SQL has not executed. A second
      candidate, Return rate, is held because a required filter is missing. Both are local,
      zero published. PASS if the reply shows that real sample with calculation, population,
      source and unexecuted/local status, preserves the Return rate hold and continues from
      the saved work. A plain-language description of the hold is preferred; the raw token
      required_filter_missing need not be printed. FAIL on repeating intake or claiming
      export, publication, hold clearance or successful execution checks.
  - name: stop-retry-and-respect-dismissal
    type: llm
    focus: last_message
    criteria: |
      Known checkpoint: the selected Codex Atlan connection is disabled, no OAuth job exists,
      and three failed recovery attempts already occurred at this same step. The user closed
      the optional panel and wants chat. PASS if the reply stops retries, names enabling the
      existing connection in the host as the next action and keeps the run. Explaining that
      retries have stopped is correct, not a fourth attempt. FAIL on another retry or a claim
      that one occurred, OAuth, identity switching, duplicate installation, reopening the
      panel, invented settings section names or automatic wake-up of a closed chat.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      The user needs a saved-state update after three failed disabled-connection retries.
      PASS if it concisely shows one provisional sample and the held item, then one next action
      to enable the existing connection, with a natural ending. No machine status footer,
      internal gate dump, repeated pipeline plan, robot-like retry tally or generic offer.
      Honest local/unexecuted status and a brief explanation that retries stopped are useful.
  # Checkpoint prompts authorize instruction reads, not new execution or Registry calls.
  - name: no-shell-calls
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-registry-read-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_read_tool
    min: 0
    max: 0
  - name: no-registry-write-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic-calls
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
