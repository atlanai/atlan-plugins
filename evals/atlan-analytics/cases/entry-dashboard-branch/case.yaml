schema_version: "1.1"
name: entry-dashboard-branch
tags: [analytics, build, entry, intent]
execution:
  prompt: |
    Use Atlan Analytics to continue setting up analytics on my own data.
    Read plugin instructions only in this test; do not execute commands or contact services. The host exposes no native question tool in this test, so use ordinary chat.
    The person already answered card 1: Snowflake, which is already connected, and "Make my
    dashboard agentic". The working folder holds no BI files. No data has been read and
    nothing is built.
    Show the next user-facing step.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: loads-build
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analytics-build"'
    min: 1
  - name: reads-intent
    type: tool_used
    tool: Read
    input_match: 'references/setup/intent\.md'
    min: 1
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: asks-for-the-dashboard
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply asks which dashboard to use, says the person can paste its link or a
      file path, offers at least one other choice such as letting discovery decide or naming
      their tables instead, and stops. FAIL if it asks which BI tool the dashboard is in,
      offers a menu of BI tools, offers an option that only says to paste or type, asks which
      warehouse or what they want to do again, runs or describes discovery, suggests tables, or
      starts any build.
