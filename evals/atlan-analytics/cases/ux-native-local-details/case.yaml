schema_version: "1.1"
name: ux-native-local-details
tags: [analytics, setup, ux, native, resume]
context:
  scaffold_script: scaffold.sh
execution:
  # The run in this folder is local-only with Shipped units in focus (fixtures/shipping_run.py,
  # local). A details ask must not resume the setup, open the side page or pitch a save.
  prompt: |
    Show me the SQL and what's included for the Shipped units metric. Keep everything local.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: uses-analytics-skill
    type: tool_used
    tool: Skill
    input_match: 'analytics-build'
  - name: native-details-without-resuming
    type: llm
    focus: last_message
    criteria: |
      The saved run keeps Shipped units local: total units on shipped orders, SUM(s.units),
      mandatory filter s.status = 'shipped', from the shipments dbt model and query history;
      its saved query is SELECT region, SUM(units) AS shipped_units FROM shipping.shipments
      WHERE status = 'shipped' AND shipped_at >= $start_date GROUP BY region LIMIT 100.
      Its SQL example ran earlier; dashboard parity was never checked; nothing is in Atlan.
      PASS if the reply shows SQL for the metric (the saved query, or the formula with its
      filter), explains the shipped-only population, names the model and query-history source
      and gives that check status honestly, ending at the requested evidence.
      FAIL if it changes the metric, restarts setup, asks for a destination, pitches
      publishing, claims SQL ran this turn, or points to a side page or HTML view instead of
      showing the details in chat.
  - name: plain-reply
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply is a concise, useful details view for Shipped units, with its SQL,
      shipped-only population, source and honest check status. Ordinary code formatting is
      appropriate. FAIL on workflow menus, narration of the commands run, a machine status
      footer, forced celebration or an unrelated next-action question.
  - name: no-registry-write
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_write_tool
    min: 0
    max: 0
  - name: no-registry-generic
    type: tool_used
    tool: mcp__plugin_atlanai-analytics_atlan__mcp__call_tool
    min: 0
    max: 0
