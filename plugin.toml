# The one source for every manifest in this repository.
#
# `python3 tools/build.py` writes the three marketplace files at the root and each plugin's
# manifests under plugins/<name>/ from this file. Edit here, never in the generated files:
# `python3 tools/build.py --check` fails on drift.

[plugin]
# Immutable once published. Every manifest and every marketplace uses this exact name, so the
# skill prefix is the same in every tool (`atlan:atlan-get-started` in Claude Code).
name = "atlan"
display_name = "Atlan"
# Bump on every release: Claude Code holds users on the version they installed.
version = "0.1.6"
description = "Find, use and publish skills, agents, MCP servers and knowledge in the Atlan registry, through Atlan's remote MCP server and guided skills."
short_description = "Skills, agents and MCP from the Atlan registry"
long_description = "Connect your coding agent to the Atlan registry with one OAuth sign-in. Search your organization's skills, agents, knowledge and MCP servers, install a registry skill into the current project, reach every MCP server your organization registered through one gateway, and publish skills, agents and outputs back with the registry's own authoring recipes."
license = "Apache-2.0"
homepage = "https://github.com/atlanai/atlan-plugins"
repository = "https://github.com/atlanai/atlan-plugins"
keywords = ["atlan", "registry", "skills", "agents", "mcp", "knowledge", "catalog", "governance"]
category = "Developer Tools"
brand_color = "#2026D2"
# Plugin-relative. The build copies assets/logo.svg into every plugin folder.
logo = "./assets/logo.svg"
privacy_policy_url = "https://atlan.com/privacy-policy/"
# terms_url = ""  # Codex's directory listing asks for one; add it once Atlan names the page.

[author]
name = "Atlan"
url = "https://atlan.com"

[marketplace]
# Not `atlan`: the registry names each organization's authenticated Claude Code marketplace
# after its org handle, and an org handled `atlan` would collide with it on one machine.
name = "atlan-plugins"
display_name = "Atlan"
description = "Atlan's plugins for coding agents: the Atlan registry's MCP server, the skills to use it, and workloads built on it."

[mcp]
# The server key every Atlan plugin uses, the registry's own umbrella plugin included.
server = "atlan"
# The registry's public MCP endpoint (Streamable HTTP, OAuth 2.1 resource server). The bare
# URL is search mode: four tools that reach the whole catalogue (see
# plugins/atlan/skills/atlan-get-started/references/calling-tools.md).
url = "https://api.atlan.com/mcp"
# Sent as the `X-Atlan-Client` header, `<client>/<version>`, so the gateway records which install
# a session came from; a server added by hand sends none (MCP service decision
# mcp-2026-10-30-session-records-the-install-surface).
client = "atlan-plugin"

[codex]
capabilities = ["Interactive", "Write"]
# Codex shows at most three and truncates at 128 characters; about 50 reads best.
default_prompts = [
  "Show my organization's skills and agents in Atlan",
  "Find an Atlan skill for this task and install it",
  "Publish the skill in this folder to Atlan",
]

# Add-ons: a workload built on the registry, as its own plugin under plugins/<name>/ in this
# marketplace. It depends on this plugin and declares no MCP server, so it reaches Atlan through
# this plugin's connection. Its skills, commands and agents are written in its folder; the app
# behind the workload pins this repository. Bump an add-on's version on every release of it.
[[addons]]
name = "atlan-analytics"
display_name = "Atlan Analytics"
version = "0.1.4"
description = "Bootstrap metrics and saved SQL queries, build a talk-to-data agent, evaluate it and improve it against your Snowflake or Databricks warehouse, on the Atlan registry."
short_description = "Metrics and talk-to-data agents on Atlan"
long_description = "The analytics workload on the Atlan registry. Mine your warehouse's query history into governed metrics and saved queries, build a talk-to-data agent that reads them, measure it against a local eval set and improve it round by round, or propose a metric fix from a conversation. It finds your Snowflake, Databricks or other warehouse through Atlan or your own connector, and asks you to connect one when it is missing. It uses the Atlan plugin's connection; building and evaluating an agent needs Claude Code."
keywords = ["atlan", "analytics", "metrics", "text-to-sql", "talk-to-data", "snowflake", "databricks", "evals"]
category = "Data"
default_prompts = [
  "Build metrics and saved queries for our support tables from the warehouse's query history",
  "Build a talk-to-data agent for our revenue questions",
  "Propose a fix for the metric we just found was wrong",
]

# Codex's card for each skill in every plugin above, vendored recipes included: tools/build.py
# writes it to skills/<name>/agents/openai.yaml with a dependency on the `atlan` MCP server, so a
# skill installed on its own still asks for the server. Every skill needs an entry. `prompt` is
# the starter prompt and invokes the skill as `$<name>`, Codex's explicit mention.
[skills.atlan-get-started]
display_name = "Get Started with Atlan"
short_description = "Connect to Atlan and pick the right skill"
prompt = "Use $atlan-get-started to check my Atlan sign-in and show what my organization has."

[skills.atlan-find-artifacts]
display_name = "Find in Atlan"
short_description = "Search skills, agents, knowledge and MCP servers"
prompt = "Use $atlan-find-artifacts to find what my organization already has for this task."

[skills.atlan-use-skill]
display_name = "Use an Atlan Skill"
short_description = "Load or install a skill from the Atlan registry"
prompt = "Use $atlan-use-skill to find an Atlan skill for this task and use it here."

[skills.atlan-use-mcp-servers]
display_name = "MCP Servers through Atlan"
short_description = "Call Slack, Linear and other servers through Atlan"
prompt = "Use $atlan-use-mcp-servers to list the MCP servers my organization registered in Atlan."

[skills.atlan-continue]
display_name = "Continue from Atlan"
short_description = "Pick up an artifact handed over from the dashboard"
prompt = "Use $atlan-continue to catch me up on this Atlan artifact and the session that made it."

[skills.atlan-troubleshoot]
display_name = "Troubleshoot Atlan"
short_description = "Diagnose failing or refused Atlan tool calls"
prompt = "Use $atlan-troubleshoot to find out why my last Atlan call failed."

[skills.atlan-upload-content]
display_name = "Upload to Atlan"
short_description = "Upload a bundle, document or dataset as a file"
prompt = "Use $atlan-upload-content to upload this file to Atlan."

[skills.atlan-read-content]
display_name = "Read Atlan Content"
short_description = "Read a skill's or a file's contents in Atlan"
prompt = "Use $atlan-read-content to read an Atlan skill's SKILL.md and references."

[skills.atlan-author-skills]
display_name = "Publish a Skill"
short_description = "Create a skill in Atlan or publish a new version"
prompt = "Use $atlan-author-skills to publish the skill in this folder to Atlan."

[skills.atlan-link-skill]
display_name = "Sync Skills from GitHub"
short_description = "Set up GitHub-to-Atlan sync for a repository"
prompt = "Use $atlan-link-skill to sync this repository's skills to Atlan from GitHub."

[skills.atlan-author-agents]
display_name = "Register an Agent"
short_description = "Catalogue an agent or harness in Atlan"
prompt = "Use $atlan-author-agents to register the agent in this repository in Atlan."

[skills.atlan-link-agent]
display_name = "Link a Repository's Agent"
short_description = "Link a repository's skills and agents to Atlan"
prompt = "Use $atlan-link-agent to link this repository's agent and skills to Atlan."

[skills.atlan-record-outputs]
display_name = "Record an Output"
short_description = "Record a deliverable as an Atlan output"
prompt = "Use $atlan-record-outputs to record this deliverable as an Atlan output."

[skills.atlan-analytics]
display_name = "Atlan Analytics"
short_description = "Metrics and talk-to-data agents on Atlan"
prompt = "Use $atlan-analytics to build metrics or a talk-to-data agent on Atlan."

[skills.atlan-analytics-build]
display_name = "Build a Talk-to-Data Agent"
short_description = "Build and baseline a new talk-to-data agent"
prompt = "Use $atlan-analytics-build to build a talk-to-data agent for our revenue questions."

[skills.atlan-analytics-connect]
display_name = "Connect a Warehouse"
short_description = "Find and check the warehouse's read-only SQL tool"
prompt = "Use $atlan-analytics-connect to connect our Snowflake or Databricks warehouse."

[skills.atlan-analytics-eval]
display_name = "Evaluate a Talk-to-Data Agent"
short_description = "Score an agent against its eval set"
prompt = "Use $atlan-analytics-eval to score our talk-to-data agent against its eval set."

[skills.atlan-analytics-improve]
display_name = "Improve a Talk-to-Data Agent"
short_description = "Iterate on an agent against a fixed eval"
prompt = "Use $atlan-analytics-improve to improve our talk-to-data agent against its evals."
