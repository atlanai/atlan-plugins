# The one source for every manifest in this repository.
#
# `python3 tools/build.py` writes the three marketplace files at the root and each plugin's
# manifests under plugins/<name>/ from this file. Edit here, never in the generated files:
# `python3 tools/build.py --check` fails on drift.

[plugin]
# Every manifest and every marketplace uses this exact name, so the skill prefix is the same in
# every tool (`atlanai:atlan-get-started` in Claude Code). It is `atlanai`, not `atlan`: Anthropic's
# plugin directory lists a different plugin named `atlan` (atlanhq/agent-toolkit, Atlan's data
# catalog), and two plugins of one name share a skill prefix and an MCP server slot, so one
# silently replaces the other. `atlanai` is also the name of the registry's own plugin, which
# serves the same `atlan` server, so installing both collapses to one server instead of two.
name = "atlanai"
display_name = "AI Registry"
# Bump on every release: Claude Code holds users on the version they installed.
version = "0.5.39"
description = "Your organization's skills, agents, knowledge and MCP servers, from the Atlan registry. One sign-in, no API key."
short_description = "Atlan AI Registry"
long_description = "Connect your coding agent to the Atlan registry with one OAuth sign-in. Search your organization's skills, agents, knowledge and MCP servers, install a registry skill into the current project, reach every MCP server your organization registered through one gateway, and publish skills, agents and outputs back with the registry's own authoring recipes."
license = "Apache-2.0"
homepage = "https://github.com/atlanai/atlan-plugins"
repository = "https://github.com/atlanai/atlan-plugins"
keywords = ["atlan", "registry", "skills", "agents", "mcp", "knowledge", "catalog", "governance"]
# Codex's category, from its directory's set (Developer Tools, Productivity, Data & Analytics, ...).
category = "Developer Tools"
# Claude's category, from the slugs Anthropic's marketplaces use (development, productivity,
# database, data, ...); claude.ai shows its own label for each.
claude_category = "development"
brand_color = "#2026D2"
# Plugin-relative. The build copies assets/logo.svg into every plugin folder.
logo = "./assets/logo.svg"
privacy_policy_url = "https://atlan.com/privacy-policy/"
# Claude Code's hooks module, plugin-relative: the publish helper, which lets the skill create take
# `files_from` (see claude-hooks/register.ts). Named only in .claude-plugin/plugin.json and kept out
# of hooks/, the folder Codex and Cursor read by default, since only Claude Code runs a module. A
# variant leaves it out, as it leaves out the mods.
claude_hooks = "./claude-hooks/hooks.json"
# The same helper as a command hook for Codex and Cursor (command-hooks/publish_hook.py), named from
# each one's own manifest field: Codex's `extensions.com.openai.hooks` in plugin.json (and the legacy
# .codex-plugin overlay), Cursor's `hooks` in .cursor-plugin/plugin.json. Setting each turns off that
# harness's hooks/hooks.json discovery. A variant leaves them out too.
codex_hooks = "./command-hooks/codex.json"
cursor_hooks = "./command-hooks/cursor.json"
# terms_url = ""  # Codex's directory listing asks for one; add it once Atlan names the page.

[author]
name = "Atlan"
url = "https://atlan.com"

[marketplace]
# Claude lists each plugin "by <marketplace name>", so the name is the brand. The registry names
# each organization's own marketplace after its org handle (`atlan-prod`, `atlan-com`); an org
# handled exactly `atlan` would collide with this one on one machine.
name = "atlan"
display_name = "Atlan Trident"
description = "Atlan's plugins for coding agents: the Atlan registry's MCP server, the skills to use it, and workloads built on it."

[mcp]
# The server key every Atlan plugin uses, the registry's own umbrella plugin included.
server = "atlan"
# The registry's public MCP endpoint (Streamable HTTP, OAuth 2.1 resource server). The bare
# URL is search mode: a few helper tools that reach the whole catalogue (see
# plugins/atlanai/skills/atlan-get-started/references/full-mode.md).
url = "https://api.atlan.com/mcp"
# Sent as the `X-Atlan-Client` header, `<client>/<version>`, so the gateway records which install
# a session came from; a server added by hand sends none (app-mcp decision
# mcp-2026-10-30-session-records-the-install-surface).
client = "atlan-plugin"

[codex]
capabilities = ["Interactive", "Write"]
# The skill Codex offers to run right after install: it checks the sign-in and shows what the
# organization has. Plugin-relative, and it must be a skill this plugin ships.
onboarding_skill = "./skills/atlan-get-started/SKILL.md"
# Codex shows at most three and truncates at 128 characters; about 50 reads best.
default_prompts = [
  "Connect me to Atlan",
  "Find an Atlan skill for this task and install it",
  "Publish the skill in this folder to Atlan",
]
# The directory listing's screenshots: images placed by hand in the core's own assets/ folder
# (plugins/atlanai/assets/), plugin-relative. `make codex-directory` says when none are set.
# screenshots = ["./assets/screenshot-search.png"]

# Add-ons: a workload built on the registry, as its own plugin under plugins/<name>/ in this
# marketplace. It depends on this plugin and declares no MCP server, so it reaches Atlan through
# this plugin's connection. Its skills, commands and agents are written in its folder; the app
# behind the workload pins this repository. Bump an add-on's version on every release of it.
[[addons]]
name = "atlanai-analytics"
display_name = "Analytics"
version = "0.6.11"
description = "Prepare a link, local folder or BI export for talk-to-data in Claude or Codex: survey dashboards and query history, select scope, preview metrics and SQL, publish to Atlan and ask questions from released context. Also supports warehouse analytics, business ontology and explicit agent workflows."
short_description = "Publish analytics context and ask your data with Atlan"
long_description = "The analytics workload on the Atlan registry. Ask a data question and get an answer from your published metrics and saved queries, with the definition it used. Mine your warehouse's query history into governed metrics and saved queries, build a talk-to-data agent that reads them, measure it against a local eval set and improve it round by round, or propose a metric fix from a conversation. Ask how business objects relate and which tables hold them, check which policy applied on a date, or draft an ontology for review in Ontology Studio. It finds your Snowflake, Databricks or other warehouse through Atlan or your own connector, and asks you to connect one when it is missing. It uses the Atlan plugin's connection. Turn a Power BI dashboard into SQL metrics, compare dashboard answers, evaluate a fresh Claude or Codex agent and ask questions from released definitions."
keywords = ["atlan", "analytics", "metrics", "text-to-sql", "talk-to-data", "snowflake", "databricks", "evals"]
category = "Data & Analytics"
claude_category = "data"
# Codex and Claude share the dashboard helper and question-only eval runner.
default_prompts = [
  "Help me use this dashboard, folder or BI export to ask questions about my data",
  "Build and test a talk-to-data agent from this Power BI dashboard",
  "Build metrics and saved queries for our support tables from the warehouse's query history",
  "How do customers join to orders in our business ontology, and which tables hold them?",
]

# Mods: Claude Code plugins whose hooks module changes how Claude Code handles the core's tools,
# as its own plugin under plugins/<name>/. Only Claude Code loads a hooks module, so a mod is listed
# in the Claude marketplace alone and needs no Codex or Cursor manifest. It depends on the core and
# declares no MCP server. Its hooks module, tests and README are written in its folder; the build
# writes its manifest from here. Bump a mod's version on every release of it. A mod keeps its
# session state in its hooks module: `$.state` needs a `types` contract in plugin.json, which the
# desktop app does not read (tools/lint.py refuses it).
[[mods]]
name = "atlanai-mods"
display_name = "Registry Mods"
version = "0.4.4"
description = "Claude Code mod for the Atlan registry: registry reads run without a prompt, writes ask first, archive and move show what depends on the artifact, temporary gateway errors tell Claude how to retry, Atlan calls read as one line in the transcript, a pane lists what the session touched, a band follows a skill publish, /atlan skills picks a skill to load, a registry skill that clearly fits a request is named to Claude, and the status line reports a broken or degraded Atlan connection."
keywords = ["atlan", "registry", "mods", "permissions"]
claude_category = "development"

[mods.user_config.confirm_writes]
type = "boolean"
title = "Ask before registry writes"
description = "Ask before Claude creates or changes anything in Atlan. Archive, approve and move always ask."
default = true

[mods.user_config.suggest_skills]
type = "boolean"
title = "Suggest registry skills"
description = "Search your organization's Atlan skills with each request, and name one to Claude when it clearly fits. The first 300 characters of the request are sent to Atlan's search."
default = true

# Codex's card for each skill in every plugin above: tools/build.py
# writes it to skills/<name>/agents/openai.yaml with a dependency on the `atlan` MCP server, so a
# skill installed on its own still asks for the server. Every skill needs an entry. `prompt` is
# the starter prompt and invokes the skill as `$<name>`, Codex's explicit mention.
[skills.atlan-get-started]
display_name = "Get Started with Atlan"
short_description = "Connect to Atlan and pick the right skill"
prompt = "Use $atlan-get-started to check my Atlan sign-in and show what my organization has."

[skills.atlan-find-artifacts]
display_name = "Find in Atlan"
short_description = "Search skills, agents, knowledge and MCP servers"
prompt = "Use $atlan-find-artifacts to find what my organization already has for this task."

[skills.atlan-use-skill]
display_name = "Use an Atlan Skill"
short_description = "Load or install a skill from the Atlan registry"
prompt = "Use $atlan-use-skill to find an Atlan skill for this task and use it here."

[skills.atlan-use-mcp-servers]
display_name = "MCP Servers through Atlan"
short_description = "Call Slack, Linear and other servers through Atlan"
prompt = "Use $atlan-use-mcp-servers to list the MCP servers my organization registered in Atlan."

[skills.atlan-manage-artifacts]
display_name = "Manage Atlan Artifacts"
short_description = "Archive, move, roll back or approve, seeing what depends on it"
prompt = "Use $atlan-manage-artifacts to show what is waiting for my review in Atlan."

[skills.atlan-share]
display_name = "Share or Record an Output"
short_description = "Save or share a deliverable in Atlan and post it to Slack"
prompt = "Use $atlan-share to share this with my team in Atlan and post it to our Slack channel."

[skills.atlan-continue]
display_name = "Continue from Atlan"
short_description = "Pick up an artifact handed over from the dashboard"
prompt = "Use $atlan-continue to catch me up on this Atlan artifact and the session that made it."

[skills.atlan-troubleshoot]
display_name = "Troubleshoot Atlan"
short_description = "Diagnose failing or refused Atlan tool calls"
prompt = "Use $atlan-troubleshoot to find out why my last Atlan call failed."

[skills.atlan-content]
display_name = "Atlan Files"
short_description = "Upload, read or version a file in Atlan"
prompt = "Use $atlan-content to upload this file to Atlan, or read an Atlan skill's files."

[skills.atlan-author-knowledge]
display_name = "Author Knowledge"
short_description = "Create or edit a knowledge bundle in Atlan"
prompt = "Use $atlan-author-knowledge to publish these Markdown notes as an Atlan knowledge bundle."

[skills.atlan-connect-repo]
display_name = "Connect a Repository"
short_description = "Sync a repository's skills and agents to Atlan"
prompt = "Use $atlan-connect-repo to publish this repository's skills and agents to Atlan from GitHub."

[skills.atlan-author-skills]
display_name = "Publish a Skill"
short_description = "Create a skill in Atlan or publish a new version"
prompt = "Use $atlan-author-skills to publish the skill in this folder to Atlan."

[skills.atlan-author-agents]
display_name = "Register an Agent"
short_description = "Catalogue an agent or harness in Atlan"
prompt = "Use $atlan-author-agents to register the agent in this repository in Atlan."

[skills.atlan-analytics]
display_name = "Atlan Analytics"
short_description = "Set up analytics, publish context and ask your data"
prompt = "Use $atlan-analytics to set up this project so I can ask questions about its data."

[skills.atlan-ontology]
display_name = "Business Ontology"
short_description = "Business objects, joins, policies and model drafts"
prompt = "Use $atlan-ontology to explain how Customer relates to Order in our ontology."

[skills.atlan-analytics-ask]
display_name = "Ask Your Data"
short_description = "Answer a data question from published metrics"
prompt = "Use $atlan-analytics-ask to answer: what was revenue last quarter, by region?"

