# The one source for every manifest in this repository.
#
# `python3 tools/build.py` writes the three marketplace files at the root and each plugin's
# manifests under plugins/<name>/ from this file. Edit here, never in the generated files:
# `python3 tools/build.py --check` fails on drift.

[plugin]
# Every manifest and every marketplace uses this exact name, so the skill prefix is the same in
# every tool (`atlanai:atlan-get-started` in Claude Code). It is `atlanai`, not `atlan`: Anthropic's
# plugin directory lists a different plugin named `atlan` (atlanhq/agent-toolkit, Atlan's data
# catalog), and two plugins of one name share a skill prefix and an MCP server slot, so one
# silently replaces the other. `atlanai` is also the name of Atlan Trident's own plugin, which
# serves the same `atlan` server, so installing both collapses to one server instead of two.
name = "atlanai"
display_name = "Atlan Trident"
# Bump on every release: Claude Code holds users on the version they installed.
version = "0.5.65"
description = "Your organization's skills, agents, knowledge and MCP servers, from Atlan Trident. One sign-in, no API key."
short_description = "Skills, agents and tools"
long_description = "Connect your coding agent to Atlan Trident with one OAuth sign-in. Search your organization's skills, agents, knowledge and MCP servers, install an Atlan Trident skill into the current project, reach every MCP server your organization registered through one gateway, and publish skills, agents and outputs back with Atlan Trident's own authoring recipes."
license = "Apache-2.0"
homepage = "https://github.com/atlanai/atlan-plugins"
repository = "https://github.com/atlanai/atlan-plugins"
keywords = ["atlan", "trident", "registry", "skills", "agents", "mcp", "knowledge", "catalog", "governance"]
# Codex's category, from its directory's set (Developer Tools, Productivity, Data & Analytics, ...).
category = "Developer Tools"
# Claude's category, from the slugs Anthropic's marketplaces use (development, productivity,
# database, data, ...); claude.ai shows its own label for each.
claude_category = "development"
brand_color = "#2026D2"
# Plugin-relative. The build copies assets/logo.svg into every plugin folder.
logo = "./assets/logo.svg"
privacy_policy_url = "https://atlan.com/privacy-policy/"
# Claude Code's hooks module, plugin-relative: the publish helper, which lets the skill create take
# `files_from` (see claude-hooks/register.ts). Named only in .claude-plugin/plugin.json and kept out
# of hooks/, the folder Codex and Cursor read by default, since only Claude Code runs a module. A
# variant leaves it out, as it leaves out the mods.
claude_hooks = "./claude-hooks/hooks.json"
# The same helper as a command hook for Codex and Cursor (command-hooks/publish_hook.py), named from
# each one's own manifest field: Codex's `extensions.com.openai.hooks` in plugin.json (and the legacy
# .codex-plugin overlay), Cursor's `hooks` in .cursor-plugin/plugin.json. Setting each turns off that
# harness's hooks/hooks.json discovery. A variant leaves them out too.
codex_hooks = "./command-hooks/codex.json"
cursor_hooks = "./command-hooks/cursor.json"
# terms_url = ""  # Codex's directory listing asks for one; add it once Atlan names the page.

[author]
name = "Atlan"
url = "https://atlan.com"

[marketplace]
# Claude lists each plugin "by <marketplace name>", so the name is the brand. Atlan Trident names
# each organization's own marketplace after its org handle (`atlan-prod`, `atlan-com`); an org
# handled exactly `atlan` would collide with this one on one machine.
name = "atlan"
display_name = "Atlan Trident"
description = "Atlan's plugins for coding agents: Atlan Trident's MCP server, the skills to use it, and workloads built on it."

[mcp]
# The server key every Atlan plugin uses, Atlan Trident's own umbrella plugin included.
server = "atlan"
# Atlan Trident's public MCP endpoint (Streamable HTTP, OAuth 2.1 resource server). The bare
# URL is search mode: a few helper tools that reach the whole catalogue (see
# plugins/atlanai/skills/atlan-get-started/references/full-mode.md).
url = "https://api.atlan.com/mcp"
# Sent as the `X-Atlan-Client` header, `<client>/<version>`, so the gateway records which install
# a session came from; a server added by hand sends none (MCP service decision
# mcp-2026-10-30-session-records-the-install-surface).
client = "atlan-plugin"

[codex]
capabilities = ["Interactive", "Write"]
# The skill Codex offers to run right after install: it checks the sign-in and shows what the
# organization has. Plugin-relative, and it must be a skill this plugin ships.
onboarding_skill = "./skills/atlan-get-started/SKILL.md"
# Codex shows at most three and truncates at 128 characters; about 50 reads best.
default_prompts = [
  "Connect me to Atlan",
  "Find an Atlan skill for this task and install it",
  "Publish the skill in this folder to Atlan",
]
# The directory listing's screenshots: images placed by hand in the core's own assets/ folder
# (plugins/atlanai/assets/), plugin-relative. `make codex-directory` says when none are set.
# screenshots = ["./assets/screenshot-search.png"]

# Add-ons: a workload built on Atlan Trident, as its own plugin under plugins/<name>/ in this
# marketplace. It depends on this plugin and declares no MCP server, so it reaches Atlan through
# this plugin's connection. Its skills, commands and agents are written in its folder; the app
# behind the workload pins this repository. Bump an add-on's version on every release of it.
[[addons]]
name = "atlanai-analytics"
display_name = "Atlan Analytics"
version = "0.9.99"
description = "Build an agent that answers your data questions, on a demo or your own data: I extract the context in your dashboards and past queries, add detailed information to it and validate it, then you store it here or save it to Atlan Trident, ask it questions and build a dashboard."
short_description = "Build an agent that answers your data questions"
long_description = "The analytics workload on Atlan Trident, as seven skills. analytics-demo walks through a made-up firm end to end. analytics-build does the same on your own data, starting from nothing, a dashboard or a subject: it surveys what you already have, asks what you want to answer, and builds from dashboards first, then past queries, then table definitions. source-survey says what a setup, a subject or a source holds, what can be built from it, and which metric names it offers. metrics-generation builds, tests, edits, proposes and saves metrics and saved queries. analytics-ask answers a data question from saved metrics, names what each answer is based on, and turns answers into a dashboard. eval-generation turns the questions a team already asks into test questions with known answers, kept here or saved to Atlan Trident. accuracy-check tests your agent on those questions and scores it, saying why each miss failed. It finds your Snowflake, Databricks or other warehouse through Atlan or your own connector, and uses the Atlan plugin's connection."
keywords = ["atlan", "analytics", "metrics", "text-to-sql", "talk-to-data", "snowflake", "databricks", "dashboards"]
category = "Data & Analytics"
claude_category = "data"
install_note = """
**Build progress in Claude Code.** In the terminal, a build's progress shows in Claude Code's own task list. Some models have the task list on
by default. If yours shows no task list, add this to the `env` in your Claude Code settings
(`~/.claude/settings.json`) once, then start a new session:

```json
{"env": {"CLAUDE_CODE_ENABLE_TODO_TOOLS": "1"}}
```

Without it, each finished build step shows as one line in the chat.
"""
default_prompts = [
  "Show me an Atlan Analytics demo",
  "Help me use this dashboard, folder or BI export to ask questions about my data",
  "Build metrics and saved queries for our support tables from the warehouse's past queries",
]

# The add-on README's own sections. The skills table comes from each skill's [skills.<name>] card,
# in the order `skills` names them, and the build fails when a skill folder is missing from it.
[addons.readme]
intro = """
This plugin builds your agent: it answers your data questions in plain English from your
context, the metrics and saved queries the plugin builds and tests. Each answer names the metric
or saved query it used, or says when it had to write new SQL for the question.

It builds that context from what your team already relies on: dashboards first, then past
queries, then table definitions. It tests each metric and saved query on your data, when it can reach
your data, before you keep them on this machine or save them to share with your team.
"""
needs = [
  "**To try a sample:** Python 3.11 or 3.12. Put `python3.12` or `python3.11` on your `PATH`, or use `py -3.12` on Windows. Samples bring their own data and need no account.",
  "**For your own data:** the same Python, and a dashboard file, a warehouse your coding agent can reach (such as Snowflake or Databricks), or both. For a warehouse, read access to its tables, and to past queries if you build from them.",
  "**To save for your team (optional):** an Atlan account, signed in through the `atlanai` plugin. The plugin installs either way, and without a sign-in everything stays on this machine.",
]
how = """
- A **metric** is a named number with its rule, such as revenue by month.
- A **saved query** is a tested SQL question your agent can rerun, such as margin by job.
- Together they are **your context**. **Your agent** answers from it, and finds the right
  metric or saved query for each question. It runs in the coding agent you use, such as Claude
  Code or Codex.
- A **workspace** is where your team keeps that context when you save it, so others can ask
  from it too.
"""
starts = [
  ["Learn how it works on a sample", "analytics-demo", "Show me how this works on a sample use case"],
  ["Build your agent from your own data or a dashboard", "analytics-build", "Help me use this dashboard to ask questions about my data"],
  ["Ask your agent a question", "analytics-ask", "What was revenue last quarter, by region?"],
]
quick_start = "The skill shows its steps as it goes, and asks before it saves anything to Atlan."
samples_intro = "Two fictional companies, with made-up data, ship with the plugin. Each sample builds your agent for the company: its context, the metrics and saved queries, from its dashboard, tests them on the sample data, asks where to keep them, then answers your first question."
samples = [
  ["Fixit & Co., a builder's yard", "Which jobs lost money, and why. Built from a Power BI dashboard in about 15 minutes.", "https://atlanai.github.io/analytics-agent-accelerator/yard-tour/"],
  ["Ticketfuddle, a ticketing firm", "How much of what fans paid went on fees. Built from a Tableau dashboard in about 15 to 20 minutes.", "https://atlanai.github.io/analytics-agent-accelerator/box-office-tour/"],
]
skills = ["analytics-demo", "analytics-build", "source-survey", "metrics-generation", "analytics-ask", "eval-generation", "accuracy-check"]
privacy = """
This plugin has no hooks and ships no executable binaries.

- **Runs:** the Python helpers bundled with its skills, and a metrics runtime in its own virtual
  environment, with pinned packages pip installs from your package index (PyPI unless pip is set
  otherwise).
- **Reads:** the sources you pick, your warehouse through read-only statements (SELECT, WITH, SHOW
  or DESCRIBE, with a LIMIT on anything that returns rows), and a Power BI workspace or Tableau
  site through its API when you point the plugin at one.
- **Credentials:** the ones you set for your own systems: `PBI_*` for Power BI, `TABLEAU_*` for
  Tableau, and `METRICS_AGENT_WAREHOUSE_DSN` for a local DuckDB or SQLite file. Each goes only to
  the system it names (Microsoft's sign-in and Power BI or Fabric APIs, your Tableau server), never
  anywhere else.
- **Writes:** working files in one folder in your project, `.atlan-analytics/`: each run, the
  metrics runtime, test questions (`evals/`) and a demo's data (`demo/`). Add it to `.gitignore`.
  Reading a Power BI workspace caches its sign-in token under `~/.cache/pbi_definition_extract/`.
- **Sends:** to Atlan, only what you approve saving, through the `atlanai` plugin's connection,
  signed in as you.
- **Starts:** a progress page served on `127.0.0.1` for this machine only, opened in your browser;
  and, when you check accuracy, your own Claude Code or Codex CLI to answer each test question
  fresh, signed in as you.
"""
source = """
The skills and scripts in this folder are the only source.
"""
troubleshooting = [
  ["The skills say the `atlanai` tools are missing", "Outside Claude Code, install `atlanai` first. In Claude Code, run `/reload-plugins`."],
  ["Sign-in is needed or has expired", "In Claude Code: `/mcp`, pick `plugin:atlanai:atlan`, **Authenticate**. In Codex: `codex mcp login atlan`."],
  ["No warehouse is found", "The plugin asks to connect one: your coding agent's own connector, a vendor CLI where there is a shell, or the `atlanai` connection."],
  ["Python 3.11 or 3.12 is not found", "Install one so `python3.12` or `python3.11` is on your `PATH`, then ask the plugin to continue."],
  ["There is nowhere to save for your team", "Keep the work on this machine, or ask for access to an existing Atlan workspace. An admin makes new ones."],
]

# Mods: Claude Code plugins whose hooks module changes how Claude Code handles the core's tools,
# as its own plugin under plugins/<name>/. Only Claude Code loads a hooks module, so a mod is listed
# in the Claude marketplace alone and needs no Codex or Cursor manifest. It depends on the core and
# declares no MCP server. Its hooks module, tests and README are written in its folder; the build
# writes its manifest from here. Bump a mod's version on every release of it. A mod keeps its
# session state in its hooks module: `$.state` needs a `types` contract in plugin.json, which the
# desktop app does not read (tools/lint.py refuses it).
[[mods]]
name = "atlanai-mods"
display_name = "Trident Mods"
version = "0.4.11"
description = "Claude Code mod for Atlan Trident: Atlan Trident reads run without a prompt, writes ask first, archive and move show what depends on the artifact, temporary gateway errors tell Claude how to retry, Atlan calls read as one line in the transcript, a pane lists what the session touched, a band follows a skill publish, /atlan skills picks a skill to load, an Atlan Trident skill that clearly fits a request is named to Claude, and the status line reports a broken or degraded Atlan connection."
keywords = ["atlan", "trident", "registry", "mods", "permissions"]
claude_category = "development"

[mods.user_config.confirm_writes]
type = "boolean"
title = "Ask before Trident writes"
description = "Ask before Claude creates or changes anything in Atlan. Archive, approve, move, release and roll-back always ask."
default = true

[mods.user_config.suggest_skills]
type = "boolean"
title = "Suggest Trident skills"
description = "Search your organization's Atlan skills with each request, and name one to Claude when it clearly fits. The first 300 characters of the request are sent to Atlan's search."
default = true

# Codex's card for each skill in every plugin above: tools/build.py
# writes it to skills/<name>/agents/openai.yaml with a dependency on the `atlan` MCP server, so a
# skill installed on its own still asks for the server. Every skill needs an entry. `prompt` is
# the starter prompt and invokes the skill as `$<name>`, Codex's explicit mention.
[skills.atlan-get-started]
display_name = "Get Started with Atlan"
short_description = "Connect to Atlan and pick the right skill"
prompt = "Use $atlan-get-started to check my Atlan sign-in and show what my organization has."

[skills.atlan-find-artifacts]
display_name = "Find in Atlan"
short_description = "Search skills, agents, knowledge and MCP servers"
prompt = "Use $atlan-find-artifacts to find what my organization already has for this task."

[skills.atlan-use-skill]
display_name = "Use an Atlan Skill"
short_description = "Load or install a skill from Atlan Trident"
prompt = "Use $atlan-use-skill to find an Atlan skill for this task and use it here."

[skills.atlan-use-mcp-servers]
display_name = "MCP Servers through Atlan"
short_description = "Call Slack, Linear and other servers through Atlan"
prompt = "Use $atlan-use-mcp-servers to call a tool of an MCP server my organization registered in Atlan."

[skills.atlan-manage-artifacts]
display_name = "Manage Atlan Artifacts"
short_description = "Archive, move, roll back or approve, seeing what depends on it"
prompt = "Use $atlan-manage-artifacts to show what is waiting for my review in Atlan."

[skills.atlan-share]
display_name = "Share or Record an Output"
short_description = "Save or share a deliverable in Atlan and post it to Slack"
prompt = "Use $atlan-share to share this with my team in Atlan and post it to our Slack channel."

[skills.atlan-continue]
display_name = "Continue from Atlan"
short_description = "Pick up an artifact handed over from the dashboard"
prompt = "Use $atlan-continue to catch me up on this Atlan artifact and the session that made it."

[skills.atlan-troubleshoot]
display_name = "Troubleshoot Atlan"
short_description = "Diagnose failing or refused Atlan tool calls"
prompt = "Use $atlan-troubleshoot to find out why my last Atlan call failed."

[skills.atlan-content]
display_name = "Atlan Files"
short_description = "Upload, read or version a file in Atlan"
prompt = "Use $atlan-content to upload this file to Atlan, or read an Atlan skill's files."

[skills.atlan-author-knowledge]
display_name = "Author Knowledge"
short_description = "Create or edit a knowledge bundle in Atlan"
prompt = "Use $atlan-author-knowledge to publish these Markdown notes as an Atlan knowledge bundle."

[skills.atlan-connect-repo]
display_name = "Connect a Repository"
short_description = "Sync a repository's skills and agents to Atlan"
prompt = "Use $atlan-connect-repo to publish this repository's skills and agents to Atlan from GitHub."

[skills.atlan-author-skills]
display_name = "Publish a Skill"
short_description = "Create a skill in Atlan or publish a new version"
prompt = "Use $atlan-author-skills to publish the skill in this folder to Atlan."

[skills.atlan-author-agents]
display_name = "Register an Agent"
short_description = "Catalogue an agent or harness in Atlan"
prompt = "Use $atlan-author-agents to register the agent in this repository in Atlan."

[skills.analytics-demo]
display_name = "Analytics Demo"
short_description = "Build your agent on made-up data, step by step"
prompt = "Use $analytics-demo to show me how this works on a sample use case."

[skills.analytics-build]
display_name = "Atlan Analytics"
short_description = "Build your agent on your own data, step by step"
prompt = "Use $analytics-build to set up this project so I can ask questions about its data."

[skills.source-survey]
display_name = "Survey Your Data"
short_description = "See what data, dashboards and past queries you can build from"
prompt = "Use $source-survey to tell me what this folder's dashboards and past queries cover."

[skills.metrics-generation]
display_name = "Metrics Generation"
short_description = "Turn dashboards and past queries into metrics your agent answers from"
prompt = "Use $metrics-generation to build metrics from our warehouse's past queries."

[skills.eval-generation]
display_name = "Eval Generation"
short_description = "Write test questions, with known answers, from what your team asks"
prompt = "Use $eval-generation to write test questions for our agent from what our team already asks."

[skills.accuracy-check]
display_name = "Accuracy Check"
short_description = "Test your agent on questions with known answers"
prompt = "Use $accuracy-check to test our agent on the test questions in this project."

[skills.analytics-ask]
display_name = "Ask Your Data"
short_description = "Answer data questions from your metrics and saved queries"
prompt = "Use $analytics-ask to answer: what was revenue last quarter, by region?"

