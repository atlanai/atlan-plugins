interface:
  display_name: "Link a Repository's Agent"
  short_description: "Link a repository's skills and agents to Atlan"
  default_prompt: "Use $atlan-link-agent to link this repository's agent and skills to Atlan."
dependencies:
  tools:
    - type: "mcp"
      value: "atlan"
      description: "Atlan's MCP server, signed in with OAuth"
      transport: "streamable_http"
      url: "https://api.atlan.com/mcp"
