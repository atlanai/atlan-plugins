interface:
  display_name: "Sync Skills from GitHub"
  short_description: "Set up GitHub-to-Atlan sync for a repository"
  default_prompt: "Use $atlan-link-skill to sync this repository's skills to Atlan from GitHub."
dependencies:
  tools:
    - type: "mcp"
      value: "atlan"
      description: "Atlan's MCP server, signed in with OAuth"
      transport: "streamable_http"
      url: "https://api.atlan.com/mcp"
