[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-agent-powerbi"
dynamic = ["version"]
description = "Power BI plug for metrics-agent: semantic model and report definitions fetched from Microsoft Fabric."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlan Pte. Ltd." }]
requires-python = ">=3.11"
keywords = ["metrics", "power bi", "microsoft fabric", "tmdl", "pbir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# REST transport is standard library. Official Azure Identity 1.27.0 supplies certificate
# and managed-identity credentials. Verified Azure/azure-sdk-for-python, MIT, released
# before the 2026-11-02 cutoff. Authentication dependencies stay in this plug, never the core.
dependencies = ["metrics-agent", "azure-identity==1.27.0"]

[project.urls]
Homepage = "https://github.com/atlanai/atlan-plugins"
Documentation = "https://github.com/atlanai/atlan-plugins/tree/main/docs"
Source = "https://github.com/atlanai/atlan-plugins"
Issues = "https://github.com/atlanai/atlan-plugins/issues"

[project.entry-points."metrics_agent.plugs"]
powerbi-fabric = "metrics_agent_powerbi.plug:PowerBIFabric"

[tool.setuptools.dynamic]
version = { attr = "metrics_agent_powerbi.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
