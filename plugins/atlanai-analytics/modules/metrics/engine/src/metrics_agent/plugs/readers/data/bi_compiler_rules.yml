  # Window functions over the members of a relation (`_window_statement`): `{0}` the
  # member's value, `{n}` the count, `{over}` the window (partition, order, frame). OFFSET
  # reads the member n before (lag) or after (lead) the row's; INDEX the n-th member (the
  # order is reversed for a negative n); WINDOW sums the members of its frame (only over an
  # additive expression; another is not read as a window). Anywhere else each is a table, and
  # named as one.
  - id: dax.offset
    match: {language: dax, function: OFFSET}
    emit:
      untranslatable: >-
        a table of members; compiled only as the one filter of a CALCULATE over ALL /
        ALLSELECTED of the columns the visual groups by
      window_template: {lag: "LAG({0}, {n}) OVER ({over})", lead: "LEAD({0}, {n}) OVER ({over})"}
    tier: stable
    evidence: dax

  - id: dax.index
    match: {language: dax, function: INDEX}
    emit:
      untranslatable: >-
        a table of members; compiled only as the one filter of a CALCULATE over ALL /
        ALLSELECTED of the columns the visual groups by
      window_template: "NTH_VALUE({0}, {n}) OVER ({over})"
    tier: stable
    evidence: dax

  - id: dax.window
    match: {language: dax, function: WINDOW}
    emit:
      untranslatable: >-
        a table of members; compiled only as the one filter of a CALCULATE over ALL /
        ALLSELECTED of the columns the visual groups by
      window_template: "SUM({0}) OVER ({over})"
    tier: stable
    evidence: dax

  # ---------------------------------------------------------------- Tableau calcs
  - id: tableau.sum
    match: {language: tableau-calc, function: SUM}
    emit: {template: "SUM({0})"}
    tier: stable
    evidence: tableau-calc

  - id: tableau.avg
    match: {language: tableau-calc, function: AVG}
    emit: {template: "AVG({0})"}
    tier: stable
    evidence: tableau-calc

  - id: tableau.min
    match: {language: tableau-calc, function: MIN}
    emit: {template: "MIN({0})", by_arity: {"2": "(CASE WHEN {0} IS NULL OR {1} IS NULL THEN NULL WHEN {0} <= {1} THEN {0} ELSE {1} END)"}}
    tier: stable
    evidence: tableau-calc

  - id: tableau.max
    match: {language: tableau-calc, function: MAX}
    emit: {template: "MAX({0})", by_arity: {"2": "(CASE WHEN {0} IS NULL OR {1} IS NULL THEN NULL WHEN {0} >= {1} THEN {0} ELSE {1} END)"}}
    tier: stable
    evidence: tableau-calc

  - id: tableau.countd
    match: {language: tableau-calc, function: COUNTD}
    emit: {template: "COUNT(DISTINCT {0})"}
    tier: stable
    evidence: tableau-calc

  - id: tableau.zn
    match: {language: tableau-calc, function: ZN}
    emit: {template: "COALESCE({0}, 0)"}
    tier: stable
    evidence: tableau-calc

  - id: tableau.ifnull
    match: {language: tableau-calc, function: IFNULL}
    emit: {template: "COALESCE({0}, {1})"}
    tier: stable
    evidence: tableau-calc

  - id: tableau.abs
    match: {language: tableau-calc, function: ABS}
    emit: {template: "ABS({0})"}
    tier: stable
    evidence: tableau-calc

  # A week starts on the data source's day, not the warehouse's: the engine compiles
  # `week` / `iso-week` (`engine.tableau_week_start`) as the day minus its distance from that
  # day (`days_back`: {d} the date, {n} the days, per dialect); the other parts are SQL's.
  - id: tableau.datetrunc
    match: {language: tableau-calc, function: DATETRUNC}
    emit:
      template: "DATE_TRUNC({0}, {1})"
      # `{0!word}` is the part as a keyword, where the dialect does not take it as text.
      dialect_templates:
        bigquery: "DATETIME_TRUNC(CAST({1} AS DATETIME), {0!word})"
        tsql: "DATETRUNC({0!word}, {1})"
      # SQLite has no DATE_TRUNC: a date is its ISO text, cut by its date functions.
      part_arg: 0
      part_templates:
        sqlite:
          year: "date({1}, 'start of year')"
          quarter: "date({1}, 'start of month', '-' || ((CAST(strftime('%m', {1}) AS INTEGER) - 1) % 3) || ' months')"
          month: "date({1}, 'start of month')"
          day: "date({1})"
          hour: "strftime('%Y-%m-%d %H:00:00', {1})"
          minute: "strftime('%Y-%m-%d %H:%M:00', {1})"
          second: "strftime('%Y-%m-%d %H:%M:%S', {1})"
      literal_values: {"0": [year, quarter, month, day, hour, minute, second]}
      days_back:
        snowflake: "DATEADD(day, -({n}), DATE_TRUNC('day', {d}))"
        duckdb: "(CAST(DATE_TRUNC('day', {d}) AS DATE) - CAST({n} AS INTEGER))"
        postgres: "(DATE_TRUNC('day', {d}) - ({n}) * INTERVAL '1 day')"
        redshift: "DATEADD(day, -({n}), DATE_TRUNC('day', {d}))"
        databricks: "DATE_SUB(DATE_TRUNC('DAY', {d}), {n})"
        bigquery: "DATE_SUB(DATE({d}), INTERVAL ({n}) DAY)"
        tsql: "DATEADD(day, -({n}), CAST({d} AS DATE))"
    tier: stable
    evidence: tableau-calc

  # ISO 8601 parts: weeks start on Monday and week 1 holds the year's first Thursday.
  - id: tableau.isoweek
    match: {language: tableau-calc, function: ISOWEEK}
    emit:
      template: "WEEKISO({0})"
      dialect_templates:
        duckdb: "WEEK({0})"
        postgres: "CAST(EXTRACT(WEEK FROM {0}) AS INTEGER)"
        redshift: "CAST(DATE_PART(week, {0}) AS INTEGER)"
        databricks: "WEEKOFYEAR({0})"
        bigquery: "EXTRACT(ISOWEEK FROM {0})"
        tsql: "DATEPART(iso_week, {0})"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.isoyear
    match: {language: tableau-calc, function: ISOYEAR}
    emit:
      template: "YEAROFWEEKISO({0})"
      # The ISO year is the year of the week's Thursday.
      dialect_templates:
        duckdb: "ISOYEAR({0})"
        postgres: "CAST(EXTRACT(ISOYEAR FROM {0}) AS INTEGER)"
        redshift: "CAST(EXTRACT(YEAR FROM DATEADD(day, 4 - (MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1), {0})) AS INTEGER)"
        databricks: "EXTRACT(YEAROFWEEK FROM {0})"
        bigquery: "EXTRACT(ISOYEAR FROM {0})"
        tsql: "YEAR(DATEADD(day, 26 - DATEPART(iso_week, {0}), {0}))"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.isoweekday
    match: {language: tableau-calc, function: ISOWEEKDAY}
    emit:
      template: "DAYOFWEEKISO({0})"
      dialect_templates:
        duckdb: "ISODOW({0})"
        postgres: "CAST(EXTRACT(ISODOW FROM {0}) AS INTEGER)"
        redshift: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        databricks: "(MOD(DAYOFWEEK({0}) + 5, 7) + 1)"
        bigquery: "(MOD(EXTRACT(DAYOFWEEK FROM {0}) + 5, 7) + 1)"
        # 1 January 1900 was a Monday; the day count does not read the session's DATEFIRST.
        tsql: "(((DATEDIFF(day, CAST('1900-01-01' AS DATE), {0}) % 7) + 7) % 7 + 1)"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc

  # ISNULL: true when the value is NULL (a condition filter's `not ISNULL([x])` included).
  - id: tableau.isnull
    match: {language: tableau-calc, function: ISNULL}
    emit: {template: "({0} IS NULL)"}
    tier: stable
    evidence: tableau-calc

  # Text tests (a condition or wildcard filter's CONTAINS / STARTSWITH / ENDSWITH). Tableau
  # sends them to the warehouse, so they compare as its collation does: case-sensitive on
  # Snowflake (checked live: "COMPLETE" does not match 'Complete'). NULL text is no match.
  - id: tableau.contains
    match: {language: tableau-calc, function: CONTAINS}
    emit:
      template: "(POSITION({1} IN {0}) > 0)"
      dialect_templates: {bigquery: "(STRPOS({0}, {1}) > 0)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.startswith
    match: {language: tableau-calc, function: STARTSWITH}
    emit:
      template: "(POSITION({1} IN {0}) = 1)"
      dialect_templates: {bigquery: "(STRPOS({0}, {1}) = 1)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.endswith
    match: {language: tableau-calc, function: ENDSWITH}
    emit: {template: "(RIGHT({0}, LENGTH({1})) = {1})"}
    tier: stable
    evidence: tableau-calc

  # DATEADD by whole months: the shift a fiscal year's start makes (a fiscal year is read
  # from the data source's Date Properties). Only the month part is listed; another part, or
  # a dialect without a row here, is refused by name.
  - id: tableau.dateadd
    match: {language: tableau-calc, function: DATEADD}
    emit:
      template: "DATEADD(month, {1}, {2})"
      literal_values: {"0": [month]}
      # The part is fixed to month by literal_values, so the template does not place it.
      extra_args_ok: true
      dialect_templates:
        duckdb: "({2} + CAST({1} AS INTEGER) * INTERVAL 1 MONTH)"
        postgres: "({2} + CAST({1} AS INTEGER) * INTERVAL '1 month')"
        redshift: "DATEADD(month, {1}, {2})"
        databricks: "ADD_MONTHS({2}, {1})"
        bigquery: "DATETIME_ADD(CAST({2} AS DATETIME), INTERVAL ({1}) MONTH)"
        tsql: "DATEADD(month, {1}, {2})"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc

  # A week of a FISCAL year: Tableau numbers it from the fiscal year's start, by a rule the
  # compiler is not told. The reader names a week pill on a data source with a fiscal year
  # start this way rather than compile the calendar week.
  - id: tableau.fiscal_week
    match: {language: tableau-calc, function: FISCAL_WEEK}
    emit: {untranslatable: "a week of a fiscal year (the data source's Date Properties start the year in another month), which Tableau numbers by a rule this compiler is not told"}
    tier: stable
    evidence: tableau-calc

  # DATEPART returns a number. Only the parts whose numbering SQL shares compile here. A
  # `weekday` counts from the data source's start of week and is compiled by the engine
  # (`engine.tableau_weekday`) when that start is stated; a `week` number also depends on how
  # the first week of the year is counted and is refused by name. DATE_PART takes the part as
  # a string in each listed dialect (checked live on Snowflake).
  - id: tableau.datepart
    match: {language: tableau-calc, function: DATEPART}
    emit:
      template: "DATE_PART({0}, {1})"
      dialect_templates:
        bigquery: "EXTRACT({0!word} FROM {1})"
        tsql: "DATEPART({0!word}, {1})"
      # Postgres and Databricks name the day of the year `doy`.
      part_arg: 0
      part_templates:
        postgres: {dayofyear: "CAST(DATE_PART('doy', {1}) AS INTEGER)"}
        databricks: {dayofyear: "DATE_PART('DOY', {1})"}
      literal_values: {"0": [year, quarter, month, dayofyear, day, hour, minute, second]}
      # The ISO day of week (Monday = 1 … Sunday = 7) in each dialect, for the engine's
      # weekday: Tableau's number is that day counted from the data source's start of week.
      weekday_iso:
        snowflake: "DAYOFWEEKISO({0})"
        duckdb: "ISODOW({0})"
        postgres: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        redshift: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        databricks: "(MOD(DAYOFWEEK({0}) + 5, 7) + 1)"
        bigquery: "(MOD(EXTRACT(DAYOFWEEK FROM {0}) + 5, 7) + 1)"
        tsql: "(((DATEDIFF(day, CAST('1900-01-01' AS DATE), {0}) % 7) + 7) % 7 + 1)"
    dialects: [snowflake, postgres, redshift, databricks, duckdb, bigquery, tsql]
    tier: stable
    evidence: tableau-calc

  # A FIXED level of detail computes at a grain of its own; the engine compiles it as a
  # statement at that grain joined back (`engine.tableau_lod`). This row names the construct
  # where that engine pass does not apply.
  - id: tableau.lod_fixed
    match: {language: tableau-calc, function: FIXED}
    emit: {untranslatable: "a FIXED LOD computes at a grain this statement does not have"}
    tier: stable
    evidence: tableau-calc

  # TABLE CALCULATIONS run over the view's aggregated rows. Each row compiles to a window over
  # the statement's grouped rows (`engine.table_calc`): `{over}` is the partition (the columns
  # the measure's compute-using restarts on) and the order (the columns it runs along,
  # ascending, an empty value first as the view lays them out: checked live); `{partition}`
  # the partition alone; `{frame}` a WINDOW_ function's start and end. Without the
  # compute-using (the reader states it per sheet) each refuses by name. Checked live against
  # the view's own data: running sum and average, window sum and average, TOTAL of SUM and of
  # AVG (the average of the underlying rows), INDEX, FIRST, LAST, SIZE, LOOKUP, RANK (largest
  # first), RANK_DENSE, RANK_PERCENTILE (smallest first, from 0).
  - id: tableau.running_sum
    match: {language: tableau-calc, function: RUNNING_SUM}
    emit: {template: "SUM({0}) OVER ({over} ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)", table_calc: running}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.running_avg
    match: {language: tableau-calc, function: RUNNING_AVG}
    emit: {template: "AVG({0}) OVER ({over} ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)", table_calc: running}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.running_min
    match: {language: tableau-calc, function: RUNNING_MIN}
    emit: {template: "MIN({0}) OVER ({over} ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)", table_calc: running}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.running_max
    match: {language: tableau-calc, function: RUNNING_MAX}
    emit: {template: "MAX({0}) OVER ({over} ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)", table_calc: running}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.running_count
    match: {language: tableau-calc, function: RUNNING_COUNT}
    emit: {template: "COUNT({0}) OVER ({over} ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)", table_calc: running}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.window_sum
    match: {language: tableau-calc, function: WINDOW_SUM}
    emit: {template: "SUM({0}) OVER ({over} {frame})", table_calc: window}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.window_avg
    match: {language: tableau-calc, function: WINDOW_AVG}
    emit: {template: "AVG({0}) OVER ({over} {frame})", table_calc: window}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.window_min
    match: {language: tableau-calc, function: WINDOW_MIN}
    emit: {template: "MIN({0}) OVER ({over} {frame})", table_calc: window}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.window_max
    match: {language: tableau-calc, function: WINDOW_MAX}
    emit: {template: "MAX({0}) OVER ({over} {frame})", table_calc: window}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.window_count
    match: {language: tableau-calc, function: WINDOW_COUNT}
    emit: {template: "COUNT({0}) OVER ({over} {frame})", table_calc: window}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  # TOTAL(agg(x)): the aggregate over the partition's underlying rows. A sum, count, minimum
  # or maximum of them is that of the view's values; an average is their sum over their count.
  - id: tableau.total
    match: {language: tableau-calc, function: TOTAL}
    emit:
      template: "{0}"
      table_calc: total
      combine:
        SUM: "SUM({agg}) OVER ({partition})"
        COUNT: "SUM({agg}) OVER ({partition})"
        MIN: "MIN({agg}) OVER ({partition})"
        MAX: "MAX({agg}) OVER ({partition})"
        AVG: "SUM(SUM({x})) OVER ({partition}) / NULLIF(SUM(COUNT({x})) OVER ({partition}), 0)"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.index
    match: {language: tableau-calc, function: INDEX}
    emit: {template: "ROW_NUMBER() OVER ({over})", ignore_args: true, table_calc: position}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.first
    match: {language: tableau-calc, function: FIRST}
    emit: {template: "(1 - ROW_NUMBER() OVER ({over}))", ignore_args: true, table_calc: position}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.last
    match: {language: tableau-calc, function: LAST}
    emit: {template: "(COUNT(*) OVER ({partition}) - ROW_NUMBER() OVER ({over}))", ignore_args: true, table_calc: position}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.size
    match: {language: tableau-calc, function: SIZE}
    emit: {template: "COUNT(*) OVER ({partition})", ignore_args: true, table_calc: position}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.lookup
    match: {language: tableau-calc, function: LOOKUP}
    emit: {template: "{0}", table_calc: lookup}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
    note: LOOKUP(x, -n) is the value n rows before along the compute-using (LAG), +n after (LEAD).
  - id: tableau.rank
    match: {language: tableau-calc, function: RANK}
    emit: {template: "RANK() OVER ({ranked})", ignore_args: true, table_calc: rank, direction: desc}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
    note: A NULL value is left out of the ranking and has no rank.
  - id: tableau.rank_dense
    match: {language: tableau-calc, function: RANK_DENSE}
    emit: {template: "DENSE_RANK() OVER ({ranked})", ignore_args: true, table_calc: rank, direction: desc}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.rank_modified
    match: {language: tableau-calc, function: RANK_MODIFIED}
    emit: {template: "COUNT(*) OVER ({ranked} RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)", ignore_args: true, table_calc: rank, direction: desc}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.rank_unique
    match: {language: tableau-calc, function: RANK_UNIQUE}
    emit: {template: "ROW_NUMBER() OVER ({ranked})", ignore_args: true, table_calc: rank, direction: desc, tie_break_by_view: true}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
    note: "Ties are numbered in the view's order along the compute-using (checked live: twelve tied rows, down two dimensions in either order)."
  - id: tableau.rank_percentile
    match: {language: tableau-calc, function: RANK_PERCENTILE}
    emit: {template: "PERCENT_RANK() OVER ({ranked})", ignore_args: true, table_calc: rank, direction: asc}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  # The user functions: what they return depends on who views the workbook. With the run's
  # viewer (`bi_facts.viewer`, the identity the input was fetched as) a domain or group test
  # is replaced by its value before compiling. The viewer's user name and full name are NEVER
  # written into a statement or an artifact (guardrail 8): the statement reads them as a bind
  # placeholder (`viewer_bind`, spelled per dialect by the `op.viewer_bind` row), so it is the
  # statement for whoever runs it, and only verification binds the fetching identity's name,
  # in memory. Checked live (Tableau Cloud): USERNAME() is the user's site name, FULLNAME()
  # its display name; ISUSERNAME and ISFULLNAME take a string literal only (Tableau refuses
  # a column or an expression there), compare exactly (case and trailing spaces count) and
  # are FALSE, never NULL, for a NULL argument.
  - id: op.viewer_bind
    match: {operator: viewer_bind}
    emit:
      template: ":viewer_{0}"
      dialect_templates:
        duckdb: "$viewer_{0}"
        bigquery: "@viewer_{0}"
        tsql: "@viewer_{0}"
    dialects: [snowflake, databricks, postgres, redshift, duckdb, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  # A literal A1's scrub withheld (a person's address or name the BI file compares with,
  # guardrail 8): the statement reads it as this placeholder, `{0}` its number, and only
  # verification binds it, in memory, to the value the BI file holds (lib/withheld).
  - id: op.withheld_bind
    match: {operator: withheld_bind}
    emit:
      template: ":withheld_{0}"
      dialect_templates:
        duckdb: "$withheld_{0}"
        bigquery: "@withheld_{0}"
        tsql: "@withheld_{0}"
    dialects: [snowflake, databricks, postgres, redshift, duckdb, bigquery, tsql]
    tier: stable
    evidence: schema
  - id: tableau.username
    match: {language: tableau-calc, function: USERNAME}
    emit: {template: "{viewer}", ignore_args: true, viewer_bind: user_name}
    tier: stable
    evidence: tableau-calc
  - id: tableau.fullname
    match: {language: tableau-calc, function: FULLNAME}
    emit: {template: "{viewer}", ignore_args: true, viewer_bind: full_name}
    tier: stable
    evidence: tableau-calc
  - id: tableau.isusername
    match: {language: tableau-calc, function: ISUSERNAME}
    emit: {template: "COALESCE({viewer} = {0}, FALSE)", viewer_bind: user_name, literal_args: {"0": ""}}
    tier: stable
    evidence: tableau-calc
  - id: tableau.isfullname
    match: {language: tableau-calc, function: ISFULLNAME}
    emit: {template: "COALESCE({viewer} = {0}, FALSE)", viewer_bind: full_name, literal_args: {"0": ""}}
    tier: stable
    evidence: tableau-calc
  - id: tableau.userdomain
    match: {language: tableau-calc, function: USERDOMAIN}
    emit: {untranslatable: "USERDOMAIN() is the domain of whoever views the workbook, and the run names no viewer (a viewer.json beside the workbook: the fetch writes it with `viewer: true`)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.ismemberof
    match: {language: tableau-calc, function: ISMEMBEROF}
    emit: {untranslatable: "ISMEMBEROF() tests the groups of whoever views the workbook, and the run names no viewer or could not read its groups (a viewer.json beside the workbook: the fetch writes it with `viewer: true`)"}
    tier: stable
    evidence: tableau-calc
