  # TOPN as a CALCULATE's one filter over ALL / ALLSELECTED of columns
  # (`_window_statement`): the members ranked by the expression (a blank as 0, ties kept,
  # seen live), the first n, and the additive expression summed over them.
  - id: dax.topn
    match: {language: dax, function: TOPN}
    emit:
      untranslatable: >-
        a table of the top rows by an expression; compiled only as the one filter of a
        CALCULATE over ALL / ALLSELECTED of columns
      window_template:
        rank: "RANK() OVER ({over})"
        value: "SUM(CASE WHEN {rank} <= {n} THEN {0} END) OVER ({over})"
    tier: stable
    evidence: dax

  # A calculated table's ROW SERIES (readers/daxtables): CALENDAR's dates and
  # GENERATESERIES' numbers as the statement returning them. `{0}` is the first value, `{n}`
  # the number of rows, `{step}` the step, `{name}` the column. Only a dialect with a row here
  # has a series, another is refused by name; inside a measure each is a table, named as one.
  - id: dax.calendar
    match: {language: dax, function: CALENDAR}
    emit:
      untranslatable: "a table of dates; compiled only as a calculated table's rows"
      dialect_templates:
        snowflake: |-
          SELECT DATEADD(day, ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1, {0}) AS {name}
          FROM   TABLE(GENERATOR(ROWCOUNT => {n}))
        duckdb: |-
          SELECT CAST({0} + CAST(i AS INTEGER) AS DATE) AS {name}
          FROM   range({n}) r(i)
        postgres: |-
          SELECT CAST({0} + i AS DATE) AS {name}
          FROM   generate_series(0, {n} - 1) g(i)
        databricks: |-
          SELECT DATE_ADD({0}, CAST(i AS INT)) AS {name}
          FROM   (SELECT EXPLODE(SEQUENCE(0, {n} - 1)) AS i)
        bigquery: |-
          SELECT DATE_ADD({0}, INTERVAL i DAY) AS {name}
          FROM   UNNEST(GENERATE_ARRAY(0, {n} - 1)) AS i
        tsql: |-
          SELECT CAST(DATEADD(day, value, {0}) AS DATE) AS {name}
          FROM   GENERATE_SERIES(0, {n} - 1)
        # No set-returning series on the compute nodes: six sets of ten digits, cut to n.
        redshift: |-
          SELECT CAST(DATEADD(day, g.i, {0}) AS DATE) AS {name}
          FROM   (
              SELECT d0.d + 10 * d1.d + 100 * d2.d + 1000 * d3.d + 10000 * d4.d
                     + 100000 * d5.d AS i
              FROM   (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d0
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d1
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d2
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d3
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d4
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d5
          ) g
          WHERE  g.i < {n}
      max_rows: {redshift: 1000000}
      # Bounds read from the warehouse (CALENDAR(MIN(T[d]), MAX(T[d])), CALENDARAUTO): {bounds}
      # is a one-row statement of `lo` and `hi`, and the series is every day between them. A
      # series of a constant length (Snowflake's GENERATOR, Redshift's digits) is a million
      # days (2,700 years) filtered to the bounds.
      range_templates:
        snowflake: |-
          SELECT DATEADD(day, g.i, b.lo) AS {name}
          FROM   (
          {bounds}
          ) b
          JOIN   (
              SELECT ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1 AS i
              FROM   TABLE(GENERATOR(ROWCOUNT => 1000000))
          ) g ON g.i <= DATEDIFF(day, b.lo, b.hi)
        duckdb: |-
          SELECT CAST(g.d AS DATE) AS {name}
          FROM   (
              SELECT unnest(generate_series(CAST(b.lo AS TIMESTAMP), CAST(b.hi AS TIMESTAMP), INTERVAL 1 DAY)) AS d
              FROM   (
          {bounds}
              ) b
          ) g
        postgres: |-
          SELECT CAST(g.d AS DATE) AS {name}
          FROM   (
          {bounds}
          ) b
          CROSS JOIN LATERAL generate_series(CAST(b.lo AS TIMESTAMP), CAST(b.hi AS TIMESTAMP), INTERVAL '1 day') AS g(d)
        databricks: |-
          SELECT g.d AS {name}
          FROM   (
          {bounds}
          ) b
          LATERAL VIEW EXPLODE(SEQUENCE(b.lo, b.hi, INTERVAL 1 DAY)) g AS d
        bigquery: |-
          SELECT d AS {name}
          FROM   (
          {bounds}
          ) b
          CROSS JOIN UNNEST(GENERATE_DATE_ARRAY(b.lo, b.hi)) AS d
        tsql: |-
          SELECT CAST(DATEADD(day, g.value, b.lo) AS DATE) AS {name}
          FROM   (
          {bounds}
          ) b
          CROSS APPLY GENERATE_SERIES(0, DATEDIFF(day, b.lo, b.hi)) g
        redshift: |-
          SELECT CAST(DATEADD(day, g.i, b.lo) AS DATE) AS {name}
          FROM   (
          {bounds}
          ) b
          JOIN   (
              SELECT d0.d + 10 * d1.d + 100 * d2.d + 1000 * d3.d + 10000 * d4.d
                     + 100000 * d5.d AS i
              FROM   (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d0
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d1
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d2
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d3
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d4
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d5
          ) g ON g.i <= DATEDIFF(day, b.lo, b.hi)
    tier: stable
    evidence: dax
    note: every date from the first to the last, one row each (a calculated date table)

  - id: dax.generateseries
    match: {language: dax, function: GENERATESERIES}
    emit:
      untranslatable: "a table of numbers; compiled only as a calculated table's rows"
      dialect_templates:
        snowflake: |-
          SELECT {0} + (ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1) * {step} AS {name}
          FROM   TABLE(GENERATOR(ROWCOUNT => {n}))
        duckdb: |-
          SELECT {0} + i * {step} AS {name}
          FROM   range({n}) r(i)
        postgres: |-
          SELECT {0} + i * {step} AS {name}
          FROM   generate_series(0, {n} - 1) g(i)
        databricks: |-
          SELECT {0} + i * {step} AS {name}
          FROM   (SELECT EXPLODE(SEQUENCE(0, {n} - 1)) AS i)
        bigquery: |-
          SELECT {0} + i * {step} AS {name}
          FROM   UNNEST(GENERATE_ARRAY(0, {n} - 1)) AS i
        tsql: |-
          SELECT {0} + value * {step} AS {name}
          FROM   GENERATE_SERIES(0, {n} - 1)
        redshift: |-
          SELECT {0} + g.i * {step} AS {name}
          FROM   (
              SELECT d0.d + 10 * d1.d + 100 * d2.d + 1000 * d3.d + 10000 * d4.d
                     + 100000 * d5.d AS i
              FROM   (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d0
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d1
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d2
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d3
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d4
              CROSS JOIN (SELECT 0 AS d UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) d5
          ) g
          WHERE  g.i < {n}
      max_rows: {redshift: 1000000}
    tier: stable
    evidence: dax
    note: a what-if parameter's numbers, from the first to the last by the step

  # VISUAL CALCULATIONS (a visual's own formulas over its matrix: readers/visualcalc.py).
  # Each runs over the cells of the matrix along an axis; `{over}` is the window the engine
  # writes (the cell's level, the other axes' columns and the reset as PARTITION BY; the
  # axis' columns, or the ORDERBY, as ORDER BY), `{frame}` a moving average's or a range's
  # rows, `{n}` PREVIOUS / NEXT's steps. The navigation functions read another cell (a join
  # the engine writes): `{0}` is that cell's value. Each was checked live against
  # executeQueries' own visual-calculation engine (WITH VISUAL SHAPE). Valid only in a
  # visual calculation; a model measure naming one is refused by name.
  - id: dax.vc_runningsum
    match: {language: dax, function: RUNNINGSUM}
    emit:
      template: "SUM({0}) OVER ({over} ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)"
      visual_calc: window
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: dax
