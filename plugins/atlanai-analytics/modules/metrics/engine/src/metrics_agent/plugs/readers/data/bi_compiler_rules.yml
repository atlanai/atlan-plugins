  # A zero divisor gives NULL in the calc language (checked live: SUM(x) / SUM(0) is empty),
  # where SQL raises. Applied to `/` unless the divisor is a non-zero number literal.
  - id: tableau.divide_operator
    match: {language: tableau-calc, function: "/"}
    emit:
      template: "({0} / NULLIF({1}, 0))"
      # SQLite divides two integers as integers (5 / 6 is 0); the calc divides as decimals.
      dialect_templates: {sqlite: "(CAST({0} AS REAL) / NULLIF({1}, 0))"}
    tier: stable
    evidence: tableau-calc

