  # DAX's DATEDIFF(start, end, interval): the interval boundaries crossed from start to end, as
  # the warehouse's DATEDIFF counts them (end before start is negative). Its interval is a bare
  # keyword; WEEK counts from a start of week the model does not state, and is refused.
  - id: dax.datediff
    match: {language: dax, function: DATEDIFF}
    emit:
      template: "DATEDIFF({2}, {0}, {1})"
      keyword_values: {"2": [year, quarter, month, day, hour, minute, second]}
      dialect_templates:
        bigquery: "DATETIME_DIFF(CAST({1} AS DATETIME), CAST({0} AS DATETIME), {2})"
      # Postgres has no DATEDIFF: the boundaries crossed, written per part.
      part_arg: 2
      part_templates:
        postgres:
          year: "CAST((EXTRACT(YEAR FROM {1}) - EXTRACT(YEAR FROM {0})) AS INTEGER)"
          quarter: "CAST((EXTRACT(YEAR FROM {1}) - EXTRACT(YEAR FROM {0})) * 4 + EXTRACT(QUARTER FROM {1}) - EXTRACT(QUARTER FROM {0}) AS INTEGER)"
          month: "CAST((EXTRACT(YEAR FROM {1}) - EXTRACT(YEAR FROM {0})) * 12 + EXTRACT(MONTH FROM {1}) - EXTRACT(MONTH FROM {0}) AS INTEGER)"
          day: "(CAST({1} AS DATE) - CAST({0} AS DATE))"
          hour: "CAST(EXTRACT(EPOCH FROM (DATE_TRUNC('hour', CAST({1} AS TIMESTAMP)) - DATE_TRUNC('hour', CAST({0} AS TIMESTAMP)))) / 3600 AS INTEGER)"
          minute: "CAST(EXTRACT(EPOCH FROM (DATE_TRUNC('minute', CAST({1} AS TIMESTAMP)) - DATE_TRUNC('minute', CAST({0} AS TIMESTAMP)))) / 60 AS INTEGER)"
          second: "CAST(EXTRACT(EPOCH FROM (DATE_TRUNC('second', CAST({1} AS TIMESTAMP)) - DATE_TRUNC('second', CAST({0} AS TIMESTAMP)))) / 1 AS INTEGER)"
    dialects: [snowflake, duckdb, redshift, databricks, postgres, bigquery, tsql]
    tier: stable
    evidence: dax
    note: A blank date argument is NULL here (DAX reads it as day zero); the pattern this was written for filters blanks out first.
  - id: tableau.datediff
    match: {language: tableau-calc, function: DATEDIFF}
    emit:
      template: "DATEDIFF({0}, {1}, {2})"
      literal_values: {"0": [year, quarter, month, day, hour, minute, second]}
      dialect_templates:
        bigquery: "DATETIME_DIFF(CAST({2} AS DATETIME), CAST({1} AS DATETIME), {0!word})"
        tsql: "DATEDIFF({0!word}, {1}, {2})"
      part_arg: 0
      part_templates:
        postgres:
          year: "CAST((EXTRACT(YEAR FROM {2}) - EXTRACT(YEAR FROM {1})) AS INTEGER)"
          quarter: "CAST((EXTRACT(YEAR FROM {2}) - EXTRACT(YEAR FROM {1})) * 4 + EXTRACT(QUARTER FROM {2}) - EXTRACT(QUARTER FROM {1}) AS INTEGER)"
          month: "CAST((EXTRACT(YEAR FROM {2}) - EXTRACT(YEAR FROM {1})) * 12 + EXTRACT(MONTH FROM {2}) - EXTRACT(MONTH FROM {1}) AS INTEGER)"
          day: "(CAST({2} AS DATE) - CAST({1} AS DATE))"
          hour: "CAST(EXTRACT(EPOCH FROM (DATE_TRUNC('hour', CAST({2} AS TIMESTAMP)) - DATE_TRUNC('hour', CAST({1} AS TIMESTAMP)))) / 3600 AS INTEGER)"
          minute: "CAST(EXTRACT(EPOCH FROM (DATE_TRUNC('minute', CAST({2} AS TIMESTAMP)) - DATE_TRUNC('minute', CAST({1} AS TIMESTAMP)))) / 60 AS INTEGER)"
          second: "CAST(EXTRACT(EPOCH FROM (DATE_TRUNC('second', CAST({2} AS TIMESTAMP)) - DATE_TRUNC('second', CAST({1} AS TIMESTAMP)))) / 1 AS INTEGER)"
    dialects: [snowflake, duckdb, redshift, databricks, postgres, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
    note: Counts the part boundaries crossed, as the calc language does; a week counts from the data source's start of week and is refused.
  # TODAY() and NOW() are the WAREHOUSE's: Tableau sends them to the connection, so they are
  # the session's date and local time (checked live: with the session's time zone set to
  # another zone by Initial SQL, NOW() and TODAY() moved with it). A dialect whose
  # CURRENT_TIMESTAMP carries a zone is read as the session's local time.
  - id: tableau.today
    match: {language: tableau-calc, function: TODAY}
    emit:
      template: "CURRENT_DATE"
      ignore_args: true
      dialect_templates:
        tsql: "CAST(GETDATE() AS DATE)"
    tier: stable
    evidence: tableau-calc
  - id: tableau.now
    match: {language: tableau-calc, function: NOW}
    emit:
      template: "LOCALTIMESTAMP"
      ignore_args: true
      dialect_templates:
        snowflake: "CAST(CURRENT_TIMESTAMP() AS TIMESTAMP_NTZ)"
        duckdb: "CAST(CURRENT_TIMESTAMP AS TIMESTAMP)"
        redshift: "GETDATE()"
        databricks: "CAST(current_timestamp() AS TIMESTAMP)"
        bigquery: "CURRENT_DATETIME()"
        tsql: "CAST(SYSDATETIME() AS DATETIME2)"
    tier: stable
    evidence: tableau-calc

  # STR: the warehouse's own text of the value (checked live: STR of a NUMBER(5,4) is
  # '0.0500', as Snowflake writes it). A date is 'YYYY-MM-DD' and a date and time
  # 'YYYY-MM-DD HH:MM:SS' (checked live: STR(DATETRUNC('year', d)) is '2023-01-01 00:00:00',
  # DATETRUNC giving a date and time); the engine picks the form by the argument's type
  # (`engine.tableau_str`).
  - id: tableau.str
    match: {language: tableau-calc, function: STR}
    emit:
      template: "CAST({0} AS VARCHAR)"
      dialect_templates:
        databricks: "CAST({0} AS STRING)"
        bigquery: "CAST({0} AS STRING)"
        tsql: "CAST({0} AS NVARCHAR(4000))"
      date_template:
        snowflake: "TO_VARCHAR({0}, 'YYYY-MM-DD')"
        duckdb: "STRFTIME({0}, '%Y-%m-%d')"
        postgres: "TO_CHAR({0}, 'YYYY-MM-DD')"
        redshift: "TO_CHAR({0}, 'YYYY-MM-DD')"
        databricks: "DATE_FORMAT({0}, 'yyyy-MM-dd')"
        bigquery: "FORMAT_DATE('%Y-%m-%d', {0})"
        tsql: "CONVERT(VARCHAR(10), {0}, 23)"
      datetime_template:
        snowflake: "TO_VARCHAR({0}, 'YYYY-MM-DD HH24:MI:SS')"
        duckdb: "STRFTIME({0}, '%Y-%m-%d %H:%M:%S')"
        postgres: "TO_CHAR({0}, 'YYYY-MM-DD HH24:MI:SS')"
        redshift: "TO_CHAR({0}, 'YYYY-MM-DD HH24:MI:SS')"
        databricks: "DATE_FORMAT({0}, 'yyyy-MM-dd HH:mm:ss')"
        bigquery: "FORMAT_DATETIME('%Y-%m-%d %H:%M:%S', CAST({0} AS DATETIME))"
        tsql: "CONVERT(VARCHAR(19), {0}, 120)"
    tier: stable
    evidence: tableau-calc

  # DATENAME(part, d): the part as text, as Tableau shows it (checked live on Snowflake: the
  # month in full, the weekday abbreviated, the day with two digits, the quarter and the year
  # as their numbers). A week's name depends on the data source's start of week and is the
  # engine's week number (`engine.tableau_week`).
  - id: tableau.datename
    match: {language: tableau-calc, function: DATENAME}
    emit:
      template: "{0}"
      parts:
        snowflake:
          year: "TO_VARCHAR({d}, 'YYYY')"
          quarter: "TO_VARCHAR(QUARTER({d}))"
          month: "TO_VARCHAR({d}, 'MMMM')"
          day: "TO_VARCHAR({d}, 'DD')"
          weekday: "DAYNAME({d})"
          dayofyear: "TO_VARCHAR(DAYOFYEAR({d}))"
        duckdb:
          year: "STRFTIME({d}, '%Y')"
          quarter: "CAST(QUARTER({d}) AS VARCHAR)"
          month: "STRFTIME({d}, '%B')"
          day: "STRFTIME({d}, '%d')"
          weekday: "STRFTIME({d}, '%a')"
          dayofyear: "CAST(DAYOFYEAR({d}) AS VARCHAR)"
        # FM drops the padding Postgres gives a month's name.
        postgres:
          year: "TO_CHAR({d}, 'YYYY')"
          quarter: "TO_CHAR({d}, 'Q')"
          month: "TO_CHAR({d}, 'FMMonth')"
          day: "TO_CHAR({d}, 'DD')"
          weekday: "TO_CHAR({d}, 'Dy')"
          dayofyear: "TO_CHAR({d}, 'FMDDD')"
        redshift:
          year: "TO_CHAR({d}, 'YYYY')"
          quarter: "TO_CHAR({d}, 'Q')"
          month: "TRIM(TO_CHAR({d}, 'Month'))"
          day: "TO_CHAR({d}, 'DD')"
          weekday: "TO_CHAR({d}, 'Dy')"
          dayofyear: "CAST(CAST(DATE_PART(doy, {d}) AS INTEGER) AS VARCHAR)"
        databricks:
          year: "DATE_FORMAT({d}, 'yyyy')"
          quarter: "CAST(QUARTER({d}) AS STRING)"
          month: "DATE_FORMAT({d}, 'MMMM')"
          day: "DATE_FORMAT({d}, 'dd')"
          weekday: "DATE_FORMAT({d}, 'E')"
          dayofyear: "CAST(DAYOFYEAR({d}) AS STRING)"
        bigquery:
          year: "FORMAT_DATETIME('%Y', CAST({d} AS DATETIME))"
          quarter: "CAST(EXTRACT(QUARTER FROM {d}) AS STRING)"
          month: "FORMAT_DATETIME('%B', CAST({d} AS DATETIME))"
          day: "FORMAT_DATETIME('%d', CAST({d} AS DATETIME))"
          weekday: "FORMAT_DATETIME('%a', CAST({d} AS DATETIME))"
          dayofyear: "CAST(EXTRACT(DAYOFYEAR FROM {d}) AS STRING)"
        # The names in the session's language (us_english by default).
        tsql:
          year: "DATENAME(year, {d})"
          quarter: "DATENAME(quarter, {d})"
          month: "DATENAME(month, {d})"
          day: "RIGHT('0' + DATENAME(day, {d}), 2)"
          weekday: "LEFT(DATENAME(weekday, {d}), 3)"
          dayofyear: "DATENAME(dayofyear, {d})"
      # A week's name is its number as text.
      as_text:
        databricks: "CAST({0} AS STRING)"
        bigquery: "CAST({0} AS STRING)"
        tsql: "CAST({0} AS VARCHAR(12))"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc

  # The date's parts as numbers. QUARTER, WEEK, MAKEDATE, MAKETIME and MAKEDATETIME are not
  # functions of a live Snowflake connection in Tableau (its own answer: "Unknown function"),
  # so they come from extracts and other sources; they compile from Tableau's documented
  # meaning. WEEK counts from the data source's start of week (`engine.tableau_week`).
  - id: tableau.year
    match: {language: tableau-calc, function: YEAR}
    emit: {template: "YEAR({0})"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.quarter
    match: {language: tableau-calc, function: QUARTER}
    emit: {template: "QUARTER({0})"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.month
    match: {language: tableau-calc, function: MONTH}
    emit: {template: "MONTH({0})"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.day
    match: {language: tableau-calc, function: DAY}
    emit: {template: "DAY({0})"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.week
    match: {language: tableau-calc, function: WEEK}
    emit:
      template: "{0}"
      day_of_year:
        snowflake: "DAYOFYEAR({0})"
        duckdb: "DAYOFYEAR({0})"
        postgres: "CAST(EXTRACT(DOY FROM {0}) AS INTEGER)"
        redshift: "CAST(DATE_PART(doy, {0}) AS INTEGER)"
        databricks: "DAYOFYEAR({0})"
        bigquery: "EXTRACT(DAYOFYEAR FROM {0})"
        tsql: "DATEPART(dayofyear, {0})"
      year_start:
        snowflake: "DATE_TRUNC('year', {0})"
        duckdb: "DATE_TRUNC('year', {0})"
        postgres: "DATE_TRUNC('year', {0})"
        redshift: "DATE_TRUNC('year', {0})"
        databricks: "DATE_TRUNC('YEAR', {0})"
        bigquery: "DATE_TRUNC(DATE({0}), YEAR)"
        tsql: "DATEFROMPARTS(YEAR({0}), 1, 1)"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.makedate
    match: {language: tableau-calc, function: MAKEDATE}
    emit:
      template: "DATE_FROM_PARTS({0}, {1}, {2})"
      dialect_templates:
        duckdb: "MAKE_DATE(CAST({0} AS BIGINT), CAST({1} AS BIGINT), CAST({2} AS BIGINT))"
        postgres: "MAKE_DATE({0}, {1}, {2})"
        redshift: "TO_DATE(LPAD(CAST({0} AS VARCHAR), 4, '0') || LPAD(CAST({1} AS VARCHAR), 2, '0') || LPAD(CAST({2} AS VARCHAR), 2, '0'), 'YYYYMMDD')"
        databricks: "MAKE_DATE({0}, {1}, {2})"
        bigquery: "DATE({0}, {1}, {2})"
        tsql: "DATEFROMPARTS({0}, {1}, {2})"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.maketime
    match: {language: tableau-calc, function: MAKETIME}
    emit:
      template: "TIME_FROM_PARTS({0}, {1}, {2})"
      dialect_templates:
        duckdb: "MAKE_TIME(CAST({0} AS BIGINT), CAST({1} AS BIGINT), CAST({2} AS DOUBLE))"
        postgres: "MAKE_TIME({0}, {1}, {2})"
        redshift: "CAST(LPAD(CAST({0} AS VARCHAR), 2, '0') || ':' || LPAD(CAST({1} AS VARCHAR), 2, '0') || ':' || CAST({2} AS VARCHAR) AS TIME)"
        # No time type: the time on Tableau's own day zero, 30 December 1899.
        databricks: "MAKE_TIMESTAMP(1899, 12, 30, {0}, {1}, {2})"
        bigquery: "TIME({0}, {1}, {2})"
        tsql: "TIMEFROMPARTS({0}, {1}, {2}, 0, 0)"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.makedatetime
    match: {language: tableau-calc, function: MAKEDATETIME}
    emit:
      template: "TIMESTAMP_NTZ_FROM_PARTS(CAST({0} AS DATE), CAST({1} AS TIME))"
      dialect_templates:
        duckdb: "(CAST({0} AS DATE) + CAST({1} AS TIME))"
        postgres: "(CAST({0} AS DATE) + CAST({1} AS TIME))"
        redshift: "(CAST({0} AS DATE) + CAST({1} AS TIME))"
        databricks: "MAKE_TIMESTAMP(YEAR({0}), MONTH({0}), DAY({0}), HOUR({1}), MINUTE({1}), SECOND({1}))"
        bigquery: "DATETIME(CAST({0} AS DATE), CAST({1} AS TIME))"
        tsql: "(CAST(CAST({0} AS DATE) AS DATETIME) + CAST(CAST({1} AS TIME) AS DATETIME))"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.date
    match: {language: tableau-calc, function: DATE}
    emit: {template: "CAST({0} AS DATE)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.datetime
    match: {language: tableau-calc, function: DATETIME}
    emit: {template: "CAST({0} AS TIMESTAMP)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.isdate
    match: {language: tableau-calc, function: ISDATE}
    emit:
      template: "(CASE WHEN {0} IS NULL THEN NULL ELSE TRY_TO_DATE({0}) IS NOT NULL END)"
      dialect_templates:
        duckdb: "(CASE WHEN {0} IS NULL THEN NULL ELSE TRY_CAST({0} AS DATE) IS NOT NULL END)"
        databricks: "(CASE WHEN {0} IS NULL THEN NULL ELSE TRY_CAST({0} AS DATE) IS NOT NULL END)"
        bigquery: "(CASE WHEN {0} IS NULL THEN NULL ELSE SAFE_CAST({0} AS DATE) IS NOT NULL END)"
        # pg_input_is_valid: PostgreSQL 16 and later.
        postgres: "(CASE WHEN {0} IS NULL THEN NULL ELSE pg_input_is_valid({0}, 'date') END)"
    dialects: [snowflake, duckdb, databricks, bigquery, postgres]
    no_form:
      redshift: no cast of text to a date that gives NULL rather than an error
      tsql: >-
        the test is a value that is TRUE, FALSE or NULL, and T-SQL has no boolean value
        (ISDATE is a number, and a CASE cannot return a test)
    tier: stable
    evidence: tableau-calc
  # DATEPARSE(format, text): the format is Tableau's (ICU) pattern, a literal; the engine
  # rewrites it token by token into the dialect's (`formats`), and a token not listed is
  # refused by name. Text that does not parse is NULL, as in Tableau.
  - id: tableau.dateparse
    match: {language: tableau-calc, function: DATEPARSE}
    emit:
      template: "TRY_TO_TIMESTAMP_NTZ({1}, {0})"
      dialect_templates:
        duckdb: "TRY_STRPTIME({1}, {0})"
        databricks: "TRY_TO_TIMESTAMP({1}, {0})"
        bigquery: "SAFE.PARSE_DATETIME({0}, {1})"
        tsql: "TRY_CONVERT(DATETIME2, {1}, {0})"
      # T-SQL parses by a fixed list of styles, not a pattern: the whole pattern -> its style.
      whole_formats:
        tsql: {"yyyy-MM-dd": 23, "yyyy-MM-dd HH:mm:ss": 120, "yyyy-MM-dd HH:mm:ss.SSS": 121,
               "MM/dd/yyyy": 101, "dd/MM/yyyy": 103, "dd.MM.yyyy": 104, "dd-MM-yyyy": 105,
               "MM-dd-yyyy": 110, "yyyy/MM/dd": 111, "yyyyMMdd": 112}
      formats:
        snowflake: {yyyy: YYYY, yy: YY, MMMM: MMMM, MMM: MON, MM: MM, dd: DD, HH: HH24, hh: HH12, mm: MI, ss: SS, a: AM, SSS: FF3}
        duckdb: {yyyy: "%Y", yy: "%y", MMMM: "%B", MMM: "%b", MM: "%m", dd: "%d", HH: "%H", hh: "%I", mm: "%M", ss: "%S", a: "%p", SSS: "%g"}
        # Databricks reads the same pattern letters as Tableau.
        databricks: {yyyy: yyyy, yy: yy, MMMM: MMMM, MMM: MMM, MM: MM, dd: dd, HH: HH, hh: hh, mm: mm, ss: ss, a: a, SSS: SSS}
        # Fractional seconds are part of the seconds' token (%E3S).
        bigquery: {yyyy: "%Y", yy: "%y", MMMM: "%B", MMM: "%b", MM: "%m", dd: "%d", HH: "%H", hh: "%I", mm: "%M", "ss.SSS": "%E3S", ss: "%S", a: "%p"}
    dialects: [snowflake, duckdb, databricks, bigquery, tsql]
    no_form:
      postgres: >-
        no parse of text by a format that gives NULL where the text does not parse
        (TO_TIMESTAMP raises an error there)
      redshift: >-
        no parse of text by a format that gives NULL where the text does not parse
        (TO_TIMESTAMP raises an error there)
    tier: stable
    evidence: tableau-calc

  # Text: SPLIT is the n-th part (from the end when negative; '' past the last part, checked
  # live); a dialect that reads a backslash in a string literal as an escape gets a pattern's
  # backslashes doubled (`literal_backslash_escapes`); MID is the text from a position, of a length or to its end; the REGEXP_ functions
  # search anywhere in the text (checked live: REGEXP_MATCH is a partial match; REGEXP_EXTRACT
  # the first group of the first match; REGEXP_REPLACE every match).
  - id: tableau.split
    match: {language: tableau-calc, function: SPLIT}
    emit:
      template: "SPLIT_PART({0}, {1}, {2})"
      dialect_templates:
        bigquery: >-
          (CASE WHEN {0} IS NULL THEN NULL WHEN {2} < 0
          THEN COALESCE(ARRAY_REVERSE(SPLIT({0}, {1}))[SAFE_OFFSET(-({2}) - 1)], '')
          ELSE COALESCE(SPLIT({0}, {1})[SAFE_OFFSET({2} - 1)], '') END)
        # STRING_SPLIT numbers its parts (SQL Server 2022); it takes a one-character
        # delimiter and raises on a longer one.
        tsql: >-
          (CASE WHEN {0} IS NULL THEN NULL ELSE COALESCE((SELECT p.value FROM STRING_SPLIT({0}, {1}, 1) p
          WHERE p.ordinal = CASE WHEN {2} < 0 THEN (SELECT COUNT(*) FROM STRING_SPLIT({0}, {1}, 1)) + {2} + 1
          ELSE {2} END), '') END)
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.mid
    match: {language: tableau-calc, function: MID}
    emit: {template: "SUBSTR({0}, {1}, {2})", by_arity: {"2": "SUBSTR({0}, {1})"}}
    tier: stable
    evidence: tableau-calc
  - id: tableau.regexp_match
    match: {language: tableau-calc, function: REGEXP_MATCH}
    emit:
      template: "(REGEXP_INSTR({0}, {1}) > 0)"
      dialect_templates:
        duckdb: "REGEXP_MATCHES({0}, {1})"
        postgres: "({0} ~ {1})"
        redshift: "({0} ~ {1})"
        databricks: "({0} RLIKE {1})"
        bigquery: "REGEXP_CONTAINS({0}, {1})"
        # SQL Server 2025 and Azure SQL; an earlier SQL Server has no regular expressions.
        tsql: "REGEXP_LIKE({0}, {1})"
      literal_backslash_escapes: [snowflake, databricks, bigquery, redshift]
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.regexp_extract
    match: {language: tableau-calc, function: REGEXP_EXTRACT}
    emit:
      template: "REGEXP_SUBSTR({0}, {1}, 1, 1, 'e', 1)"
      dialect_templates:
        duckdb: "(CASE WHEN REGEXP_MATCHES({0}, {1}) THEN REGEXP_EXTRACT({0}, {1}, 1) END)"
        # With a group in the pattern, SUBSTRING ... FROM is the first group's text.
        postgres: "SUBSTRING({0} FROM {1})"
        # REGEXP_SUBSTR gives '' where nothing matches; the calc language gives NULL.
        redshift: "(CASE WHEN REGEXP_INSTR({0}, {1}) > 0 THEN REGEXP_SUBSTR({0}, {1}, 1, 1, 'e') END)"
        databricks: "(CASE WHEN {0} RLIKE {1} THEN REGEXP_EXTRACT({0}, {1}, 1) END)"
        bigquery: "REGEXP_EXTRACT({0}, {1})"
        tsql: "REGEXP_SUBSTR({0}, {1}, 1, 1, '', 1)"
      literal_backslash_escapes: [snowflake, databricks, bigquery, redshift]
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.regexp_extract_nth
    match: {language: tableau-calc, function: REGEXP_EXTRACT_NTH}
    emit:
      template: "REGEXP_SUBSTR({0}, {1}, 1, 1, 'e', {2})"
      dialect_templates:
        duckdb: "(CASE WHEN REGEXP_MATCHES({0}, {1}) THEN REGEXP_EXTRACT({0}, {1}, {2}) END)"
        postgres: "((REGEXP_MATCH({0}, {1}))[{2}])"
        databricks: "(CASE WHEN {0} RLIKE {1} THEN REGEXP_EXTRACT({0}, {1}, {2}) END)"
        tsql: "REGEXP_SUBSTR({0}, {1}, 1, 1, '', {2})"
      literal_backslash_escapes: [snowflake, databricks, bigquery, redshift]
    dialects: [snowflake, duckdb, postgres, databricks, tsql]
    no_form:
      redshift: >-
        REGEXP_SUBSTR gives the pattern's first group only, never the n-th
      bigquery: >-
        REGEXP_EXTRACT gives a pattern's one group only, never the n-th
    tier: stable
    evidence: tableau-calc
  - id: tableau.regexp_replace
    match: {language: tableau-calc, function: REGEXP_REPLACE}
    emit:
      template: "REGEXP_REPLACE({0}, {1}, {2})"
      dialect_templates:
        duckdb: "REGEXP_REPLACE({0}, {1}, {2}, 'g')"
        postgres: "REGEXP_REPLACE({0}, {1}, {2}, 'g')"
      literal_backslash_escapes: [snowflake, databricks, bigquery, redshift]
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc
  - id: tableau.proper
    match: {language: tableau-calc, function: PROPER}
    emit: {template: "INITCAP({0})"}
    dialects: [snowflake, postgres, redshift, databricks, bigquery]
    no_form:
      duckdb: >-
        no function that capitalises each word
      tsql: >-
        no function that capitalises each word
    tier: stable
    evidence: tableau-calc
  - id: tableau.char
    match: {language: tableau-calc, function: CHAR}
    emit: {template: "CHR({0})"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.ascii
    match: {language: tableau-calc, function: ASCII}
    emit: {template: "ASCII({0})"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.space
    match: {language: tableau-calc, function: SPACE}
    emit: {template: "REPEAT(' ', {0})"}
    tier: stable
    evidence: tableau-calc

  # Numbers: DIV truncates toward zero; SQUARE and `^` are powers; MIN / MAX of two values
  # are NULL when either is (a single argument is the aggregate).
  - id: tableau.div
    match: {language: tableau-calc, function: DIV}
    emit: {template: "CAST(TRUNC({0} / NULLIF({1}, 0)) AS BIGINT)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.square
    match: {language: tableau-calc, function: SQUARE}
    emit: {template: "POWER({0}, 2)"}
    tier: stable
    evidence: tableau-calc
  - id: tableau.power_operator
    match: {language: tableau-calc, function: "^"}
    emit: {template: "POWER({0}, {1})"}
    tier: stable
    evidence: tableau-calc
  # ATTR: the one value of the rows, or '*' when they hold several (checked live: '*' is what
  # the view shows and VizQL Data Service answers SPECIAL_TYPE_MANY_VALUES).
  - id: tableau.attr
    match: {language: tableau-calc, function: ATTR}
    emit:
      template: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS VARCHAR) ELSE '*' END"
      dialect_templates:
        databricks: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS STRING) ELSE '*' END"
        bigquery: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS STRING) ELSE '*' END"
        tsql: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS NVARCHAR(4000)) ELSE '*' END"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: tableau-calc

  # ---------------------------------------------------------------- filter operators
  - id: op.eq
    match: {operator: eq}
    emit: {template: "{0} = {1}"}
    tier: stable
    evidence: schema
  # `list_arg` says this operator can take a MULTI-VALUE filter. A Tableau filter on several
  # members carries a list, and an operator without this flag refuses it rather than
  # flattening it into a literal nobody wrote.
  - id: op.in
    match: {operator: in}
    emit: {template: "{0} IN ({1})", list_arg: true}
    tier: stable
    evidence: schema
  - id: op.neq
    match: {operator: neq}
    emit: {template: "{0} <> {1}"}
    tier: stable
    evidence: schema
  - id: op.gte
    match: {operator: range}
    emit: {template: "{0} >= {1}"}
    tier: stable
    evidence: schema
  # A range's upper bound. A range filter carries {min, max}; `range` places the lower bound
  # and this row the upper one, so a bounded range is never read as open-ended.
  - id: op.lte
    match: {operator: lte}
    emit: {template: "{0} <= {1}"}
    tier: stable
    evidence: schema

  # Equal, with NULL equal to NULL: the join a level-of-detail expression makes on its
  # dimensions (a NULL member is a member).
  - id: op.null_safe_eq
    match: {operator: null_safe_eq}
    emit:
      template: "{0} IS NOT DISTINCT FROM {1}"
      # Where IS NOT DISTINCT FROM is not spelled, the test written out: equal, or both NULL.
      # It is never negated by the engine, so its NULL (one side NULL) reads as no match.
      dialect_templates:
        databricks: "{0} <=> {1}"
        redshift: "({0} = {1} OR ({0} IS NULL AND {1} IS NULL))"
        tsql: "({0} = {1} OR ({0} IS NULL AND {1} IS NULL))"
    dialects: [snowflake, duckdb, postgres, databricks, bigquery, redshift, tsql]
    tier: stable
    evidence: schema

  # A recursive statement (a value computed row by row from the row before), opened by
  # `template`; its value column takes `number_type` or `text_type` (a recursion's column
  # type is its first row's, which may be narrower than a later one). Tableau's
  # PREVIOUS_VALUE in a shape with no closed form is compiled as one.
  - id: op.recursive_rows
    match: {operator: recursive_rows}
    emit:
      template: "WITH RECURSIVE"
      # T-SQL spells a recursive CTE as a plain WITH, allows a WITH only at the top of a
      # statement (`hoist`: the engine moves it there) and stops a recursion at 100 levels
      # unless the statement says otherwise (`statement_suffix`).
      dialect_templates: {tsql: "WITH"}
      hoist: [tsql]
      statement_suffix: {tsql: "OPTION (MAXRECURSION 0)"}
      ignore_args: true
      number_type: {snowflake: DOUBLE, duckdb: DOUBLE, postgres: DOUBLE PRECISION,
                    bigquery: FLOAT64, redshift: DOUBLE PRECISION, databricks: DOUBLE,
                    tsql: FLOAT}
      text_type: {snowflake: VARCHAR, duckdb: VARCHAR, postgres: TEXT, bigquery: STRING,
                  redshift: VARCHAR(65535), databricks: STRING, tsql: NVARCHAR(4000)}
      # Databricks stops a recursion at 100 levels unless the CTE states its own cap (Runtime
      # 17.0+, `name MAX RECURSION LEVEL n AS (...)`); its result is capped at 1,000,000 rows,
      # so that is the deepest a partition can go.
      recursion_clause: {databricks: "MAX RECURSION LEVEL 1000000"}
    dialects: [snowflake, duckdb, postgres, bigquery, redshift, databricks, tsql]
    tier: stable
    evidence: schema

  # Power BI's parser reports a categorical restriction as `filter`. It is an equality on the
  # named column; without this row the predicate has no rule, and the compiler REFUSES the
  # unit rather than emitting a statement missing a filter the widget applies.
  - id: op.filter
    match: {operator: filter}
    emit: {template: "{0} = {1}"}
    tier: stable
    evidence: visual-usage

  - id: op.lt
    match: {operator: lt}
    emit: {template: "{0} < {1}"}
    tier: stable
    evidence: schema

  - id: op.gt
    match: {operator: gt}
    emit: {template: "{0} > {1}"}
    tier: stable
    evidence: schema

  # The current period so far ("month to date"): the window a Tableau Pulse metric shows by
  # default (`RANGE_CURRENT_PARTIAL`). The value is the calendar part (day, month, quarter,
  # year; a week's start differs by warehouse setting, so the reader never sends one). Only
  # where DATE_TRUNC takes the part as a string first and CURRENT_DATE/CURRENT_TIMESTAMP exist.
  # A RELATIVE DATE filter (Tableau "last 3 months", "this year", anchored or from today):
  # `{0} >= {1} AND {0} < {2}`, the bounds the start of a period moved by whole periods.
  # `shift` is moving a date by n periods in each dialect; a dialect without one is refused.
  - id: op.relative_date
    match: {operator: relative_date}
    emit:
      template: "({0} >= {1} AND {0} < {2})"
      shift:
        snowflake: "DATEADD({p}, {n}, {d})"
        databricks: "DATEADD({p}, {n}, {d})"
        redshift: "DATEADD({p}, {n}, {d})"
        duckdb: "({d} + INTERVAL ({n}) {p})"
        postgres: "({d} + ({n}) * INTERVAL '1 {p}')"
        bigquery: "DATE_ADD({d}, INTERVAL ({n}) {p})"
        tsql: "DATEADD({p}, {n}, {d})"
      # The start of a period ({p} the period, {d} the date) where DATE_TRUNC('{p}', {d}) is
      # not how the dialect writes it, and today where CURRENT_DATE is not.
      trunc:
        bigquery: "DATE_TRUNC({d}, {p})"
        tsql: "DATETRUNC({p}, {d})"
      today:
        tsql: "CAST(GETDATE() AS DATE)"
      # The current moment as the session's wall clock (a "to date" filter on a time column
      # ends there; seen live: the site's local time, not UTC).
      now:
        snowflake: "CAST(CURRENT_TIMESTAMP() AS TIMESTAMP_NTZ)"
        databricks: "CAST(current_timestamp() AS TIMESTAMP)"
        redshift: "GETDATE()"
        duckdb: "CAST(current_localtimestamp() AS TIMESTAMP)"
        postgres: "LOCALTIMESTAMP"
        bigquery: "CURRENT_DATETIME()"
        tsql: "CAST(SYSDATETIME() AS DATETIME2)"
      # The current moment as the wall clock of a named time zone (`{tz}`, an IANA name the
      # viewer file states: the time zone the BI tool reads "now" in).
      now_in_zone:
        snowflake: "CONVERT_TIMEZONE('{tz}', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ"
        databricks: "from_utc_timestamp(current_timestamp(), '{tz}')"
        redshift: "CONVERT_TIMEZONE('{tz}', GETDATE())"
        duckdb: "CAST(timezone('{tz}', current_timestamp) AS TIMESTAMP)"
        postgres: "(CURRENT_TIMESTAMP AT TIME ZONE '{tz}')"
        bigquery: "CURRENT_DATETIME('{tz}')"
        tsql: "CAST(SYSDATETIMEOFFSET() AT TIME ZONE '{tz}' AS DATETIME2)"
      # A dialect that names a time zone by its own names, not IANA's: the IANA name -> the
      # dialect's (T-SQL takes Windows names; the Unicode CLDR windowsZones mapping). A zone
      # not listed is refused by name.
      zone_names:
        tsql:
          "UTC": "UTC"
          "Etc/UTC": "UTC"
          "Europe/London": "GMT Standard Time"
          "Europe/Dublin": "GMT Standard Time"
          "Europe/Lisbon": "GMT Standard Time"
          "Europe/Paris": "Romance Standard Time"
          "Europe/Brussels": "Romance Standard Time"
          "Europe/Madrid": "Romance Standard Time"
          "Europe/Copenhagen": "Romance Standard Time"
          "Europe/Berlin": "W. Europe Standard Time"
          "Europe/Rome": "W. Europe Standard Time"
          "Europe/Amsterdam": "W. Europe Standard Time"
          "Europe/Vienna": "W. Europe Standard Time"
          "Europe/Stockholm": "W. Europe Standard Time"
          "Europe/Oslo": "W. Europe Standard Time"
          "Europe/Zurich": "W. Europe Standard Time"
          "Europe/Warsaw": "Central European Standard Time"
          "Europe/Prague": "Central Europe Standard Time"
          "Europe/Budapest": "Central Europe Standard Time"
          "Europe/Athens": "GTB Standard Time"
          "Europe/Bucharest": "GTB Standard Time"
          "Europe/Helsinki": "FLE Standard Time"
          "Europe/Kiev": "FLE Standard Time"
          "Europe/Istanbul": "Turkey Standard Time"
          "Europe/Moscow": "Russian Standard Time"
          "America/New_York": "Eastern Standard Time"
          "America/Toronto": "Eastern Standard Time"
          "America/Chicago": "Central Standard Time"
          "America/Denver": "Mountain Standard Time"
          "America/Phoenix": "US Mountain Standard Time"
          "America/Los_Angeles": "Pacific Standard Time"
          "America/Vancouver": "Pacific Standard Time"
          "America/Anchorage": "Alaskan Standard Time"
          "Pacific/Honolulu": "Hawaiian Standard Time"
          "America/Mexico_City": "Central Standard Time (Mexico)"
          "America/Sao_Paulo": "E. South America Standard Time"
          "America/Argentina/Buenos_Aires": "Argentina Standard Time"
          "America/Bogota": "SA Pacific Standard Time"
          "Asia/Tokyo": "Tokyo Standard Time"
          "Asia/Seoul": "Korea Standard Time"
          "Asia/Shanghai": "China Standard Time"
          "Asia/Hong_Kong": "China Standard Time"
          "Asia/Singapore": "Singapore Standard Time"
          "Asia/Kolkata": "India Standard Time"
          "Asia/Dubai": "Arabian Standard Time"
          "Australia/Sydney": "AUS Eastern Standard Time"
          "Australia/Melbourne": "AUS Eastern Standard Time"
          "Australia/Perth": "W. Australia Standard Time"
          "Pacific/Auckland": "New Zealand Standard Time"
          "Africa/Johannesburg": "South Africa Standard Time"
      # The ISO day of week (Monday = 1 ... Sunday = 7): a week starts on the day the data
      # source states.
      weekday_iso:
        snowflake: "DAYOFWEEKISO({0})"
        databricks: "(MOD(DAYOFWEEK({0}) + 5, 7) + 1)"
        redshift: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        duckdb: "ISODOW({0})"
        postgres: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        bigquery: "(MOD(EXTRACT(DAYOFWEEK FROM {0}) + 5, 7) + 1)"
        tsql: "(((DATEDIFF(day, CAST('1900-01-01' AS DATE), {0}) % 7) + 7) % 7 + 1)"
    dialects: [snowflake, databricks, redshift, duckdb, postgres, bigquery, tsql]
    tier: stable
    evidence: visual-usage

  # A text test on a column (a filter pane's "contains" / "starts with"). The compiler folds
  # case and the column's trailing spaces first where the model compares text that way.
  - id: op.contains
    match: {operator: contains}
    emit:
      template: "POSITION({1} IN {0}) > 0"
      dialect_templates: {bigquery: "STRPOS({0}, {1}) > 0", tsql: "CHARINDEX({1}, {0}) > 0"}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: visual-usage
  - id: op.starts_with
    match: {operator: starts_with}
    emit:
      template: "POSITION({1} IN {0}) = 1"
      dialect_templates: {bigquery: "STRPOS({0}, {1}) = 1", tsql: "CHARINDEX({1}, {0}) = 1"}
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: visual-usage

  # A range whose bounds are computed from the moment the query runs, in UTC (a relative date
  # or time filter): `now` is that moment as a timestamp with no time zone, `shift` moves it
  # by n units, `trunc` cuts it to the start of a unit. A week is not among the units: its
  # first day is the model's culture's.
  - id: op.relative_range
    match: {operator: relative_range}
    emit:
      template: "{0}"
      units: [day, month, year, hour, minute, second]
      now:
        snowflake: "SYSDATE()"
        duckdb: "CAST(timezone('UTC', current_timestamp) AS TIMESTAMP)"
        postgres: "(CURRENT_TIMESTAMP AT TIME ZONE 'UTC')"
        databricks: "CAST(to_utc_timestamp(current_timestamp(), current_timezone()) AS TIMESTAMP)"
        # GETDATE() is the session's local time; read as that zone's moment, then in UTC.
        redshift: "CONVERT_TIMEZONE('UTC', CAST(GETDATE() AS TIMESTAMPTZ))"
        bigquery: "CURRENT_DATETIME('UTC')"
        tsql: "CAST(SYSUTCDATETIME() AS DATETIME2)"
      shift:
        snowflake: "DATEADD({p}, {n}, {d})"
        databricks: "TIMESTAMPADD({p}, {n}, {d})"
        duckdb: "({d} + INTERVAL ({n}) {p})"
        postgres: "({d} + ({n}) * INTERVAL '1 {p}')"
        redshift: "DATEADD({p}, {n}, {d})"
        bigquery: "DATETIME_ADD(CAST({d} AS DATETIME), INTERVAL ({n}) {p})"
        tsql: "DATEADD({p}, {n}, {d})"
      trunc:
        snowflake: "DATE_TRUNC('{p}', {d})"
        databricks: "DATE_TRUNC('{p}', {d})"
        duckdb: "DATE_TRUNC('{p}', {d})"
        postgres: "DATE_TRUNC('{p}', {d})"
        redshift: "DATE_TRUNC('{p}', {d})"
        bigquery: "DATETIME_TRUNC(CAST({d} AS DATETIME), {p})"
        tsql: "DATETRUNC({p}, {d})"
      # The ISO day of week (Monday = 1 ... Sunday = 7): a week's start is the day moved back
      # to the weekday the filter states.
      weekday_iso:
        snowflake: "DAYOFWEEKISO({0})"
        duckdb: "ISODOW({0})"
        postgres: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        databricks: "(MOD(DAYOFWEEK({0}) + 5, 7) + 1)"
        redshift: "(MOD(CAST(EXTRACT(DOW FROM {0}) AS INTEGER) + 6, 7) + 1)"
        bigquery: "(MOD(EXTRACT(DAYOFWEEK FROM {0}) + 5, 7) + 1)"
        tsql: "(((DATEDIFF(day, CAST('1900-01-01' AS DATE), {0}) % 7) + 7) % 7 + 1)"
    dialects: [snowflake, duckdb, postgres, databricks, redshift, bigquery, tsql]
    tier: stable
    evidence: visual-usage

  - id: op.period_to_date
    match: {operator: period_to_date}
    emit:
      template: "({0} >= DATE_TRUNC({1}, CURRENT_DATE) AND {0} <= CURRENT_TIMESTAMP)"
      dialect_templates:
        bigquery: "({0} >= DATE_TRUNC(CURRENT_DATE(), {1!word}) AND {0} <= CURRENT_DATETIME())"
        tsql: "({0} >= DATETRUNC({1!word}, CAST(GETDATE() AS DATE)) AND {0} <= GETDATE())"
    dialects: [snowflake, postgres, redshift, databricks, duckdb, bigquery, tsql]
    tier: stable
    evidence: visual-usage
