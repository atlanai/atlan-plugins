# The BI→SQL compiler's rule table.
#
# The built-in readers' table: the `tableau` and `powerbi` readers declare it as their
# `compiler_rules` (sockets.BIReader). Another reader ships its own.
#
# THIS FILE IS DATA, NOT CODE, AND THAT IS THE WHOLE POINT. The engine
# (`src/metrics_agent/plugs/readers/bicompile.py`) is human-owned Python; what it KNOWS lives here. A review pass
# may propose rows and the run may promote them automatically, because a row is
# schema-checkable, diffable and reversible in a way that an arbitrary code patch is not.
#
# A ROW NEVER SHIPS ALONE. Promotion requires (1) a regression case, (2) the whole accumulated
# corpus still passing, and (3) the emitted SQL surviving the witness. The corpus is the
# reviewer; there is no human in the loop.
#
# TIERS
#   stable       seeded here by a person, or graduated after holding across
#                `compiler.graduate_after_estates` distinct estates.
#   provisional  learned by a run. USED, but every object it touched carries a gotcha saying
#                so — the same honesty the layer applies to a provisional metric name.
#
# DIALECTS
#   `dialects` lists the dialects a row has a form for; `dialect_templates` spells the row per
#   dialect where the template is not that dialect's SQL; `part_templates` ({dialect: {part:
#   template}}, the part being argument `part_arg`) spells it per date part where the dialect
#   has no function taking the part; `{0!word}` places a date part literal as a keyword
#   (`DATEPART(year, d)`). `no_form` ({dialect: reason}) names, for a dialect the row has no
#   form for, what the dialect lacks; the refusal says it. tests/test_dialect_rows.py holds
#   every row to a form or a reason for each warehouse dialect.
#
# `untranslatable` IS A REAL ANSWER. A table calculation runs after the query, on the result
# set; a FIXED LOD computes at a grain the statement does not have. No row makes those SQL, and
# a row that pretended to would be the worst kind of defect: one that runs.

version: 1

rules:
  # ---------------------------------------------------------------- aggregations
  - id: agg.sum
    match: {aggregation: sum}
    emit: {template: "SUM({0})"}
    tier: stable
    evidence: schema
    note: the shelf's own aggregation

  - id: agg.avg
    match: {aggregation: avg}
    emit: {template: "AVG({0})"}
    tier: stable
    evidence: schema

  - id: agg.min
    match: {aggregation: min}
    emit: {template: "MIN({0})"}
    tier: stable
    evidence: schema

  - id: agg.max
    match: {aggregation: max}
    emit: {template: "MAX({0})"}
    tier: stable
    evidence: schema

  - id: agg.count
    match: {aggregation: count}
    emit: {template: "COUNT({0})"}
    tier: stable
    evidence: schema

  - id: agg.count_distinct
    match: {aggregation: count_distinct}
    emit: {template: "COUNT(DISTINCT {0})"}
    tier: stable
    evidence: schema

  # The middle value (interpolated between the two middle values of an even count) and the
  # sample / population spread, where the dialect names them so.
  # The one value a column holds over the rows, or '*' when it holds several (NULLs not
  # counted; NULL when there is none): a blended secondary's dimension, which never splits
  # the primary's rows (seen live).
  - id: agg.single_value
    match: {aggregation: single_value}
    emit:
      template: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS VARCHAR) ELSE '*' END"
      dialect_templates:
        databricks: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS STRING) ELSE '*' END"
        bigquery: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS STRING) ELSE '*' END"
        tsql: "CASE WHEN MIN({0}) IS NULL THEN NULL WHEN MIN({0}) = MAX({0}) THEN CAST(MIN({0}) AS NVARCHAR(4000)) ELSE '*' END"
    dialects: [snowflake, duckdb, postgres, redshift, databricks, bigquery, tsql]
    tier: stable
    evidence: visual-usage

  - id: agg.median
    match: {aggregation: median}
    emit:
      template: "MEDIAN({0})"
      # BigQuery's PERCENTILE_CONT is a window only: over the group's values, gathered.
      dialect_templates:
        postgres: "PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY {0})"
        bigquery: "(SELECT PERCENTILE_CONT(v, 0.5) OVER () FROM UNNEST(ARRAY_AGG({0} IGNORE NULLS)) AS v LIMIT 1)"
    dialects: [snowflake, duckdb, databricks, redshift, postgres, bigquery]
    no_form:
      tsql: >-
        PERCENTILE_CONT is a window function only, and T-SQL has no array to gather a group's values into
    tier: stable
    evidence: schema

  - id: agg.stdev
    match: {aggregation: stdev}
    emit: {template: "STDDEV_SAMP({0})"}
    tier: stable
    evidence: schema

  - id: agg.stdevp
    match: {aggregation: stdevp}
    emit: {template: "STDDEV_POP({0})"}
    tier: stable
    evidence: schema

  - id: agg.var
    match: {aggregation: var}
    emit: {template: "VAR_SAMP({0})"}
    tier: stable
    evidence: schema

  - id: agg.varp
    match: {aggregation: varp}
    emit: {template: "VAR_POP({0})"}
    tier: stable
    evidence: schema

  # ---------------------------------------------------------------- DAX
  # `window` says how an aggregate is summed across the visual's rows inside a CALCULATE
  # that removes the visual's grouping (ALL / REMOVEFILTERS / ALLEXCEPT / ALLSELECTED):
  # `combine` the outer aggregate of the per-row values, `ratio` a numerator and a
  # denominator summed separately. A row without one is not additive and is refused there.
  - id: dax.sum
    match: {language: dax, function: SUM}
    emit: {template: "SUM({0})", window: {combine: SUM}}
    tier: stable
    evidence: dax

  - id: dax.round
    match: {language: dax, function: ROUND}
    emit: {template: "ROUND({0}, {1})"}
    tier: stable
    evidence: dax
    note: DAX ROUND always takes the digit count; half away from zero in both DAX and Snowflake.

  - id: dax.average
    match: {language: dax, function: AVERAGE}
    emit: {template: "AVG({0})", window: {ratio: ["SUM({0})", "COUNT({0})"]}}
    tier: stable
    evidence: dax

  - id: dax.min
    match: {language: dax, function: MIN}
    emit: {template: "MIN({0})", window: {combine: MIN}}
    tier: stable
    evidence: dax

  - id: dax.max
    match: {language: dax, function: MAX}
    emit: {template: "MAX({0})", window: {combine: MAX}}
    tier: stable
    evidence: dax

  - id: dax.countrows
    match: {language: dax, function: COUNTROWS}
    emit: {template: "NULLIF(COUNT(*), 0)", arity: 1, ignore_args: true,
           window: {combine: SUM}}
    tier: stable
    evidence: dax
    note: >
      COUNTROWS(t) counts the rows of the table the statement already reads (the engine
      refuses another table by name); BLANK, not 0, when there are none (seen live)

  # DISTINCTCOUNT counts BLANK as one value; DISTINCTCOUNTNOBLANK does not (seen live: 203
  # and 202 customer keys beside a NULL one). `{g0}` is the argument where the CALCULATE
  # filter admits the row, `{0}` the argument as is and `{gate}` the filter as a leading
  # condition, so the blank is counted only on rows the filter admits. `text_key`: a text
  # column is counted as the model holds it, case-insensitive and without trailing spaces
  # (seen live: 'Retail', 'retail' and 'Retail ' are one value).
  - id: dax.distinctcount
    match: {language: dax, function: DISTINCTCOUNT}
    emit:
      template: "NULLIF(COUNT(DISTINCT {g0}) + MAX(CASE WHEN {gate}{0} IS NULL THEN 1 ELSE 0 END), 0)"
      text_key: true
    tier: stable
    evidence: dax

  - id: dax.divide
    match: {language: dax, function: DIVIDE}
    emit: {template: "{0} / NULLIF({1}, 0)"}
    tier: stable
    evidence: dax
    note: >
      DIVIDE is a GUARDED division — that is its entire reason to exist. Emitting a bare `/`
      would turn a blank into a division-by-zero error, which is a different answer, not a
      different spelling.

  # IFERROR(value, alt) returns alt only where value RAISES AN ERROR (seen live): a
  # division by zero or BLANK under a non-blank dividend is one (IFERROR(5 / 0, -1) is -1, as
  # are SQRT(-1), LOG(-1), VALUE("x")); a BLANK is not (IFERROR(BLANK(), -1) is BLANK, and so
  # is IFERROR(BLANK() / 0, -1)); DIVIDE raises none. COALESCE replaced every BLANK with the
  # alternate. `{raised}` is the condition the engine collects while reading the first
  # argument (`error_free`): each division's, and each function row's own `raises_when`. A
  # function the row lists in `raises` is refused by name: VALUE, DATEVALUE, TIMEVALUE and
  # CONVERT parse text by the model's culture (seen live: VALUE("1,234") is 1234 and
  # VALUE("$5") is 5, but VALUE("5%") raises), which no warehouse cast reproduces.
  - id: dax.iferror
    match: {language: dax, function: IFERROR}
    emit: {template: "CASE WHEN {raised} THEN {1} ELSE {0} END", error_free: 0,
           raises: [VALUE, DATEVALUE, TIMEVALUE, CONVERT]}
    tier: stable
    evidence: dax

  - id: dax.iserror
    match: {language: dax, function: ISERROR}
    emit: {template: "(CASE WHEN {raised} THEN TRUE ELSE FALSE END OR ({0}) IS NULL AND FALSE)",
           error_free: 0, raises: [VALUE, DATEVALUE, TIMEVALUE, CONVERT]}
    tier: stable
    evidence: dax

  # ERROR("text") raises an evaluation error wherever it is reached (seen live:
  # IFERROR(IF(1 > 0, ERROR("e"), 5), -1) is -1, IFERROR(IF(1 < 0, ERROR("e"), 5), -1) is 5,
  # ISERROR(ERROR("q")) is TRUE). Read inside IFERROR / ISERROR only (`only_caught`): outside
  # them the visual shows the error.
  - id: dax.error
    match: {language: dax, function: ERROR}
    emit: {template: "NULL", raises_when: "TRUE", only_caught: true, arity: 1,
           ignore_args: true}
    tier: stable
    evidence: dax

  - id: dax.abs
    match: {language: dax, function: ABS}
    emit: {template: "ABS({0})"}
    tier: stable
    evidence: dax

  # Square root and logarithms. Each raises an EVALUATION ERROR where it has no real value
  # (seen live, executeQueries): SQRT of a negative (SQRT(BLANK()) is BLANK); LN, LOG10 and
  # LOG of zero, a negative or BLANK (a blank reads as 0); LOG with a base of zero, a negative,
  # BLANK or 1. `raises_when` is that condition, which IFERROR / ISERROR read; outside them
  # the visual itself shows the error. LOG's base is 10 when left out.
  - id: dax.sqrt
    match: {language: dax, function: SQRT}
    emit: {template: "SQRT({0})", raises_when: "{0} < 0"}
    tier: stable
    evidence: dax
  - id: dax.ln
    match: {language: dax, function: LN}
    emit: {template: "LN({0})", raises_when: "COALESCE({0}, 0) <= 0"}
    tier: stable
    evidence: dax
  - id: dax.log10
    match: {language: dax, function: LOG10}
    emit: {template: "(LN({0}) / LN(10))", raises_when: "COALESCE({0}, 0) <= 0"}
    tier: stable
    evidence: dax
  - id: dax.log
    match: {language: dax, function: LOG}
    emit: {template: "(LN({0}) / LN({1}))", defaults: {"1": "10"},
           raises_when: "COALESCE({0}, 0) <= 0 OR COALESCE({1}, 0) <= 0 OR {1} = 1"}
    tier: stable
    evidence: dax
    note: LOG(x[, base]), base 10 when left out.

  # The COUNT family: DAX returns BLANK, not 0, where nothing is counted (a group whose
  # values are all blank), so the SQL count is NULL there too.
  - id: dax.count
    match: {language: dax, function: COUNT}
    emit: {template: "NULLIF(COUNT({0}), 0)", window: {combine: SUM}}
    tier: stable
    evidence: dax
    note: the non-blank values of a column; BLANK when there are none

  - id: dax.counta
    match: {language: dax, function: COUNTA}
    emit: {template: "NULLIF(COUNT({0}), 0)", window: {combine: SUM}}
    tier: stable
    evidence: dax
    note: >
      the non-blank values of a column of any type; what a visual's "Count (Not Blanks)" of a
      column is

  - id: dax.distinctcountnoblank
    match: {language: dax, function: DISTINCTCOUNTNOBLANK}
    emit: {template: "NULLIF(COUNT(DISTINCT {0}), 0)", text_key: true}
    tier: stable
    evidence: dax
    note: >
      the distinct values, blank not counted; what a visual's "Count (Distinct)" of a column is
      (Microsoft's worked example counts 3 values beside a blank)

  - id: dax.median
    match: {language: dax, function: MEDIAN}
    emit:
      template: "MEDIAN({0})"
      dialect_templates:
        postgres: "PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY {0})"
        bigquery: "(SELECT PERCENTILE_CONT(v, 0.5) OVER () FROM UNNEST(ARRAY_AGG({0} IGNORE NULLS)) AS v LIMIT 1)"
    dialects: [snowflake, databricks, duckdb, redshift, postgres, bigquery]
    no_form:
      tsql: >-
        PERCENTILE_CONT is a window function only, and T-SQL has no array to gather a group's values into
    tier: stable
    evidence: dax
    note: blanks skipped; two middle values averaged, as SQL MEDIAN does

  - id: dax.stdev_p
    match: {language: dax, function: STDEV.P}
    emit: {template: "STDDEV_POP({0})"}
    tier: stable
    evidence: dax
    note: the population form, blanks skipped; a visual's "Standard deviation" of a column

  - id: dax.var_p
    match: {language: dax, function: VAR.P}
    emit: {template: "VAR_POP({0})"}
    tier: stable
    evidence: dax
    note: the population form, blanks skipped; a visual's "Variance" of a column

  # The blanks of a column; BLANK, not 0, when there are none (seen live). An empty string is
  # not a blank in DAX and is not counted.
  - id: dax.countblank
    match: {language: dax, function: COUNTBLANK}
    emit:
      template: "NULLIF(COUNT(CASE WHEN {gate}{0} IS NULL THEN 1 END), 0)"
      window: {combine: SUM}
    tier: stable
    evidence: dax

  # Row iterators over the measure's own table: the expression is evaluated per row (RELATED
  # reads the row's many-to-one dimension) and the values aggregated by the row's template.
  # Over the members of another table or of a column's VALUES, with a measure, an aggregate
  # or RELATEDTABLE per member, the engine compiles the statement at the members' grain and
  # aggregates it again by the same template (`_member_grain_statement`).
  - id: dax.sumx
    match: {language: dax, function: SUMX}
    emit: {template: "SUM({0})", row_iterator: true, window: {combine: SUM}}
    tier: stable
    evidence: dax

  - id: dax.averagex
    match: {language: dax, function: AVERAGEX}
    emit: {template: "AVG({0})", row_iterator: true,
           window: {ratio: ["SUM({0})", "COUNT({0})"]}}
    tier: stable
    evidence: dax

  - id: dax.countx
    match: {language: dax, function: COUNTX}
    emit: {template: "NULLIF(COUNT({0}), 0)", row_iterator: true, window: {combine: SUM}}
    tier: stable
    evidence: dax
    note: the rows whose expression is not blank; BLANK when there are none (seen live)

  - id: dax.related
    match: {language: dax, function: RELATED}
    emit: {template: "{0}", reads_related: true}
    tier: stable
    evidence: dax
    note: >
      the current row's value on the one end of a many-to-one relationship, inside a row
      iterator; a fact row with no match reads BLANK (the LEFT JOIN's NULL)

  - id: dax.if_eager
    match: {language: dax, function: IF.EAGER}
    emit:
      template: "CASE WHEN {0} THEN {1} ELSE {2} END"
      defaults: {"2": "NULL"}
    tier: stable
    evidence: dax
    note: IF evaluated eagerly; the same value

  - id: dax.coalesce
    match: {language: dax, function: COALESCE}
    emit: {template: "COALESCE({0})", variadic: true}
    tier: stable
    evidence: dax
    note: the first argument that is not blank (seen live)

  # DAX `/` is IEEE division (seen live): x / BLANK and x / 0 are Infinity or -Infinity,
  # 0 / 0 and 0 / BLANK are NaN, BLANK / y is BLANK. SQL raises on a zero divisor, so a
  # divisor that is not a non-zero literal is spelled out; a dialect without the row is
  # refused by name.
  - id: dax.divide_operator
    match: {language: dax, function: "/"}
    emit:
      template: >-
        (CASE WHEN {0} IS NULL THEN NULL WHEN COALESCE({1}, 0) = 0 THEN CAST(CASE WHEN {0} > 0
        THEN 'Infinity' WHEN {0} < 0 THEN '-Infinity' ELSE 'NaN' END AS DOUBLE) ELSE {0} / {1} END)
      dialect_templates:
        postgres: >-
          (CASE WHEN {0} IS NULL THEN NULL WHEN COALESCE({1}, 0) = 0 THEN CAST(CASE WHEN {0} > 0
          THEN 'Infinity' WHEN {0} < 0 THEN '-Infinity' ELSE 'NaN' END AS DOUBLE PRECISION)
          ELSE {0} / {1} END)
        # IEEE_DIVIDE is the IEEE division itself (x / 0 is +/-inf, 0 / 0 NaN).
        bigquery: "(CASE WHEN {0} IS NULL THEN NULL ELSE IEEE_DIVIDE({0}, COALESCE({1}, 0)) END)"
    dialects: [snowflake, duckdb, databricks, postgres, bigquery]
    no_form:
      tsql: >-
        FLOAT holds no infinity or NaN, which DAX's division by zero gives
    tier: stable
    evidence: dax

  # Row-level DAX, as a calculated column or a date level is written.
  - id: dax.if
    match: {language: dax, function: IF}
    emit:
      template: "CASE WHEN {0} THEN {1} ELSE {2} END"
      defaults: {"2": "NULL"}
      # Inside IFERROR / ISERROR an error raised in a branch is one only where that branch
      # is taken (seen live).
      branch_guards: {"1": "COALESCE({0}, FALSE)", "2": "NOT COALESCE({0}, FALSE)"}
    tier: stable
    evidence: dax
    note: a blank condition is FALSE; with no else the result is BLANK

  - id: dax.isblank
    match: {language: dax, function: ISBLANK}
    emit: {template: "({0} IS NULL)"}
    tier: stable
    evidence: dax

  - id: dax.blank
    match: {language: dax, function: BLANK}
    emit: {template: "NULL", arity: 0, ignore_args: true}
    tier: stable
    evidence: dax

  - id: dax.year
    match: {language: dax, function: YEAR}
    emit: {template: "YEAR({0})"}
    tier: stable
    evidence: dax

  # DAX's DATE(year, month, day): a month or day outside its range rolls over (DATE(2024,
  # 13, 1) is 1 January 2025; day 0 is the month's last day before), so it is written as the
  # year's first day moved by the months and days, which rolls over the same way.
  - id: dax.date
    match: {language: dax, function: DATE}
    emit:
      template: "DATEADD(day, {2} - 1, DATEADD(month, {1} - 1, DATE_FROM_PARTS({0}, 1, 1)))"
      dialect_templates:
        duckdb: "CAST(make_date({0}, 1, 1) + to_months(CAST({1} - 1 AS INTEGER)) + to_days(CAST({2} - 1 AS INTEGER)) AS DATE)"
        postgres: "CAST(make_date({0}, 1, 1) + ({1} - 1) * INTERVAL '1 month' + ({2} - 1) * INTERVAL '1 day' AS DATE)"
        bigquery: "DATE_ADD(DATE_ADD(DATE({0}, 1, 1), INTERVAL {1} - 1 MONTH), INTERVAL {2} - 1 DAY)"
        databricks: "DATE_ADD(ADD_MONTHS(make_date({0}, 1, 1), {1} - 1), {2} - 1)"
        tsql: "DATEADD(day, {2} - 1, DATEADD(month, {1} - 1, DATEFROMPARTS({0}, 1, 1)))"
        redshift: "CAST(DATEADD(day, {2} - 1, DATEADD(month, {1} - 1, TO_DATE(CAST({0} AS VARCHAR) || '-01-01', 'YYYY-MM-DD'))) AS DATE)"
    dialects: [snowflake, duckdb, redshift, databricks, postgres, bigquery, tsql]
    tier: stable
    evidence: dax
    note: a date from its parts, month and day rolling over as DAX's do (a year below 100 is not moved by 1900 here)

  # EDATE(date, n): the date n months on, the day kept or cut to the month's last.
  - id: dax.edate
    match: {language: dax, function: EDATE}
    emit:
      template: "DATEADD(month, {1}, {0})"
      dialect_templates:
        duckdb: "CAST({0} + to_months(CAST({1} AS INTEGER)) AS DATE)"
        postgres: "CAST({0} + ({1}) * INTERVAL '1 month' AS DATE)"
        bigquery: "DATE_ADD({0}, INTERVAL {1} MONTH)"
        databricks: "ADD_MONTHS({0}, {1})"
        tsql: "CAST(DATEADD(month, {1}, {0}) AS DATE)"
        redshift: "CAST(DATEADD(month, {1}, {0}) AS DATE)"
    dialects: [snowflake, duckdb, redshift, databricks, postgres, bigquery, tsql]
    tier: stable
    evidence: dax

  # EOMONTH(date, n): the last day of the month n months on.
  - id: dax.eomonth
    match: {language: dax, function: EOMONTH}
    emit:
      template: "LAST_DAY(DATEADD(month, {1}, {0}))"
      dialect_templates:
        duckdb: "last_day(CAST({0} + to_months(CAST({1} AS INTEGER)) AS DATE))"
        postgres: "CAST(date_trunc('month', {0} + ({1} + 1) * INTERVAL '1 month') - INTERVAL '1 day' AS DATE)"
        bigquery: "LAST_DAY(DATE_ADD({0}, INTERVAL {1} MONTH))"
        databricks: "LAST_DAY(ADD_MONTHS({0}, {1}))"
        tsql: "EOMONTH({0}, {1})"
        redshift: "LAST_DAY(DATEADD(month, {1}, {0}))"
      defaults: {"1": "0"}
    dialects: [snowflake, duckdb, redshift, databricks, postgres, bigquery, tsql]
    tier: stable
    evidence: dax

  - id: dax.quarter
    match: {language: dax, function: QUARTER}
    emit: {template: "QUARTER({0})"}
    tier: stable
    evidence: dax

  - id: dax.month
    match: {language: dax, function: MONTH}
    emit: {template: "MONTH({0})"}
    tier: stable
    evidence: dax

  - id: dax.day
    match: {language: dax, function: DAY}
    emit: {template: "DAY({0})"}
    tier: stable
    evidence: dax

  # SELECTEDVALUE(c, alt) is IF(HASONEVALUE(c), VALUES(c), alt), and DAX's VALUES counts
  # BLANK as a value of its own while SQL's COUNT(DISTINCT) skips NULL. So: exactly one
  # non-null value and no NULL -> that value; only NULLs -> the one value is BLANK, so blank
  # (NOT the alternate); several values, or a NULL beside a value, or no rows -> alt. The
  # alternate is BLANK when omitted (`defaults`). Inside a CALCULATE the template's own
  # aggregates cannot be gated by the filter, so the engine refuses it there.
  - id: dax.selectedvalue
    match: {language: dax, function: SELECTEDVALUE}
    emit:
      template: >-
        CASE WHEN COUNT(DISTINCT {0}) = 1 AND COUNT({0}) = COUNT(*) THEN MIN({0})
        WHEN COUNT(*) > 0 AND COUNT({0}) = 0 THEN NULL ELSE {1} END
      defaults: {"1": "NULL"}
    tier: stable
    evidence: dax
    note: one value incl. BLANK as a value; the alternate (BLANK by default) otherwise

  # Tests of the visual's context, which a statement knows when it is compiled: ISINSCOPE is
  # TRUE on the rows that group by the column (a subtotal or total over it is a statement of
  # its own, which does not), ISFILTERED where the visual groups or filters by it, and
  # HASONEVALUE where one value of it is in context (seen live on a matrix with subtotals).
  # The engine reads each (`_context_test`); the template is the column it reads.
  - id: dax.isinscope
    match: {language: dax, function: ISINSCOPE}
    emit: {template: "{0}", context_test: inscope}
    tier: stable
    evidence: dax

  - id: dax.isfiltered
    match: {language: dax, function: ISFILTERED}
    emit: {template: "{0}", context_test: filtered}
    tier: stable
    evidence: dax

  - id: dax.hasonevalue
    match: {language: dax, function: HASONEVALUE}
    emit: {template: "{0}", context_test: onevalue}
    tier: stable
    evidence: dax

  # ISCROSSFILTERED: TRUE where the visual groups or filters by a column of the column's table
  # or of a table whose filters reach it (seen live: a filter on the fact's channel does not
  # cross-filter a customer column; one on the customer's region does cross-filter the fact).
  - id: dax.iscrossfiltered
    match: {language: dax, function: ISCROSSFILTERED}
    emit: {template: "{0}", context_test: crossfiltered}
    tier: stable
    evidence: dax

  # CONTAINSSTRING(text, find) is a case-insensitive substring test, FALSE (not blank) on a
  # blank text. Its SQL differs by dialect, so the row names the dialects whose spelling this
  # is; another dialect is refused by name until it has a row. `*`, `?` and `~` are wildcards
  # and an escape in DAX's find text: `literal_args` refuses a find text holding one, or one
  # that is not a string literal, rather than match it literally.
  - id: dax.containsstring
    match: {language: dax, function: CONTAINSSTRING}
    emit:
      template: "COALESCE(POSITION(LOWER({1}) IN LOWER({0})) > 0, FALSE)"
      dialect_templates:
        bigquery: "COALESCE(STRPOS(LOWER({0}), LOWER({1})) > 0, FALSE)"
      literal_args: {"1": "*?~"}
    dialects: [snowflake, postgres, redshift, databricks, duckdb, trino, bigquery]
    no_form:
      tsql: >-
        the test is a value (FALSE on a blank text), and T-SQL has no boolean value
    tier: stable
    evidence: dax

  # MINX / MAXX over a TABLE CONSTRUCTOR of scalars (`MINX({[A], [B]}, [Value])`, "the lowest
  # of several averages"). `scalar_list` tells the engine the first argument must be a
  # constructor and `{0}` receives its items, each coalesced with the others so a NULL is
  # skipped as DAX skips a blank even where LEAST / GREATEST return NULL on any NULL. Over a
  # model table the engine refuses by name. The dialects are those with LEAST / GREATEST.
  - id: dax.minx
    match: {language: dax, function: MINX}
    emit: {template: "LEAST({0})", scalar_list: true, row_template: "MIN({0})",
           window: {combine: MIN}}
    dialects: [snowflake, postgres, redshift, databricks, duckdb, trino, bigquery, mysql, tsql]
    tier: stable
    evidence: dax

  - id: dax.maxx
    match: {language: dax, function: MAXX}
    emit: {template: "GREATEST({0})", scalar_list: true, row_template: "MAX({0})",
           window: {combine: MAX}}
    dialects: [snowflake, postgres, redshift, databricks, duckdb, trino, bigquery, mysql, tsql]
    tier: stable
    evidence: dax

  # Time intelligence and filter-context modifiers. The engine compiles each where its
  # meaning is a statement (a CALCULATE filter argument, TOTALxTD): `bicompile._calculate`
  # and `_compile_time_unit`. These rows name what remains, outside those places or in a
  # form the engine does not read.
  - id: dax.calculate
    match: {language: dax, function: CALCULATE}
    emit: {untranslatable: "CALCULATE modifies filter context; a single statement has none"}
    tier: stable
    evidence: dax

  # DATESYTD also carries each dialect's DATE ARITHMETIC for every date set
  # (`date_math`): add_months / add_days clamp to the month's last day (as the tool does),
  # month_end is a month's last day, trunc the first day of a part, date a literal.
  - id: dax.datesytd
    match: {language: dax, function: DATESYTD}
    emit:
      untranslatable: "a table of dates; compiled only as a CALCULATE filter"
      date_math:
        snowflake:
          add_months: "DATEADD(MONTH, {1}, {0})"
          add_days: "DATEADD(DAY, {1}, {0})"
          month_end: "LAST_DAY({0})"
          trunc: "DATE_TRUNC('{1}', {0})"
          date: "DATE '{0}'"
        duckdb:
          add_months: "CAST({0} + INTERVAL ({1}) MONTH AS DATE)"
          add_days: "CAST({0} + INTERVAL ({1}) DAY AS DATE)"
          month_end: "LAST_DAY({0})"
          trunc: "CAST(DATE_TRUNC('{1}', {0}) AS DATE)"
          date: "DATE '{0}'"
        databricks:
          add_months: "ADD_MONTHS({0}, {1})"
          add_days: "DATE_ADD({0}, {1})"
          month_end: "LAST_DAY({0})"
          trunc: "CAST(DATE_TRUNC('{1}', {0}) AS DATE)"
          date: "DATE '{0}'"
        # A month added to the 31st is the month's last day (an interval of months clamps).
        postgres:
          add_months: "CAST({0} + ({1}) * INTERVAL '1 month' AS DATE)"
          add_days: "CAST({0} + ({1}) * INTERVAL '1 day' AS DATE)"
          month_end: "CAST(DATE_TRUNC('month', {0}) + INTERVAL '1 month' - INTERVAL '1 day' AS DATE)"
          trunc: "CAST(DATE_TRUNC('{1}', {0}) AS DATE)"
          date: "DATE '{0}'"
        # DATEADD by months clamps; ADD_MONTHS keeps a month's last day as the next one's
        # last day, which the formula language does not.
        redshift:
          add_months: "CAST(DATEADD(month, {1}, {0}) AS DATE)"
          add_days: "CAST(DATEADD(day, {1}, {0}) AS DATE)"
          month_end: "LAST_DAY({0})"
          trunc: "CAST(DATE_TRUNC('{1}', {0}) AS DATE)"
          date: "CAST('{0}' AS DATE)"
        bigquery:
          add_months: "DATE_ADD(DATE({0}), INTERVAL ({1}) MONTH)"
          add_days: "DATE_ADD(DATE({0}), INTERVAL ({1}) DAY)"
          month_end: "LAST_DAY(DATE({0}))"
          trunc: "DATE_TRUNC(DATE({0}), {1})"
          date: "DATE '{0}'"
        tsql:
          add_months: "CAST(DATEADD(month, {1}, {0}) AS DATE)"
          add_days: "CAST(DATEADD(day, {1}, {0}) AS DATE)"
          month_end: "EOMONTH({0})"
          trunc: "CAST(DATETRUNC({1}, {0}) AS DATE)"
          date: "CAST('{0}' AS DATE)"
    tier: stable
    evidence: dax

