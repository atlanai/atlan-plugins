[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-agent"
dynamic = ["version"]
description = "Turns a warehouse's query history and BI definitions into verified SQL and governed metrics."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlan Pte. Ltd." }]
requires-python = ">=3.11"
keywords = ["metrics", "semantic layer", "sql", "query history", "bi", "power bi", "tableau", "data catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# The core: everything the offline pipeline needs, and nothing that reaches a vendor.
dependencies = [
    "sqlglot>=25.0.0",       # parsing and dialect-aware read/write
    "PyYAML>=6.0",           # agent_policy.yml
    "jsonschema>=4.20.0",    # every stage validates its artifact before exit
    "duckdb>=1.0.0",         # reads local files (CSV, Parquet, Iceberg) and the synthetic test warehouse
]

[project.urls]
Homepage = "https://github.com/atlanai/atlan-plugins"
Documentation = "https://github.com/atlanai/atlan-plugins/tree/main/docs"
Source = "https://github.com/atlanai/atlan-plugins"
Issues = "https://github.com/atlanai/atlan-plugins/issues"

[project.optional-dependencies]
# LookML parsing (`plugs/readers/lookml.py`), imported lazily. Not yet a registered reader: the
# BI compiler has no LookML rules, so a run cannot name it.
lookml = ["lkml==1.3.7"]
# Offline Power BI `.pbix` reading, imported lazily inside the reader.
pbix = ["pbixray==0.15.5"]
# The plug packages (packages/) and the example plugs (examples/plugs/) are not extras: they are
# installed from the module tree by path with constraints.txt.
# pytest-xdist runs the offline suite in parallel (`-n auto`, as CI does).
dev = ["pytest>=8", "pytest-xdist==3.8.0"]
# The conformance kit (`metrics_agent.testing.conformance`) a plug author runs: pytest only.
testing = ["pytest>=8"]

[project.scripts]
metrics-agent = "metrics_agent.cli:main"

# The core's own plugs. A plug package registers its plugs the same way.
[project.entry-points."metrics_agent.plugs"]
local-files = "metrics_agent.plugs.local_files:LocalFiles"
files = "metrics_agent.plugs.files:Files"

# The core's own BI readers: each turns one tool's definition files into the common `bi_facts`
# format. The pipeline reaches them only through this group (`metrics_agent.readers`), so a
# package adding a BI tool registers its reader the same way and no core file changes. The
# LookML reader in `plugs/readers/lookml.py` has no compiler rules yet, so it is not
# registered: a run cannot name it.
[project.entry-points."metrics_agent.readers"]
tableau = "metrics_agent.plugs.readers.tableau:TableauReader"
powerbi = "metrics_agent.plugs.readers.powerbi:PowerBIReader"
powerbi-scan = "metrics_agent.plugs.readers.powerbi_scan:PowerBIScanReader"
powerbi-paginated = "metrics_agent.plugs.readers.powerbi_rdl:PowerBIPaginatedReader"
powerbi-goals = "metrics_agent.plugs.readers.powerbi_goals:PowerBIGoalsReader"

[tool.setuptools.dynamic]
version = { attr = "metrics_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The agent's own data files (schemas, policy) ship inside the package, so an installed wheel
# needs no source checkout. `_paths.DATA` is where they are read. The built-in readers' compiler
# rule table and regression corpus ship beside them, under `plugs/readers/data/`.
[tool.setuptools.package-data]
metrics_agent = ["data/*", "data/**/*", "plugs/readers/data/*", "plugs/readers/data/**/*"]
