interface:
  display_name: "Readiness Check"
  short_description: "Check you are ready to build, or see what your data and dashboards hold"
  default_prompt: "Use $analytics-readiness to check whether this machine and my data are ready to build an agent with Atlan Analytics."
dependencies:
  tools:
    - type: "mcp"
      value: "atlan"
      description: "Atlan's MCP server, signed in with OAuth"
      transport: "streamable_http"
      url: "https://api.atlan.com/mcp"
