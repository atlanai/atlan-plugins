interface:
  display_name: "Metrics Generation"
  short_description: "Turn dashboards and query history into checked metrics"
  default_prompt: "Use $metrics-generation to build metrics from our warehouse's query history."
dependencies:
  tools:
    - type: "mcp"
      value: "atlan"
      description: "Atlan's MCP server, signed in with OAuth"
      transport: "streamable_http"
      url: "https://api.atlan.com/mcp"
