interface:
  display_name: "Metrics Generation"
  short_description: "Turn dashboards and past queries into metrics your agent answers from"
  default_prompt: "Use $metrics-generation to build metrics from our warehouse's past queries."
dependencies:
  tools:
    - type: "mcp"
      value: "atlan"
      description: "Atlan's MCP server, signed in with OAuth"
      transport: "streamable_http"
      url: "https://api.atlan.com/mcp"
