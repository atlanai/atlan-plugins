# Bundled with the skill so `uv sync` in this directory produces a working
# `eval-builder` command. The skill documents commands; without this the skill is
# instructions for software the reader does not have.
[project]
name = "atlan-eval-agents"
version = "0.1.0"
description = "Build eval sets for talk-to-data agents from warehouse query history"
requires-python = ">=3.11"
dependencies = [
    # prune.py and the BI adapters read `Select.args["from_"]` and rely on the
    # optimizer's scope API; both changed in sqlglot 30.
    # Pinned to the tested release: 30.21.0 (2026-09-30) changed the AST and
    # optimizer behaviour tile pruning depends on (33 of 248 tests fail on it).
    # Raise the bound only after the suite passes on the new release.
    "sqlglot>=30.20,<30.21",
]

[project.optional-dependencies]
# Query-history mining and golden-SQL execution on Snowflake; local files and BI exports need none.
snowflake = ["snowflake-connector-python[secure-local-storage]>=3.12"]

[project.scripts]
eval-builder = "eval_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_builder"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
