.prow.open { background: var(--bg-surface); box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); margin: 2px 0; }
.prow-h { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; font-weight: 500; cursor: pointer; border-radius: 12px; }
.prow-h:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }
.prow-h .n { color: var(--text-subtle); font-weight: 400; font-variant-numeric: tabular-nums; }
.prow-h .chev { margin-left: auto; color: var(--icon-default); }
.prow.open .prow-h .chev { transform: rotate(180deg); }
.prow-b { box-sizing: border-box; padding: 0 16px 16px; display: grid; gap: 10px; min-width: 0; }
.prow-b ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.pkv { display: grid; grid-template-columns: 16px 92px minmax(0, 1fr); gap: 8px; align-items: start; }
.pkv .ic, .pline .ic { color: var(--icon-default); margin-top: 3px; }
.pk { color: var(--text-subtle); }
.pvv { min-width: 0; overflow-wrap: anywhere; }
.pchip { display: inline-flex; align-items: center; min-height: 22px; padding: 1px 8px; border-radius: 6px; border: 0.5px solid var(--border-control); font-size: 12px; line-height: 16px; margin: 0 4px 4px 0; }
.pdim { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--bg-success-subtle); color: var(--text-success); font-size: 12px; margin: 0 4px 4px 0; }
.pcard { border: 0.5px solid var(--border-default); border-radius: 12px; overflow: hidden; min-width: 0; }
.pcard-h { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-bottom: 0.5px solid var(--border-default); font-size: 12px; color: var(--text-subtle); }
.pwh { font: 11px/14px "Geist Mono", ui-monospace, monospace; border: 0.5px solid var(--border-control); border-radius: 6px; padding: 1px 6px; color: var(--text-default); }
.pseg { all: unset; margin-left: auto; display: inline-flex; background: var(--bg-muted); border-radius: 8px; padding: 2px; cursor: pointer; }
.pseg span { padding: 2px 8px; border-radius: 6px; }
.pseg .on { background: var(--bg-surface); color: var(--text-default); }
.pseg:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
.pline { display: grid; grid-template-columns: 16px 110px minmax(0, 1fr); gap: 8px; padding: 10px 12px; font-size: 14px; line-height: 20px; border-top: 0.5px solid var(--border-subtle); min-width: 0; }
.pline:first-of-type { border-top: 0; }
.pmc, .psc { font: 12px/16px "Geist Mono", ui-monospace, monospace; border-radius: 5px; padding: 1px 6px; }
.pmc { background: var(--bg-brand-subtle); color: var(--text-brand); }
.psc { background: var(--bg-neutral-subtle); display: inline-block; margin: 0 4px 4px 0; overflow-wrap: anywhere; }
.psql { font: 12px/19px "Geist Mono", ui-monospace, monospace; padding: 10px 12px; counter-reset: ln; overflow-x: auto; }
.psql > div { display: grid; grid-template-columns: 24px minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; }
.psql > div::before { counter-increment: ln; content: counter(ln); color: var(--text-placeholder); }
.ptree { display: grid; gap: 8px; }
.pnode { display: flex; align-items: flex-start; gap: 10px; }
.pnode.kid { margin-left: 13px; padding-left: 22px; border-left: 1px solid var(--border-default); }
.pbox { width: 28px; height: 28px; border-radius: 7px; border: 0.5px solid var(--border-control); display: grid; place-items: center; flex: none; }
.pnote { font-size: 12px; line-height: 17px; color: var(--text-subtle); }
/* Metric Studio's motion: a profile's content slides in 16 px and fades; a part a link went to is marked. A card's
   height and chevron move in script (PANEL). */
@keyframes pslide { from { opacity: 0; transform: translateX(16px); } }
.prof.enter { animation: pslide 240ms cubic-bezier(0.2, 0, 0, 1); }
.landed { animation: land 1.8s ease-out; }
@media (prefers-reduced-motion: reduce) { .prof.enter, .landed { animation: none; } }
</style>
</head>
<body>
<div id="app" aria-busy="true"></div>
<div class="sr" id="say" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* Formatting. Every string from the snapshot goes through esc() before it reaches the page. */
const MINUS = '−';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const txt = v => typeof v === 'string' ? v : isNum(v) ? String(v) : '';
const arr = v => Array.isArray(v) ? v : [];
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : null;
const grp = n => isNum(n) ? Math.round(n).toLocaleString('en-GB') : txt(n);
const pl = (n, one, many) => grp(n) + ' ' + (n === 1 ? one : (many || one + 's'));
const fixMinus = s => txt(s).replace(/(^|[\s(])-(?=[£$€\d])/g, '$1' + MINUS);
const lc = s => txt(s).toLowerCase();
function clock(iso) {
  const t = Date.parse(txt(iso));
  return Number.isNaN(t) ? '' : new Date(t).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
}
const prettySql = q => txt(q).replace(/\s+(FROM|WHERE|GROUP BY|ORDER BY|HAVING|UNION ALL|LEFT JOIN|INNER JOIN|JOIN|LIMIT)\b/g, '\n$1');

/* Icons: 24 px grid, 1.6 stroke */
const PATH = {
  metric: '<path d="M4 19.5h16"/><path d="M6 15.5l4-5 3.5 3 4.5-6.5"/>',
  tile: '<rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 15.5v-3M12 15.5v-6M15.5 15.5v-4.5"/>',
  query: '<path d="M9 7.5L4.5 12 9 16.5M15 7.5l4.5 4.5-4.5 4.5"/>',
  table: '<rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 10h16M10 10v9"/>',
  tick: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/>',
  tri: '<path d="M10.3 4.2 2.8 17.3a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 16.8v.2"/>',
  inc: '<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5M16 11a3 3 0 1 0 0-6M21 19c0-2.4-1.6-4.2-4-4.8"/>',
  exc: '<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
  unit: '<path d="M7 7h10v10H7z"/><path d="M4 12h3M17 12h3"/>',
  fx: '<path d="M14 4c-2 0-3 1-3.4 3L8.5 19c-.4 2-1.4 2-2.5 2M7 10h7"/>',
  flt: '<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',
    alert: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 15.8v.2"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  auto: '<rect x="3.5" y="5" width="17" height="11" rx="2"/><path d="M9 19.5h6M12 16v3.5"/>',
  sun: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v1.5M12 19v1.5M3.5 12H5M19 12h1.5M6 6l1.1 1.1M16.9 16.9L18 18M6 18l1.1-1.1M16.9 7.1L18 6"/>',
  moon: '<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>',
};
const ic = (n, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${PATH[n]}</svg>`;
const spin = () => '<svg class="spin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 6 6"/></svg>';

/* Reading the snapshot */
const metricsOf = S => arr(S.metrics).filter(m => obj(m) && txt(m.name));
const queriesOf = S => arr(S.queries).filter(obj);
const draftsOf = S => arr(S.drafts).filter(d => obj(d) && txt(d.name));
const cantOf = S => arr(S.cant).filter(c => obj(c) && txt(c.tile));
const findMetric = (S, name) => metricsOf(S).find(m => lc(m.name) === lc(name)) || null;
const findQuery = (S, id) => txt(id) ? queriesOf(S).find(q => txt(q.id) === txt(id)) || null : null;
const findDraft = (S, id) => draftsOf(S).find(d => txt(d.id) === txt(id)) || null;
/* What a screen reader hears as the page changes: the output, never the step. */
function outputLabel(S) {
  const ms = metricsOf(S), done = ms.filter(m => stateOf(m) === 'checked').length;
  return ms.length ? pl(ms.length, 'metric') + (done ? ', ' + grp(done) + ' tested' : '') : '';
}
const STOPPED = {paused: 'Paused', blocked: 'Waiting for your answer in the chat', access_needed: 'Waiting for access: see the chat'};

/* A metric's state, in the person's words (2026-11-18): found, defined, tested on the data, or needs your review. Combining
   duplicates happens to found metrics, so a merged one is still found until it is defined. When the person skips the
   checks nothing ran, so nothing failed: not tested is a state of its own (the team, 2026-11-19). One the save held
   back is left out of the agent, whatever its test said: held back is a state of its own too. */
const STATE = {draft: ['Found', ''], written: ['Defined', ''], untested: ['Not tested', 'idle'], checked: ['Tested', 'ok'], failed: ['Needs your review', 'warn'], kept: ['Held back', 'warn']};
const stageOf = m => m.stage === 'draft' || m.stage === 'merged' || m.stage === 'kept' ? m.stage : m.status === 'draft' ? 'draft' : 'final';
function stateOf(m) {
  const s = stageOf(m);
  if (s === 'draft' || s === 'merged') return 'draft';
  if (s === 'kept') return 'kept';
  if (m.status === 'look') return 'failed';
  return m.status === 'checked' ? 'checked' : m.status === 'untested' ? 'untested' : 'written';
}
/* A state as Metric Studio marks a release: a hollow ring until it is defined, a quiet dot once
   defined, a green one once tested, a warning one when it needs your review or was held back. */
const MARK = {draft: 'ring', written: '', untested: 'idle', checked: 'ok', failed: 'warn', kept: 'warn'};
const marker = (label, tone) => `<span class="rel${tone ? ' ' + tone : ''}"><i class="dt"></i>${esc(label)}</span>`;
const stateMark = m => marker(STATE[stateOf(m)][0], MARK[stateOf(m)]);
/* In the lists, the design system's StatusBadge: a status leads with its tone's glyph (a tick, a triangle); a state that
   is not one draws none. */
const badgeOf = (label, tone) => `<span class="badge${tone ? ' ' + tone : ''}">${tone === 'ok' ? ic('tick') : tone === 'warn' ? ic('tri') : ''}${esc(label)}</span>`;
const stateBadge = m => badgeOf(...STATE[stateOf(m)]);

/* Top of the page */
function toolbar(S, UI) {
  const word = {live: 'Live', retry: 'Reconnecting', off: 'Not live', wait: 'Connecting'}[UI.link] || 'Connecting';
  const t = S ? clock(S.updated) : '';
  const themes = [['system', 'auto', 'Match the system theme'], ['light', 'sun', 'Light theme'], ['dark', 'moon', 'Dark theme']];
  return `<div class="tb"><span class="lv ${esc(UI.link)}"><i class="dot" aria-hidden="true"></i><span class="st">${word}</span>`
    + (t ? `<span class="when num">· Updated ${esc(t)}</span>` : '') + '</span>'
    + `<span class="tgl" role="group" aria-label="Theme">${themes.map(([k, i, label]) => `<button type="button" data-theme-set="${k}" data-k="theme:${k}" aria-pressed="${UI.theme === k}" aria-label="${label}" title="${label}">${ic(i, 's')}</button>`).join('')}</span></div>`;
}
function offNote(S) {
  const t = clock(S.updated);
  return `<div class="card empty">${ic('alert', 's')}<span><b>This page has stopped updating.</b> It shows the last update${t ? ', from ' + esc(t) : ''}, and refreshes on its own when it reconnects.</span></div>`;
}
function topBlock(S) {
  const eb = 'Atlan Analytics · ' + (S.flow === 'demo' ? 'demo on made-up data' : 'your data') + (txt(S.firm) ? ' · ' + txt(S.firm) : '');
  // A demo names its agent ("Your job profit agent"); own data names its use case. With nothing to say under it, the
  // line says what the page holds.
  const head = txt(S.agent) ? 'Your ' + txt(S.agent) : txt(S.title) || 'Your agent';
  const sub = txt(S.subtitle) || 'Everything found for your agent so far. Ask it in the chat.';
  return `<div class="tp"><div class="eb">${esc(eb)}</div><h1 class="tt">${esc(head)}</h1><div class="ts">${esc(sub)}</div></div>`;
}
/* The lists */
function section(key, title, n, open, body, foldable) {
  const head = foldable
    ? `<button type="button" class="sech" data-tog="${key}" data-k="t:${key}" aria-expanded="${open}">${esc(title)} <span class="n num">${esc(grp(n))}</span>${ic('chev', 's chev')}</button>`
    : `<div class="sech">${esc(title)} <span class="n num">${esc(grp(n))}</span></div>`;
  return `<div class="sec">${head}${open ? body : ''}</div>`;
}
const openOf = (UI, key, def) => UI.tog.has(key) ? !def : def;
/* What the step under way is working on: its rows say so before they change, so a change is expected, not sudden.
   By stage: a merged metric is Found, but merging is over for it. */
const PENDING = {merge: [['draft'], 'being merged'], rules: [['draft', 'merged'], 'being defined']};
function pendingOf(S, s) {
  const p = PENDING[(arr(S.build).find(b => obj(b) && b.state === 'now') || {}).id];
  return p && p[0].includes(s) ? p[1] : '';
}
/* A row's second line: what the step under way is doing to it, else what its state has. */
const named = (name, pend, sub, fit = 'ell') => `<span class="mm"><span class="nm ${fit}">${esc(name)}</span>${pend || sub ? `<span class="pw ell">${esc(pend || sub)}</span>` : ''}</span>`;
/* Metric Studio's view pills: plain words, the count apart and muted, the chosen one on a grey pill. */
const pills = (act, label, items, cur) => `<div class="flt" role="group" aria-label="${esc(label)}">${items.map(([k, name, n]) => `<button type="button" data-act="${act}" data-v="${k}" data-k="${act}:${k}" aria-pressed="${cur === k}"${k !== 'all' && !n ? ' disabled' : ''}>${esc(name)} <span class="n num">${esc(grp(n))}</span></button>`).join('')}</div>`;
const lead = t => (txt(t).match(/^.*?[.!?](?=\s+[A-Z]|$)/) || [txt(t)])[0];
const dataOf = S => txt(S.firm) ? txt(S.firm) + '’s data' : 'your data';
/* The person, 2026-11-18: "if you found something, why can't it be defined?" A found row says where it was found, a
   defined one how it is worked out. */
const gist = t => lead(t).split(/:\s/)[0].replace(/[.!?]$/, '');
const rowSub = (m, s) => s === 'draft' ? (madeFrom(m) ? 'Found in ' + madeFrom(m) : '') : txt(m.description) && !engineWords(gist(m.description)) ? gist(m.description) : '';
function metricRow(S, UI, m) {
  const s = stateOf(m), sel = lc(UI.metric) === lc(m.name), pend = pendingOf(S, stageOf(m) === 'merged' ? 'merged' : s);
  return `<button type="button" class="row${sel ? ' sel' : ''}${pend ? ' pend' : ''}" data-act="m" data-m="${esc(m.name)}" data-k="m:${esc(m.name)}" data-f="m:${esc(m.name)}" data-s="${s}">`
    + named(m.name, pend, rowSub(m, s)) + (kindTag(m) ? `<span class="ty">${esc(kindTag(m))}</span>` : '')
    + (s === 'checked' && txt(m.value) ? `<span class="v num" title="Tested on the data">${esc(fixMinus(m.value))}</span>` : '') + stateBadge(m) + '</button>';
}
/* A draft no merge has taken yet is a metric in its first state; a merged one lives inside the metric it became. */
function draftRow(S, UI, d) {
  const pend = pendingOf(S, 'draft') === PENDING.merge[1] ? PENDING.merge[1] : '';
  return `<button type="button" class="row${UI.draft === d.id ? ' sel' : ''}${pend ? ' pend' : ''}" data-act="d" data-d="${esc(d.id)}" data-k="d:${esc(d.id)}" data-f="d:${esc(d.id)}" data-s="draft" title="${esc(d.question || '')}">`
    + `${named(d.name, pend)}${stateBadge({stage: 'draft'})}</button>`;
}
function metricsList(S, UI) {
  const ms = metricsOf(S), named = new Set(ms.map(m => lc(m.name)));
  const ds = draftsOf(S).filter(d => !txt(d.into) && !named.has(lc(d.name)));
  const n = ms.length + ds.length;
  if (!n) return [0, `<div class="card empty">${ic('metric', 's')}<span>Your agent’s metrics appear here as they’re found.</span></div>`];
  const counts = {};
  ms.forEach(m => { const s = stateOf(m); counts[s] = (counts[s] || 0) + 1; });
  if (ds.length) counts.draft = (counts.draft || 0) + ds.length;
  const f = UI.filter && counts[UI.filter] ? UI.filter : 'all';
  // Every state keeps its tab, with its count, so no tab moves as the build fills them; an empty one cannot be picked.
  // Not tested and held back come only from a choice or a save, so each shows once it has an item.
  const chips = pills('flt', 'Show', [['all', 'All', n], ...Object.keys(STATE).filter(s => (s !== 'untested' && s !== 'kept') || counts[s]).map(s => [s, STATE[s][0], counts[s] || 0])], f);
  const rows = ms.filter(m => f === 'all' || stateOf(m) === f).map(m => metricRow(S, UI, m))
    .concat(f === 'all' || f === 'draft' ? ds.map(d => draftRow(S, UI, d)) : []);
  const order = `<div class="lgd">Each metric is found in your sources, then defined to say exactly how it’s worked out, then tested on ${esc(dataOf(S))}.</div>`;
  return [n, chips + order + `<div class="lst">${rows.join('')}</div>`];
}
function cantBlock(S, UI) {
  const cs = cantOf(S);
  if (!cs.length) return '';
  const open = openOf(UI, 'cant', false);
  const body = `<div class="card lst">${cs.map(c => `<div class="cant">${ic('alert', 's')}<span class="mm"><span class="nm">${esc(c.tile)}</span><span class="ty">${esc(c.why)}${txt(c.page) ? ' · ' + esc(c.page) : ''}</span></span></div>`).join('')}</div>`;
  return section('cant', 'Tiles left out', cs.length, open, body, true);
}
/* Queries in one order every time, whichever list they come from (the engine's before the checks, the checked
   context's after): dashboard tiles first, then past queries most run first. Each shows its state, like a metric. */
const qstateOf = q => q.status === 'checked' ? 'checked' : q.status === 'kept' ? 'kept' : q.status === 'look' ? 'failed' : q.status === 'untested' ? 'untested' : 'written';
const QTABS = ['written', 'untested', 'checked', 'failed', 'kept'];
const QLABEL = {written: 'Found', untested: 'Not tested', checked: 'Tested', failed: 'Needs your review', kept: 'Held back'};
const qsaid = q => txt(q.question) || txt(q.name);
function queriesList(S, UI) {
  const qs = queriesOf(S).slice().sort((a, b) => (a.kind === 'tile' ? 0 : 1) - (b.kind === 'tile' ? 0 : 1)
    || (isNum(b.runs) ? b.runs : 0) - (isNum(a.runs) ? a.runs : 0) || lc(qsaid(a)).localeCompare(lc(qsaid(b))));
  if (!qs.length) return [0, ''];
  const counts = {};
  qs.forEach(q => { const s = qstateOf(q); counts[s] = (counts[s] || 0) + 1; });
  const f = UI.qfilter && counts[UI.qfilter] ? UI.qfilter : 'all';
  const tabs = pills('qflt', 'Show', [['all', 'All', qs.length], ...QTABS.filter(s => (s !== 'untested' && s !== 'kept') || counts[s]).map(s => [s, QLABEL[s], counts[s] || 0])], f);
  const rows = qs.filter(q => f === 'all' || qstateOf(q) === f).map(q => {
    const s = qstateOf(q), pend = pendingOf(S, s);
    return `<button type="button" class="row qr${pend ? ' pend' : ''}" data-act="q" data-q="${esc(q.id)}" data-k="q:${esc(q.id)}" data-f="q:${esc(q.id)}" data-s="${s}">${named(qsaid(q), pend, sourceSaid(q) + (q.review === 'read' ? ' · good to know' : ''), 'cl2')}${s === 'checked' && txt(q.value) ? `<span class="v num">${esc(fixMinus(q.value))}</span>` : ''}${badgeOf(QLABEL[s], STATE[s][1])}</button>`;
  });
  return [qs.length, tabs + `<div class="lst">${rows.join('')}</div>`];
}
/* Before any metric the page opens on the queries in plain words, until a metric lands or the person picks a list. */
function listOf(S, UI) {
  const qn = queriesList(S, UI)[0], mn = metricsList(S, UI)[0];
  return qn && (UI.list === 'queries' || !UI.list && !mn) ? 'queries' : 'metrics';
}
/* One switch between the lists, metrics first (the person's pick, 2026-11-18), as Studio keeps metrics and saved
   queries on separate pages: a long query list never pushes the metrics down, and one list moves at a time. */
function lists(S, UI) {
  const [mn, mb] = metricsList(S, UI), [qn, qb] = queriesList(S, UI), cur = listOf(S, UI);
  return `<div class="sec">${pills('list', 'Show list', [['metrics', 'Metrics', mn], ['queries', 'Saved queries', qn]], cur).replace('class="flt"', 'class="flt top"')}${cur === 'queries' ? qb : mb}</div>` + cantBlock(S, UI);
}

/* A metric's own view, under the checklist */
const blk = (label, body) => body ? `<div class="kv"><div class="lb">${esc(label)}</div><div class="vv">${body}</div></div>` : '';
const para = t => txt(t) ? `<div>${esc(t)}</div>` : '';
const bullets = xs => arr(xs).length ? `<ul>${arr(xs).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const code = (t, key, UI, label) => {
  if (!txt(t)) return '';
  if (!key) return `<pre class="code">${esc(t)}</pre>`;
  const open = UI.tog.has(key);

  const flip = () => { if (UI.tog.has(k)) UI.tog.delete(k); else UI.tog.add(k); };
  const row = rowOf(k);
  if (!row || !MOTION) { flip(); paint(); return; }
  const body = row.querySelector('.prow-b'), chev = row.querySelector('.prow-h .chev');
  if (row.classList.contains('open') && body) {
    body.style.overflow = 'hidden';
    if (chev) chev.animate([{transform: 'rotate(180deg)'}, {transform: 'rotate(0deg)'}], PANEL);
    // A background tab holds an animation's finish back; the timer closes it all the same, once.
    let shut = false;
    const close = () => { if (shut) return; shut = true; flip(); paint(); };
    body.animate([{height: body.offsetHeight + 'px', opacity: 1}, {height: '0px', opacity: 0}], PANEL).onfinish = close;
    setTimeout(close, PANEL.duration + 60);
    return;
  }
  flip(); paint();
  const now = rowOf(k), opened = now && now.querySelector('.prow-b'), c2 = now && now.querySelector('.prow-h .chev');
  if (opened) { opened.style.overflow = 'hidden'; opened.animate([{height: '0px', opacity: 0}, {height: opened.offsetHeight + 'px', opacity: 1}], PANEL).onfinish = () => { opened.style.overflow = ''; }; }
  if (c2) c2.animate([{transform: 'rotate(0deg)'}, {transform: 'rotate(180deg)'}], PANEL);
}
/* Metric Studio's reveal: a link to a part of the page opens it, scrolls there with an ease in and out over
   the smaller of 700 ms and 280 ms plus 0.2 ms a pixel, then marks it with the landed ring. */
function reveal(k) {
  const wasOpen = rowOf(k) && rowOf(k).classList.contains('open');
  if (!rowOf(k)) return;
  if (!wasOpen) togglePanel(k);
  const go = () => {
    const row = rowOf(k);
    if (!row) return;
    const box = UI.wide ? app.querySelector('.wr') : null, from = box ? box.scrollTop : window.scrollY;
    const dist = row.getBoundingClientRect().top - (box ? box.getBoundingClientRect().top : 0) - 12;
    const ms = MOTION ? Math.min(700, 280 + 0.2 * Math.abs(dist)) : 0, t0 = performance.now();
    const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const step = time => {
      const f = ms ? Math.min(1, (time - t0) / ms) : 1, y = from + dist * ease(f);
      if (box) box.scrollTop = y; else window.scrollTo(0, y);
      if (f < 1) { requestAnimationFrame(step); return; }
      if (MOTION) { row.classList.remove('landed'); void row.offsetWidth; row.classList.add('landed'); }
    };
    requestAnimationFrame(step);
  };
  if (!wasOpen && MOTION) setTimeout(go, 320); else go();
}
function paint(fresh) {
  const before = fresh && MOTION && seenOnce && !UI.metric && !UI.query && !UI.draft ? placesOf() : null;
  const y = window.scrollY, wr = app.querySelector('.wr'), wy = wr ? wr.scrollTop : 0;
  const ae = document.activeElement, fk = ae && app.contains(ae) && ae.dataset ? ae.dataset.k : null;
  app.innerHTML = view(S, UI);
  const painted = !!S && seenOnce;
  if (S) seenOnce = true;
  app.removeAttribute('aria-busy');
  // Marked only when new data brought the change: a row a click shows for the first time is not new.
  app.querySelectorAll('[data-f]').forEach(n => {
    const k = n.dataset.f, s = n.dataset.s;
    if (fresh && STA[k] != null && STA[k] !== s) n.classList.add('fl');
    else if (fresh && STA[k] == null && painted) n.classList.add('nw');
    STA[k] = s;
  });
  window.scrollTo(0, y);
  const wr2 = app.querySelector('.wr');
  if (wr2) wr2.scrollTop = wy;
  if (fk) { const el = [...app.querySelectorAll('[data-k]')].find(x => x.dataset.k === fk); if (el) el.focus({preventScroll: true}); }
  if (before) settle(before);
  // Studio's motion: a profile slides in when it is opened, never when new data repaints it.
  const dk = UI.metric ? 'm:' + UI.metric : UI.query ? 'q:' + UI.query : UI.draft ? 'd:' + UI.draft : '';
  if (dk && dk !== shownDetail) { const pf = app.querySelector('.prof'); if (pf) pf.classList.add('enter'); }
  shownDetail = dk;
  const line = S ? outputLabel(S) : '';
  if (line !== said) { said = line; document.getElementById('say').textContent = line; }
  writeHash();
}
function setTheme(t) {
  UI.theme = t === 'light' || t === 'dark' ? t : 'system';
  if (UI.theme === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = UI.theme;
  try { localStorage.setItem(THEME_KEY, UI.theme); } catch (e) { /* storage is optional */ }
}

const started = Date.now();
let es = null, pollTimer = null, retryTimer = null, lastOk = 0, polledAt = 0;
function accept(data, fromPoll) {
  let s = data, r = data;
  try { if (typeof data === 'string') s = JSON.parse(data); else r = JSON.stringify(data); } catch (e) { return; }
  if (!obj(s) || !Array.isArray(s.metrics)) return;
  lastOk = Date.now();
  if (fromPoll) polledAt = lastOk;
  if (r === raw) return;
  raw = r;
  S = s;
  paint(true);
}
async function poll() {
  try {
    const res = await fetch('state', {cache: 'no-store'});
    if (res.ok) accept(await res.json(), true);
  } catch (e) { /* not answering; the next try is 3 s away */ }
}
function startPolling() { if (!pollTimer) { poll(); pollTimer = setInterval(poll, 3000); } }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function connect() {
  if (typeof EventSource === 'undefined') { startPolling(); return; }
  try { es = new EventSource('events'); } catch (e) { es = null; startPolling(); retryLater(); return; }
  es.onopen = () => { lastOk = Date.now(); stopPolling(); health(); };
  es.onmessage = e => { accept(e.data, false); stopPolling(); health(); };
  es.onerror = () => {
    startPolling();
    if (es && es.readyState === EventSource.CLOSED) { es.close(); es = null; retryLater(); }
    health();
  };
}
function retryLater() { if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; if (!es) connect(); }, 5000); }
function health() {
  const t = Date.now(), open = !!es && es.readyState === EventSource.OPEN;
  if (open) lastOk = t;
  const link = open || (polledAt && t - polledAt < 10000) ? 'live'
    : lastOk && t - lastOk <= 30000 ? 'retry'
    : lastOk || t - started > 30000 ? 'off' : 'wait';
  if (link !== UI.link) { UI.link = link; paint(); }
}

document.addEventListener('click', e => {
  const th = e.target.closest('[data-theme-set]');
  if (th) { setTheme(th.dataset.themeSet); paint(); return; }
  const tg = e.target.closest('[data-tog]');
  if (tg) { const k = tg.dataset.tog; if (k.startsWith('p:')) { togglePanel(k); return; } if (UI.tog.has(k)) UI.tog.delete(k); else UI.tog.add(k); paint(); return; }
  const a = e.target.closest('[data-act]');
  if (!a || !app.contains(a)) return;
  const act = a.dataset.act;
  if (act === 'reveal') { reveal(a.dataset.v); return; }
  if (act === 'copy') {
    const done = () => { a.textContent = 'Copied'; setTimeout(() => { a.textContent = 'Copy'; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(a.dataset.v).then(done, () => {});
    return;
  }
  if (act === 'flt') {
    UI.filter = a.dataset.v === 'all' ? null : a.dataset.v;
    paint();
  } else if (act === 'list') {
    UI.list = a.dataset.v;
    paint();
  } else if (act === 'qflt') {
    UI.qfilter = a.dataset.v === 'all' ? null : a.dataset.v;
    paint();
  } else if (act === 'd') {
    UI.draft = a.dataset.d; UI.metric = null; UI.query = null; UI.from = null;
    paint();
    window.scrollTo(0, 0);
  } else if (act === 'm' || act === 'q') {
    UI.draft = null;
    if (act === 'm') { UI.metric = a.dataset.m; UI.query = null; UI.from = null; }
    else { UI.from = UI.query ? UI.from : UI.metric; UI.metric = null; UI.query = a.dataset.q; }
    paint();
    if (!UI.wide) { const b = app.querySelector('.back'); if (b) { const y = b.getBoundingClientRect().top + window.scrollY - 12; if (window.scrollY > y) window.scrollTo(0, y); } }
    else { const wr = app.querySelector('.wr'); if (wr) wr.scrollTop = 0; }
  } else if (act === 'back' && UI.query) {
    const was = UI.query;
    UI.query = null; UI.metric = UI.from; UI.from = null;
    paint();
    const r = UI.metric ? null : [...app.querySelectorAll('.qr')].find(x => x.dataset.q === was);
    if (r) { r.scrollIntoView({block: 'center'}); r.focus({preventScroll: true}); }
  } else if (act === 'back' && UI.draft) {
    UI.draft = null;
    paint();
  } else if (act === 'back') {
    const was = lc(UI.metric);
    UI.metric = null;
    paint();
    const r = [...app.querySelectorAll('.row[data-m]')].find(x => lc(x.dataset.m) === was);
    if (r) { r.scrollIntoView({block: 'center'}); r.focus({preventScroll: true}); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ((UI.metric || UI.query || UI.draft) && !UI.wide) { const b = app.querySelector('.back'); if (b) b.click(); }
  else if (UI.query) { UI.query = null; UI.metric = UI.from; UI.from = null; paint(); }
});
window.addEventListener('hashchange', () => { readHash(); paint(); window.scrollTo(0, 0); });
const wideQuery = window.matchMedia('(min-width: 920px)');
const onWide = () => { UI.wide = wideQuery.matches; paint(); };
if (wideQuery.addEventListener) wideQuery.addEventListener('change', onWide); else if (wideQuery.addListener) wideQuery.addListener(onWide);

let savedTheme = 'system';
try { savedTheme = localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { /* storage is optional */ }
setTheme(savedTheme);
UI.wide = wideQuery.matches;
readHash();
paint();
poll();
connect();
setInterval(health, 1000);

window.SidePage = Object.freeze({
  view: (snapshot, ui) => view(snapshot, Object.assign({metric: null, query: null, draft: null, filter: null, from: null, tog: new Set(), wide: false, link: 'live', theme: 'system'}, ui || {})),
});
})();
</script>
</body>
